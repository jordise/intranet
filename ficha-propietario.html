<!DOCTYPE html>
<html lang="es">
<!-- VERSIÓN ACTUAL: v01 | Historial completo al final de este archivo -->
<head>
  <!-- El token del enlace viaja en la barra de direcciones hasta que el script
       lo borra. Con strict-origin ninguna petición que salga de esta página
       (la fuente de Google, la propia comprobación de versión) lleva la URL
       completa en la cabecera Referer: solo el origen. Va lo primero del head
       para que valga también para las etiquetas de abajo. -->
  <meta name="referrer" content="strict-origin">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C8102E">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://www.3villas.com/intranet/icon-corazon-rojo-fondo-transparente.png">
  <title>Ficha Propietario v01 — 3Villas</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
  :root{
    --red:#C8102E;--red-dark:#9e0c24;--red-light:#fce8eb;
    --green:#1e9e4e;--green-light:#e6f7ee;
    --blue:#1565c0;--blue-light:#e8f1fb;
    --gray-1:#f4f5f7;--gray-2:#e8eaed;--gray-3:#c4c9d4;--gray-4:#7a8194;--gray-5:#2d3142;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Open Sans',sans-serif;background:var(--gray-1);color:var(--gray-5);
    font-size:15px;line-height:1.5;padding-bottom:110px}

  /* ── Cabecera ── */
  .page-header{background:#fff;text-align:center;padding:12px 16px 12px;
    border-bottom:1px solid var(--gray-2);position:relative}
  .page-logo{height:44px;display:block;margin:0 auto 6px;max-width:170px;object-fit:contain}
  .page-title{font-family:Montserrat,sans-serif;font-size:15px;font-weight:900;color:var(--red)}
  .page-villa{font-size:12px;color:var(--gray-4);margin-top:2px}
  #langWrap{position:absolute;top:12px;right:12px}
  /* 36 px de alto y de ancho mínimos: se pulsa con el dedo en el móvil. */
  #langSel{font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;
    border:1.5px solid var(--gray-3);border-radius:9px;padding:7px 10px;background:#fff;
    color:var(--gray-5);cursor:pointer;outline:none;min-height:36px;min-width:64px}

  /* ── Progreso ── */
  .prog-wrap{background:#fff;padding:8px 16px 12px;border-bottom:1px solid var(--gray-2);
    position:sticky;top:0;z-index:50}
  .prog-lbl{font-family:Montserrat,sans-serif;font-size:11px;font-weight:800;
    color:var(--gray-4);margin-bottom:5px;text-align:center}
  .prog-bar{height:7px;background:var(--gray-2);border-radius:5px;overflow:hidden}
  .prog-fill{height:100%;background:var(--red);border-radius:5px;transition:width .25s}

  /* ── Contenido ── */
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
  .card{background:#fff;border-radius:14px;padding:16px 14px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .paso-h{font-family:Montserrat,sans-serif;font-size:17px;font-weight:900;
    color:var(--gray-5);margin-bottom:4px}
  .paso-sub{font-size:12px;color:var(--gray-4);margin-bottom:14px}
  .fld{margin-bottom:14px}
  .fld label,.fld .lbl{display:block;font-family:Montserrat,sans-serif;font-size:12px;
    font-weight:800;color:var(--gray-5);margin-bottom:5px}
  .fld .req{color:var(--red)}
  .fld input[type=text],.fld input[type=email],.fld input[type=tel],
  .fld input[type=number],.fld select,.fld textarea{
    width:100%;border:1.5px solid var(--gray-2);border-radius:10px;padding:11px 12px;
    font-size:16px;font-family:'Open Sans',sans-serif;color:var(--gray-5);background:#fff;outline:none}
  .fld textarea{min-height:76px;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--red);
    box-shadow:0 0 0 3px rgba(200,16,46,.08)}
  .fld.malo input,.fld.malo select,.fld.malo textarea{border-color:var(--red);background:var(--red-light)}
  .fld .hint{font-size:11px;color:var(--gray-4);margin-top:4px}
  .fld .msg{font-size:12px;font-weight:600;color:var(--red);margin-top:4px;display:none}
  .fld.malo .msg{display:block}

  /* ── Sí / No ── */
  .sino{display:flex;gap:8px}
  .sino button{flex:1;border:1.5px solid var(--gray-2);background:#fff;border-radius:10px;
    padding:10px 6px;font-family:Montserrat,sans-serif;font-size:13px;font-weight:800;
    color:var(--gray-4);cursor:pointer}
  .sino button.on{background:var(--red);border-color:var(--red);color:#fff}

  /* ── Fotos ── */
  .foto{border:1.5px dashed var(--gray-3);border-radius:12px;padding:12px;text-align:center;
    background:var(--gray-1);position:relative}
  .foto img{max-width:100%;max-height:170px;border-radius:10px;display:block;margin:0 auto 8px}
  .foto .pdf{font-family:Montserrat,sans-serif;font-size:12px;font-weight:800;color:var(--red);
    display:block;margin-bottom:8px;word-break:break-all}
  .foto .bot{display:inline-block;background:var(--red);color:#fff;border:none;border-radius:10px;
    padding:9px 16px;font-family:Montserrat,sans-serif;font-size:12px;font-weight:800;cursor:pointer}
  .foto input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .foto .est{font-size:11px;font-weight:700;margin-top:6px;color:var(--gray-4)}
  .foto .est.mal{color:var(--red)}

  /* ── Grupos repetibles ── */
  .grupo{border:1.5px solid var(--gray-2);border-radius:12px;padding:12px;margin-bottom:10px;
    background:var(--gray-1)}
  .grupo-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .grupo-t{font-family:Montserrat,sans-serif;font-size:13px;font-weight:900;color:var(--red)}
  /* 36 px de alto y de ancho mínimos: es un botón que se pulsa con el dedo. */
  .grupo-x{background:#fff;border:1.5px solid var(--gray-3);border-radius:9px;
    color:var(--gray-4);font-family:Montserrat,sans-serif;font-size:12px;font-weight:800;
    cursor:pointer;min-height:36px;min-width:76px;padding:8px 12px}
  .add-bot{width:100%;border:1.5px dashed var(--red);background:var(--red-light);color:var(--red);
    border-radius:12px;padding:11px;font-family:Montserrat,sans-serif;font-size:13px;
    font-weight:800;cursor:pointer;margin-bottom:6px}

  /* ── Bloque de documentos y fotos del paso 1 ── */
  .docs{border:1.5px solid var(--gray-2);background:var(--gray-1);border-radius:12px;
    padding:12px;margin:18px 0 0}
  .docs h3{font-family:Montserrat,sans-serif;font-size:13px;font-weight:900;color:var(--gray-5);
    margin-bottom:4px}
  .docs p{font-size:12px;color:var(--gray-4);margin-bottom:12px}

  /* ── Bloque fiscal ── */
  .fiscal{border:1.5px solid var(--blue);background:var(--blue-light);border-radius:12px;
    padding:12px;margin:16px 0}
  .fiscal h3{font-family:Montserrat,sans-serif;font-size:13px;font-weight:900;color:var(--blue);
    margin-bottom:4px}
  .fiscal p{font-size:12px;color:var(--gray-5);margin-bottom:10px}

  /* ── Consentimiento ── */
  .consent{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--gray-2);
    border-radius:12px;padding:12px;background:#fff;margin-top:6px}
  .consent.malo{border-color:var(--red);background:var(--red-light)}
  .consent input{width:22px;height:22px;flex-shrink:0;margin-top:1px;accent-color:var(--red)}
  .consent span{font-size:13px}

  /* ── Pie de navegación ── */
  .navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--gray-2);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;
    max-width:560px;margin:0 auto;z-index:60}
  .navbar button{flex:1;border-radius:12px;padding:13px 8px;font-family:Montserrat,sans-serif;
    font-size:14px;font-weight:800;cursor:pointer;border:1.5px solid var(--gray-3);
    background:#fff;color:var(--gray-4)}
  .navbar button.pri{background:var(--red);border-color:var(--red);color:#fff;flex:2}
  .navbar button:disabled{opacity:.55;cursor:default}

  /* ── Avisos ── */
  #aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90;
    background:var(--green);color:#fff;font-family:Montserrat,sans-serif;font-size:13px;
    font-weight:800;padding:10px 18px;border-radius:22px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  #aviso.mal{background:var(--red)}
  .errbox{border:1.5px solid var(--red);background:var(--red-light);color:var(--red-dark);
    border-radius:12px;padding:12px;font-size:13px;font-weight:600;margin-bottom:14px;display:none}
  .okbox{border:1.5px solid var(--green);background:var(--green-light);color:#14663a;
    border-radius:12px;padding:12px;font-size:13px;font-weight:600;margin-bottom:14px}
  .pantalla{max-width:560px;margin:0 auto;padding:40px 22px;text-align:center}
  .pantalla h2{font-family:Montserrat,sans-serif;font-size:19px;font-weight:900;
    color:var(--gray-5);margin-bottom:10px}
  .pantalla p{font-size:14px;color:var(--gray-4)}
  .pie{text-align:center;font-size:11px;color:var(--gray-4);padding:16px 0 24px}
  </style>
</head>
<body>

<div class="page-header">
  <img class="page-logo" src="logo-negro.png" alt="3Villas"
       onerror="this.onerror=null;this.src='icon-corazon-rojo-fondo-transparente.png';this.style.height='36px'">
  <div class="page-title" id="hTitulo">Ficha de propietario</div>
  <div class="page-villa" id="hVilla"></div>
  <div id="langWrap">
    <select id="langSel" onchange="cambiarIdioma(this.value)">
      <option value="es">ES</option>
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="de">DE</option>
      <option value="it">IT</option>
    </select>
  </div>
</div>

<div class="prog-wrap" id="progWrap" style="display:none">
  <div class="prog-lbl" id="progLbl"></div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<div class="pantalla" id="pCargando"><h2 id="txtCargando">Cargando…</h2></div>
<div class="pantalla" id="pCerrada" style="display:none"><h2 id="txtCerrada"></h2></div>
<div class="pantalla" id="pGracias" style="display:none"><h2 id="txtGracias"></h2><p id="txtGraciasSub"></p></div>

<div class="wrap" id="wrap" style="display:none">
  <div class="okbox" id="bannerEnviada" style="display:none"></div>
  <div class="errbox" id="errBox"></div>
  <div class="card">
    <div class="paso-h" id="pasoH"></div>
    <div class="paso-sub" id="pasoSub"></div>
    <div id="campos"></div>
  </div>
  <div class="pie" id="pie">3Villas · Ficha de propietario</div>
</div>

<div class="navbar" id="navbar" style="display:none">
  <button type="button" id="btnAnt" onclick="irAnterior()">Anterior</button>
  <button type="button" class="pri" id="btnSig" onclick="irSiguiente()">Siguiente</button>
</div>

<div id="aviso"></div>

<script src="ficha-campos.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   ficha-propietario.html v01 — la ficha que rellena el PROPIETARIO.
   Página PÚBLICA: no lleva auth.js ni nav.js. La única credencial es el
   token del enlace (?acceso=…), que se lee, se guarda en memoria y en
   sessionStorage y se quita de la barra de direcciones, igual que hace
   checkin-auth.js v23 con el enlace de acceso del huésped.
   Nunca se escribe en la consola ningún dato del propietario.
   ════════════════════════════════════════════════════════════════════ */
'use strict';
var API = 'https://www.3villas.com/intranet/api';
var PAGE_VERSION = 1;
var TOTAL_PASOS = 9;

/* ── Los nueve pasos. Cada paso nombra sus columnas de TaVillas_ficha en
      el orden en que se pintan. La prueba comprueba que entre los nueve
      están TODAS las columnas de ficha-campos.js con step >= 1. ── */
var PASOS = [
  /* Paso 1: primero lo que se contesta de memoria; los seis archivos y fotos
     van al final, en el bloque "Documentos y fotos", para que nadie se
     atasque buscando un PDF antes de escribir su nombre. */
  { n:1, campos:['ownerName','propertyName','email','phone','address','googlemaps_link',
      'referencia_catastral','licenseNumber','registrationNumber',
      'legalCapacity','totalCapacity','keyboxNumber','alarmCode','observations_general',
      'licenseFile','registrationFile','floorPlanFile',
      'foto_etv_plate','foto_house_plate','foto_keybox'] },
  { n:2, campos:['acLivingRoom','acBedrooms','numberOfFans','dehumidifiers','hasHeating',
      'observations_climatization'] },
  { n:3, campos:['totalBedrooms','bedrooms_json','observations_bedrooms'] },
  { n:4, campos:['totalBathrooms','bathrooms_json','sharedBathrooms_json','observations_bathrooms'] },
  { n:5, campos:['hasDishwasher','hasOven','hasMicrowave','hasCoffeeMaker','coffeeMakerType',
      'hasWashingMachine','hasDryer','hasIron','hasHairDryer','stoveType',
      'numberOfCribs','numberOfHighChairs','observations_equipment'] },
  { n:6, campos:['electricalPanelLocation','foto_electricalPanel','electricitySupplier',
      'electricityMeterLocation','waterShutoffLocation','foto_waterShutoff','waterSupplier',
      'waterMeterLocation','waterHeaterType','waterHeaterLocation','gasSupplier','gasLocation',
      'hasSolarPanels','solarPanelsInfo','solarPanelsPdf','hasJacuzzi','jacuzziInfo','jacuzziPdf',
      'hasSmokeDetector','fireExtinguisherLocation','hasFirstAidKit','firstAidLocation',
      'observations_facilities'] },
  { n:7, campos:['internetProvider','contractedSpeed','wifiUsername','wifiPassword',
      'whoContractsInternet','smartTvSatelliteNetflix','hasSafe','safeCode','foto_safe',
      'hasBoardGames','observations_entertainment'] },
  { n:8, campos:['hasPool','poolType','poolDimensions','poolMinDepth','poolMaxDepth',
      'hasChildBarrier','isHeatedPool','hasOutdoorShower','foto_pool','hasBBQ','bbqType',
      'hasSeaViews','seaViewsFrom','parking','foto_exterior1','foto_exterior2','foto_exterior3',
      'distanceBeach','distanceSupermarket','distanceRestaurant','distancePharmacy',
      'distanceAirport','beachTowelsProvided','publicTransport','taxiTransfers',
      'observations_exterior'] },
  { n:9, campos:['currentCleaner','currentGardener','currentPoolCompany','changeoverDay',
      'acceptsPets','houseRules','ownerComments','observations_rules',
      'fiscal_nif','fiscal_name','fiscal_address','fiscal_municipio',
      'acceptedTerms','acceptedTerms_at'] }
];

/* ── Las tres listas que viajan como JSON dentro de una sola columna ── */
var REPEAT = { bedrooms_json:'bedrooms', bathrooms_json:'bathrooms', sharedBathrooms_json:'sharedBathrooms' };

/* ── Los seis archivos y fotos del paso 1, en su bloque del final ── */
var CAMPOS_DOCS = ['licenseFile','registrationFile','floorPlanFile',
  'foto_etv_plate','foto_house_plate','foto_keybox'];

/* ── Control de pantalla por columna. Sin entrada aquí, el tipo del
      esquema decide: INTEGER -> número, YES/NO -> Sí/No, TEXT -> área de
      texto, STRING -> texto de una línea. ── */
var UI = {
  email:                 { ctrl:'email' },
  phone:                 { ctrl:'tel' },
  googlemaps_link:       { ctrl:'text', hint:'hint_maps' },
  licenseFile:           { ctrl:'foto' },
  registrationFile:      { ctrl:'foto' },
  floorPlanFile:         { ctrl:'foto', hint:'hint_plano' },
  foto_etv_plate:        { ctrl:'foto', hint:'hint_etv' },
  foto_house_plate:      { ctrl:'foto' },
  foto_keybox:           { ctrl:'foto' },
  foto_electricalPanel:  { ctrl:'foto' },
  foto_waterShutoff:     { ctrl:'foto' },
  solarPanelsPdf:        { ctrl:'foto' },
  jacuzziPdf:            { ctrl:'foto' },
  foto_safe:             { ctrl:'foto' },
  foto_pool:             { ctrl:'foto', si:'hasPool' },
  foto_exterior1:        { ctrl:'foto' },
  foto_exterior2:        { ctrl:'foto' },
  foto_exterior3:        { ctrl:'foto' },
  acBedrooms:            { ctrl:'select', ops:['all','some','none'], hint:'hint_acBedrooms' },
  stoveType:             { ctrl:'select', ops:['gas','induction','ceramic','electric'] },
  totalBedrooms:         { ctrl:'num', hint:'hint_coincide' },
  totalBathrooms:        { ctrl:'num', hint:'hint_coincide' },
  bedrooms_json:         { ctrl:'grupo' },
  bathrooms_json:        { ctrl:'grupo' },
  sharedBathrooms_json:  { ctrl:'grupo' },
  whoContractsInternet:  { ctrl:'select', ops:['owner','3villas'] },
  safeCode:              { ctrl:'text', si:'hasSafe' },
  poolType:              { ctrl:'select', ops:['private','communal'], si:'hasPool' },
  poolDimensions:        { ctrl:'text', si:'hasPool', hint:'hint_medidas' },
  poolMinDepth:          { ctrl:'text', si:'hasPool' },
  poolMaxDepth:          { ctrl:'text', si:'hasPool' },
  hasChildBarrier:       { ctrl:'yesno', si:'hasPool' },
  isHeatedPool:          { ctrl:'yesno', si:'hasPool' },
  hasOutdoorShower:      { ctrl:'yesno', si:'hasPool' },
  bbqType:               { ctrl:'select', ops:['gas','charcoal','electric','obra'], si:'hasBBQ' },
  seaViewsFrom:          { ctrl:'text', si:'hasSeaViews' },
  parking:               { ctrl:'select', ops:['street','insideProperty','garage'] },
  solarPanelsInfo:       { ctrl:'text', si:'hasSolarPanels' },
  jacuzziInfo:           { ctrl:'text', si:'hasJacuzzi' },
  firstAidLocation:      { ctrl:'text', si:'hasFirstAidKit' },
  coffeeMakerType:       { ctrl:'text', si:'hasCoffeeMaker' },
  changeoverDay:         { ctrl:'select', ops:['mon','tue','wed','thu','fri','sat','sun','varies'] },
  houseRules:            { ctrl:'textarea' },
  ownerComments:         { ctrl:'textarea' },
  acceptedTerms:         { ctrl:'consent' },
  acceptedTerms_at:      { ctrl:'oculto' },
  distanceBeach:         { ctrl:'text', hint:'hint_dist' },
  distanceSupermarket:   { ctrl:'text', hint:'hint_dist' },
  distanceRestaurant:    { ctrl:'text', hint:'hint_dist' },
  distancePharmacy:      { ctrl:'text', hint:'hint_dist' },
  distanceAirport:       { ctrl:'text', hint:'hint_dist' }
};

/* ── Campos obligatorios, marcados con un asterisco rojo ──
   acBedrooms salió de la lista el 21/09/2026: el propietario contesta el aire
   dormitorio a dormitorio en el paso 3, y obligarle dos veces a lo mismo le
   frenaba en el paso 2. */
var OBLIG = ['ownerName','propertyName','email','phone','legalCapacity',
  'numberOfFans','totalBedrooms','totalBathrooms','stoveType','electricalPanelLocation',
  'parking','poolType','poolDimensions','seaViewsFrom','acceptedTerms'];

/* ════════════════════ IDIOMAS ════════════════════
   Una sola tabla: cada clave lleva sus cinco textos en el orden
   es, en, fr, de, it. El español es el original; los otros cuatro son
   traducciones nativas, cortas y llanas. Al construirse los cinco
   diccionarios de la misma tabla, los cinco tienen siempre las mismas
   claves, que es lo que comprueba la prueba. */
var IDIOMAS = ['es','en','fr','de','it'];
var L = {
  /* — pantalla y botones — */
  app_title:['Ficha de propietario','Owner information form','Fiche du propriétaire','Eigentümer-Datenblatt','Scheda del proprietario'],
  paso_de:['Paso {n} de 9','Step {n} of 9','Étape {n} sur 9','Schritt {n} von 9','Passo {n} di 9'],
  btn_ant:['Anterior','Back','Précédent','Zurück','Indietro'],
  btn_sig:['Siguiente','Next','Suivant','Weiter','Avanti'],
  btn_enviar:['Enviar la ficha','Send the form','Envoyer la fiche','Datenblatt senden','Invia la scheda'],
  guardado:['Guardado ✓','Saved ✓','Enregistré ✓','Gespeichert ✓','Salvato ✓'],
  guardando:['Guardando…','Saving…','Enregistrement…','Wird gespeichert…','Salvataggio…'],
  cargando:['Cargando…','Loading…','Chargement…','Wird geladen…','Caricamento…'],
  err_red:['No se ha podido guardar. Sus datos siguen en la pantalla. Compruebe la conexión y pulse otra vez.','We could not save. Your answers are still on screen. Check your connection and press again.','Enregistrement impossible. Vos réponses restent à l’écran. Vérifiez la connexion et appuyez de nouveau.','Speichern nicht möglich. Ihre Angaben bleiben auf dem Bildschirm. Prüfen Sie die Verbindung und drücken Sie erneut.','Salvataggio non riuscito. Le sue risposte restano sullo schermo. Controlli la connessione e prema di nuovo.'],
  err_campos:['Revise los campos marcados en rojo.','Please check the fields marked in red.','Vérifiez les champs marqués en rouge.','Bitte prüfen Sie die rot markierten Felder.','Controlli i campi segnati in rosso.'],
  sin_token:['Este enlace no es válido o ha caducado. Pida uno nuevo a 3Villas.','This link is not valid or it has expired. Please ask 3Villas for a new one.','Ce lien n’est pas valide ou il a expiré. Demandez-en un nouveau à 3Villas.','Dieser Link ist ungültig oder abgelaufen. Bitte fordern Sie bei 3Villas einen neuen an.','Questo link non è valido o è scaduto. Chieda a 3Villas un link nuovo.'],
  cerrada:['Esta ficha ya está revisada por 3Villas. Gracias.','This form has already been reviewed by 3Villas. Thank you.','Cette fiche a déjà été vérifiée par 3Villas. Merci.','Dieses Datenblatt wurde von 3Villas bereits geprüft. Vielen Dank.','Questa scheda è già stata verificata da 3Villas. Grazie.'],

/* Los cinco diccionarios salen de la misma tabla, así que tienen
   exactamente las mismas claves por construcción. */
var I18N = (function(){
  var d = {}, i, k;
  for(i = 0; i < IDIOMAS.length; i++) d[IDIOMAS[i]] = {};
  for(k in L){ if(!Object.prototype.hasOwnProperty.call(L, k)) continue;
    for(i = 0; i < IDIOMAS.length; i++) d[IDIOMAS[i]][k] = L[k][i];
  }
  return d;
})();

var LANG = 'es';
function t(k, vars){
  var s = (I18N[LANG] && I18N[LANG][k]) || I18N.es[k] || k;
  if(vars) s = s.replace(/\{(\w+)\}/g, function(_, n){ return vars[n] !== undefined ? vars[n] : '{' + n + '}'; });
  return s;
}

/* ════════════════════ TOKEN DEL ENLACE ════════════════════
   Igual que checkin-auth.js v23: se lee de ?acceso=, se guarda en memoria y
   en sessionStorage, y se quita de la barra de direcciones y del historial. */
var TOKEN = '';
function tokenDeUrl(){
  try{ return new URLSearchParams(location.search).get('acceso') || ''; }catch(e){ return ''; }
}
function quitarTokenDeUrl(){
  try{
    var u = new URL(location.href);
    if(u.searchParams.has('acceso')){
      u.searchParams.delete('acceso');
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    }
  }catch(e){}
}
function tokenGuardado(){ try{ return sessionStorage.getItem('3v_ficha_token') || ''; }catch(e){ return ''; } }
function guardarTokenEnSesion(tk){ try{ sessionStorage.setItem('3v_ficha_token', tk); }catch(e){} }

/* ════════════════════ VALIDACIÓN ════════════════════
   Pura: recibe el número de paso y un objeto llano con las respuestas
   (las tres listas viajan como d.bedrooms, d.bathrooms, d.sharedBathrooms).
   Devuelve una lista de { campo, clave }; la clave es un texto de I18N. */
function validarPaso(n, d){
  function T(k){ return String((d && d[k] !== undefined && d[k] !== null) ? d[k] : '').trim(); }
  /* Los campos de cuenta son INTEGER en Caspio: "3,5", "4.7" o "dos" no son
     una respuesta válida, así que N devuelve null y el aviso salta. */
  function N(k){ var v = T(k); if(v === '' || !/^-?\d+$/.test(v)) return null; var x = parseInt(v, 10); return isNaN(x) ? null : x; }
  function B(k){
    var v = d ? d[k] : '';
    if(v === true || v === 1) return true;
    return ['1','-1','true','si','sí','yes'].indexOf(String(v).trim().toLowerCase()) >= 0;
  }
  var e = [];
  function mal(c, clave){ e.push({ campo:c, clave:clave }); }
  if(n === 1){
    if(T('ownerName').length < 3) mal('ownerName', 'err_min3');
    if(T('propertyName').length < 3) mal('propertyName', 'err_min3');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(T('email'))) mal('email', 'err_email');
    if(T('phone').replace(/[^0-9]/g, '').length < 9) mal('phone', 'err_tel');
    var pl = N('legalCapacity');
    if(pl === null || pl < 1) mal('legalCapacity', 'err_min1');
  }
  if(n === 2){
    /* acBedrooms es opcional: se puede contestar dormitorio a dormitorio. */
    var vf = N('numberOfFans');
    if(vf === null || vf < 0) mal('numberOfFans', 'err_num0');
  }
  if(n === 3){
    var td = N('totalBedrooms');
    if(td === null || td < 1) mal('totalBedrooms', 'err_min1');
    var ds = (d && d.bedrooms) || [], conSitio = 0, i;
    for(i = 0; i < ds.length; i++){
      if(String((ds[i] && ds[i].location) || '').trim() !== '') conSitio++;
    }
    if(conSitio < 1) mal('bedrooms_json', 'err_dorm_ubic');
  }
  if(n === 4){
    var tb = N('totalBathrooms');
    if(tb === null || tb < 0) mal('totalBathrooms', 'err_num0');
  }
  if(n === 5){
    if(T('stoveType') === '') mal('stoveType', 'err_req');
  }
  if(n === 6){
    if(T('electricalPanelLocation').length < 3) mal('electricalPanelLocation', 'err_min3');
  }
  if(n === 8){
    if(T('parking') === '') mal('parking', 'err_req');
    if(B('hasPool')){
      if(T('poolType') === '') mal('poolType', 'err_req');
      if(T('poolDimensions') === '') mal('poolDimensions', 'err_req');
    }
    if(B('hasSeaViews') && T('seaViewsFrom') === '') mal('seaViewsFrom', 'err_req');
  }
  if(n === 9){
    if(!B('acceptedTerms')) mal('acceptedTerms', 'err_terms');
  }
  return e;
}

/* Escapa también la comilla simple y la tilde invertida: un valor que entra en
   un atributo entre comillas simples o en una plantilla de texto no puede
   cerrarlo. Un archivo llamado  a.jpg?');alert(1)//  no rompe nada. */
function esc(s){ return String(s === undefined || s === null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;'); }

/* Solo estos dos orígenes pueden acabar en un href o un src. Son los dos que
   devuelve el Worker al subir un archivo: el bucket R2 y el mismo host que lo
   sirve. Cualquier otra cosa, y en especial un javascript:, se pinta como
   texto y nunca como enlace. */
var ORIGENES_OK = ['https://www.3villas.com/intranet/fotos/',
  'https://pub-48c1cfd5de614ff0a0cebfec482a7b32.r2.dev/'];
function urlSegura(u){
  if(!u || typeof u !== 'string') return '';
  var s = u.trim();
  for(var i = 0; i < ORIGENES_OK.length; i++){
    if(s.indexOf(ORIGENES_OK[i]) === 0) return s;
  }
  return '';
}

/* Caspio devuelve los Yes/No como booleanos de verdad (true y false), no como
   '1' y '0'. Sin este helper, al volver con el mismo enlace los botones Sí/No
   salían sin marcar aunque la respuesta estuviera guardada. */
function verdad(v){
  if(v === true || v === 1) return true;
  return ['1','-1','true','si','sí','yes'].indexOf(String(v === undefined || v === null ? '' : v).trim().toLowerCase()) >= 0;
}
function falso(v){
  if(v === false || v === 0) return true;
  return ['0','false','no'].indexOf(String(v === undefined || v === null ? '' : v).trim().toLowerCase()) >= 0;
}
/* Valor con el que se marca un botón Sí/No: '1', '0' o '' si nadie ha
   contestado todavía. Sirve tanto para un booleano de Caspio como para el
   '1'/'0' que escribe esta misma página. */
function siNoGuardado(v){
  if(v === undefined || v === null || String(v).trim() === '') return '';
  if(verdad(v)) return '1';
  if(falso(v)) return '0';
  return '';
}

function ctrlDe(campo){
  if(UI[campo] && UI[campo].ctrl) return UI[campo].ctrl;
  var d = CAMPOS[campo];
  if(!d) return 'text';
  if(d.type === 'YES/NO') return 'yesno';
  if(d.type === 'INTEGER') return 'num';
  if(d.type === 'TEXT') return 'textarea';
  return 'text';
}
function etiqueta(campo){
  var k = 'lbl_' + campo;
  if(I18N[LANG] && I18N[LANG][k]) return I18N[LANG][k];
  return (CAMPOS[campo] && CAMPOS[campo].label_es) || campo;
}
function visible(campo){
  var u = UI[campo];
  if(!u || !u.si) return true;
  return verdad(datos[u.si]);
}

function caja(campo, dentro, obligatorio){
  var d = document.createElement('div');
  d.className = 'fld';
  d.id = 'fld_' + campo;
  var lab = document.createElement('label');
  lab.setAttribute('for', 'f_' + campo);
  lab.innerHTML = esc(etiqueta(campo)) + (obligatorio ? ' <span class="req">*</span>' : '');
  d.appendChild(lab);
  d.appendChild(dentro);
  if(UI[campo] && UI[campo].hint){
    var h = document.createElement('div'); h.className = 'hint'; h.textContent = t(UI[campo].hint);
    d.appendChild(h);
  }
  var m = document.createElement('div'); m.className = 'msg'; m.id = 'msg_' + campo;
  d.appendChild(m);
  return d;
}

function pintaTexto(campo, tipo){
  var i = document.createElement('input');
  i.type = tipo === 'email' ? 'email' : (tipo === 'tel' ? 'tel' : 'text');
  i.id = 'f_' + campo;
  i.value = datos[campo] === undefined || datos[campo] === null ? '' : String(datos[campo]);
  if(tipo === 'email') i.setAttribute('inputmode', 'email');
  if(tipo === 'tel') i.setAttribute('inputmode', 'tel');
  i.oninput = function(){ datos[campo] = i.value; limpiarAviso(campo); };
  return caja(campo, i, OBLIG.indexOf(campo) >= 0);
}
function pintaNumero(campo){
  var i = document.createElement('input');
  i.type = 'number'; i.min = '0'; i.step = '1'; i.id = 'f_' + campo;
  i.setAttribute('inputmode', 'numeric');
  i.value = datos[campo] === undefined || datos[campo] === null ? '' : String(datos[campo]);
  i.oninput = function(){ datos[campo] = i.value; limpiarAviso(campo); };
  return caja(campo, i, OBLIG.indexOf(campo) >= 0);
}
function pintaArea(campo){
  var i = document.createElement('textarea');
  i.id = 'f_' + campo;
  i.value = datos[campo] === undefined || datos[campo] === null ? '' : String(datos[campo]);
  i.oninput = function(){ datos[campo] = i.value; limpiarAviso(campo); };
  return caja(campo, i, OBLIG.indexOf(campo) >= 0);
}
function pintaSelect(campo){
  var ops = (UI[campo] && UI[campo].ops) || [];
  var s = document.createElement('select');
  s.id = 'f_' + campo;
  s.appendChild(new Option(t('elegir'), ''));
  for(var i = 0; i < ops.length; i++) s.appendChild(new Option(t('op_' + ops[i]), ops[i]));
  s.value = datos[campo] === undefined || datos[campo] === null ? '' : String(datos[campo]);
  s.onchange = function(){ datos[campo] = s.value; limpiarAviso(campo); };
  return caja(campo, s, OBLIG.indexOf(campo) >= 0);
}
function pintaSiNo(campo){
  var box = document.createElement('div');
  box.className = 'sino'; box.id = 'f_' + campo;
  function boton(val, txt){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = txt;
    /* siNoGuardado entiende el booleano de Caspio y el '1'/'0' de esta página */
    if(siNoGuardado(datos[campo]) === val) b.className = 'on';
    b.onclick = function(){
      datos[campo] = val;
      var hijos = box.querySelectorAll('button'), j;
      for(j = 0; j < hijos.length; j++) hijos[j].className = '';
      b.className = 'on';
      limpiarAviso(campo);
      if(dependenDe(campo)) pintaPaso(pasoActual);
    };
    return b;
  }
  box.appendChild(boton('1', t('si')));
  box.appendChild(boton('0', t('no')));
  return caja(campo, box, OBLIG.indexOf(campo) >= 0);
}
function dependenDe(campo){
  for(var k in UI){ if(UI[k] && UI[k].si === campo) return true; }

/* itemId, no el índice: mientras una foto se sube, el propietario puede quitar
   un dormitorio de la lista y entonces el índice ya apunta a otro item (o a
   ninguno). Con el id, si el item ya no está, la URL no se escribe en el
   vecino equivocado y se avisa en vez de perderse en silencio. */
function dibujaFoto(box, campo, claveLista, itemId){
  var item = claveLista ? itemPorId(claveLista, itemId) : null;
  var url = claveLista ? ((item || {}).photo || '') : datos[campo];
  var segura = urlSegura(url);
  box.innerHTML = '';
  if(url){
    if(!segura){
      /* Una URL de otro origen no se enlaza nunca: se enseña como texto. */
      var avisoU = document.createElement('div');
      avisoU.className = 'est mal'; avisoU.textContent = t('foto_origen');
      box.appendChild(avisoU);
    }else if(/\.(jpg|jpeg|png|gif|webp|heic|heif)(\?|$)/i.test(segura)){
      var img = document.createElement('img'); img.src = segura; img.alt = '';
      img.onerror = function(){ img.onerror = null; img.style.display = 'none'; };
      box.appendChild(img);
    }else{
      var a = document.createElement('a');
      a.className = 'pdf'; a.href = segura; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = '📄 PDF';
      box.appendChild(a);
    }
  }
  var bot = document.createElement('span');
  bot.className = 'bot';
  bot.textContent = url ? t('btn_cambiar') : t('btn_foto');
  box.appendChild(bot);
  var est = document.createElement('div'); est.className = 'est'; box.appendChild(est);
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,.pdf';
  inp.onchange = function(ev){
    var bruto = ev.target.files && ev.target.files[0];
    if(!bruto) return;
    est.className = 'est'; est.textContent = t('subiendo');
    comprimir(bruto, 1600, 0.82).then(function(f){
      return subirArchivo(claveLista ? (claveLista === 'bedrooms' ? 'bedroom_photo' : 'bathroom_photo') : campo, f);
    }).then(function(r){
      if(!r || !r.url) throw new Error('sin url');
      if(claveLista){
        var vivo = itemPorId(claveLista, itemId);
        if(!vivo) throw new Error('quitado');   /* lo borraron mientras subía */
        vivo.photo = r.url;
      }else{
        datos[campo] = r.url;
      }
      dibujaFoto(box, campo, claveLista, itemId);
      return guardarPaso(pasoActual, false, true);
    }).then(function(){ aviso(t('guardado'), false); })
      .catch(function(err){
        est.className = 'est mal';
        est.textContent = String(err && err.message) === 'quitado' ? t('foto_quitada') : t('foto_mal');
      });
  };
  box.appendChild(inp);
}

/* Mismo patrón que editar-villa.html: las imágenes se reducen en el móvil
   antes de subirlas. Un PDF pasa tal cual. */
function comprimir(file, maxPx, calidad){
  maxPx = maxPx || 1600; calidad = calidad || 0.82;
  return new Promise(function(resolve){
    if(!file.type || file.type.indexOf('image/') !== 0){ resolve(file); return; }
    if(file.size < 300 * 1024){ resolve(file); return; }
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height;
      if(w > maxPx || h > maxPx){
        if(w >= h){ h = Math.round(h * maxPx / w); w = maxPx; }
        else { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(function(blob){
        resolve(blob ? new File([blob], (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg',
          { type:'image/jpeg', lastModified:Date.now() }) : file);
      }, 'image/jpeg', calidad);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* ════════════════════ LLAMADAS AL WORKER ════════════════════ */
/* El _id de cada item es solo de esta pantalla: no se guarda en Caspio. */
function listaParaGuardar(clave){
  var a = listas[clave] || [], out = [], i, k, copia;
  for(i = 0; i < a.length; i++){
    copia = {};
    for(k in a[i]){ if(Object.prototype.hasOwnProperty.call(a[i], k) && k !== '_id') copia[k] = a[i][k]; }
    out.push(copia);
  }
  return out;
}
function camposDelPaso(n){
  var def = PASOS[n - 1], out = {}, i;
  for(i = 0; i < def.campos.length; i++){
    var c = def.campos[i];
    if(REPEAT[c]){ out[c] = JSON.stringify(listaParaGuardar(REPEAT[c])); continue; }
    if(c === 'acceptedTerms'){ out[c] = verdad(datos[c]); continue; }
    if(CAMPOS[c] && CAMPOS[c].type === 'YES/NO'){
      /* Sin contestar se manda null, no false: false es una respuesta. */
      var sn = siNoGuardado(datos[c]);
      out[c] = sn === '' ? null : (sn === '1');
      continue;
    }
    if(CAMPOS[c] && CAMPOS[c].type === 'INTEGER'){ out[c] = entero(datos[c]); continue; }
    out[c] = datos[c] === undefined || datos[c] === null ? '' : String(datos[c]);
  }
  return out;
}
/* Un campo INTEGER de Caspio solo acepta un entero. "3,5", "dos" o "4.7"
   se mandaban antes como 3.5 / null / 4.7 y Caspio rechazaba la fila. */
function entero(v){
  var s = String(v === undefined || v === null ? '' : v).trim();
  if(s === '') return null;
  if(!/^-?\d+$/.test(s)) return null;
  var n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}

function guardarPaso(n, enviar, silencioso){
  var cuerpo = { token:TOKEN, fields:camposDelPaso(n), submit:!!enviar };
  return fetch(API + '?action=ficha-save', {
    method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(cuerpo)
  }).then(function(r){
    if(r.status === 409){ editable = false; pantallaCerrada(); throw new Error('cerrada'); }
    if(!r.ok) throw new Error('http');
    return r.json();
  }).then(function(j){
    if(j && j.ok === false) throw new Error('worker');
    if(!silencioso) aviso(t('guardado'), false);
    return j;
  });
}

function subirArchivo(campoDestino, file){
  var fd = new FormData();
  fd.append('file', file, file.name || 'archivo');
  fd.append('token', TOKEN);

  return fetch(API + '?action=ficha-upload', { method:'POST', body:fd })
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(j){ if(!j || !j.success || !j.url) throw new Error('worker'); return j; });
}

function cargarFicha(){
  return fetch(API + '?action=ficha-load&token=' + encodeURIComponent(TOKEN))
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(j){
      var f = (j && j.ficha) || {};
      editable = !(j && j.editable === false);
      var k;
      for(k in f){ if(Object.prototype.hasOwnProperty.call(f, k)) datos[k] = f[k]; }
      listas.bedrooms = leerLista(f.bedrooms_json);
      listas.bathrooms = leerLista(f.bathrooms_json);
      listas.sharedBathrooms = leerLista(f.sharedBathrooms_json);
      if(f.lang && IDIOMAS.indexOf(String(f.lang)) >= 0) LANG = String(f.lang);
      return j;
    });
}
function leerLista(v){
  if(!v) return [];
  if(Object.prototype.toString.call(v) === '[object Array]') return v;
  try{ var a = JSON.parse(v); return Object.prototype.toString.call(a) === '[object Array]' ? a : []; }
  catch(e){ return []; }
}

function datosParaValidar(){
  var d = {}, k;
  for(k in datos){ if(Object.prototype.hasOwnProperty.call(datos, k)) d[k] = datos[k]; }
  d.bedrooms = listas.bedrooms;
  d.bathrooms = listas.bathrooms;
  d.sharedBathrooms = listas.sharedBathrooms;
  return d;
}
/* "Anterior" guarda el paso que se deja, por el mismo camino que "Siguiente",
   pero SIN validar: el propietario puede volver atrás con un campo a medias y
   lo escrito no se pierde. Si el guardado falla, la página igual retrocede y
   avisa; los datos siguen en memoria y se reintentan en el siguiente paso. */
function irAnterior(){
  if(pasoActual <= 1) return;
  if(enviando) return;
  var n = pasoActual;
  guardarPaso(n, false, true)
    .then(function(){ aviso(t('guardado'), false); })
    .catch(function(err){ if(String(err && err.message) !== 'cerrada') aviso(t('err_red'), true); });
  pintaPaso(n - 1);
}
function irSiguiente(){
  if(enviando) return;
  var errs = validarPaso(pasoActual, datosParaValidar());
  if(errs.length){
    if(pasoActual === TOTAL_PASOS){
      var c = $('fld_acceptedTerms');
      if(c) c.classList.add('malo');
    }
    marcarErrores(errs);
    return;
  }
  var ultimo = (pasoActual === TOTAL_PASOS);
  if(ultimo) datos.acceptedTerms_at = new Date().toISOString();
  enviando = true;
  $('btnSig').disabled = true;
  $('btnSig').textContent = t('guardando');
  var n = pasoActual;
  guardarPaso(n, ultimo, false).then(function(){
    enviando = false;
    $('btnSig').disabled = false;
    if(ultimo) pantallaGracias();
    else pintaPaso(n + 1);
  }).catch(function(err){
    enviando = false;
    $('btnSig').disabled = false;
    $('btnSig').textContent = (n === TOTAL_PASOS) ? t('btn_enviar') : t('btn_sig');
    if(String(err && err.message) === 'cerrada') return;
    var eb = $('errBox');
    eb.textContent = t('err_red');
    eb.style.display = 'block';
    aviso(t('err_red'), true);
  });
}

/* Fecha corta DD/MM/AAAA. Acepta 'AAAA-MM-DD…' de Caspio y un Date. */
function fechaCorta(v){
  if(!v) return '';
  if(Object.prototype.toString.call(v) === '[object Date]'){
    if(isNaN(v.getTime())) return '';
    var dd = ('0' + v.getDate()).slice(-2), mm = ('0' + (v.getMonth() + 1)).slice(-2);
    return dd + '/' + mm + '/' + v.getFullYear();
  }
  var s = String(v), m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : s.slice(0, 10);
}

  pintaBannerEnviada();
}
function pantallaSinToken(){
  $('pCargando').style.display = 'none';
  $('txtCerrada').textContent = t('sin_token');
  $('pCerrada').style.display = 'block';
}

function arrancar(){
  var deUrl = tokenDeUrl();
  TOKEN = deUrl || tokenGuardado();
  if(deUrl) guardarTokenEnSesion(deUrl);
  quitarTokenDeUrl();                 /* el token no queda en la barra ni en el historial */
  comprobarVersionNueva();            /* DESPUÉS del borrado: la petición ya no lleva el token */
  $('langSel').value = LANG;
  $('txtCargando').textContent = t('cargando');
  if(!TOKEN){ pantallaSinToken(); return; }
  cargarFicha().then(function(){
    $('langSel').value = LANG;
    document.documentElement.setAttribute('lang', LANG);
    $('hTitulo').textContent = t('app_title');
    $('hVilla').textContent = datos.propertyName ? String(datos.propertyName) : '';
    if(!editable){ pantallaCerrada(); return; }
    pantallaFormulario();
  }).catch(function(){
    pantallaSinToken();
  });
}

/* ════════════════════ AUTO-DETECCIÓN DE VERSIÓN ════════════════════
   Mismo mecanismo que checkin-pasos.html y editar-villa.html: mira en 2º
   plano si el servidor tiene una versión más nueva de esta página y, si la
   tiene, recarga UNA sola vez por versión (marca en sessionStorage para no
   entrar nunca en bucle). No bloquea la carga ni rompe nada si falla.
   AQUÍ, y no en el <head>: la petición sale DESPUÉS de quitarTokenDeUrl(),
   así que ni la URL pedida ni la cabecera Referer pueden llevar el token. */
function comprobarVersionNueva(){
  try{
    if(location.protocol.indexOf('http') !== 0) return;
    fetch(location.pathname, { cache:'reload', referrerPolicy:'strict-origin' })
      .then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(html){
        var m = html.match(/VERSIÓN ACTUAL:\s*v(\d+)/i);
        if(!m) return;
        var srvV = parseInt(m[1], 10);
        if(!(srvV > PAGE_VERSION)) return;
        var key = '3v_vchk_ficha_v' + srvV;
        if(sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, '1');
        location.reload();
      })
      .catch(function(){});
  }catch(e){}
}

window.cambiarIdioma = cambiarIdioma;
window.irAnterior = irAnterior;
window.irSiguiente = irSiguiente;
document.addEventListener('DOMContentLoaded', arrancar);
