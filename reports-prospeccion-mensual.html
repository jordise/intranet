<script>
(function(){
'use strict';

const WORKER = 'https://www.3villas.com/intranet/api';
const TABLE  = 'Ta_raport_ventas';
const LIMIT  = 2000;   /* mismo límite que la lectura de reports-ventas.html v24 */
const PAGE_VERSION = 1;

/* ── v1: auto-detección de versión (Opción B), igual que fichas-propietarios.html ── */
(function checkForNewerVersion(){
  try{
    if(location.protocol === 'file:') return;
    fetch(location.pathname, { cache:'reload' }).then(function(r){ return r.text(); }).then(function(html){
      var m = html.match(/VERSIÓN ACTUAL:\s*v(\d+)/i);
      if(!m) return;
      var serverV = parseInt(m[1], 10);
      if(serverV > PAGE_VERSION){
        var key = '3v_vchk_' + location.pathname + '_v' + serverV;
        if(!sessionStorage.getItem(key)){ sessionStorage.setItem(key, '1'); location.reload(); }
      }
    }).catch(function(){});
  }catch(e){}
})();

/* ════════════════════════════════════════════════════════════════════
   ▼▼ CALCULO — inicio. La prueba reports-prospeccion-mensual.test.js
      extrae este bloque entero del HTML y lo ejecuta: no hay ninguna
      copia del código en la prueba. Sin DOM y sin red aquí dentro.
   ════════════════════════════════════════════════════════════════════ */

/* Columnas de Ta_raport_ventas que suma esta página (nombres exactos de
   reports-ventas.html v24). Visitas = Visitas_Ventas, como en la v24. */
const PROSP_FIELDS = [
  {key:'Prosp_Llamadas',           label:'Llamadas'},
  {key:'Prosp_No_Contestan',       label:'No contestan'},
  {key:'Prosp_No_Interesado',      label:'No interesado'},
  {key:'Prosp_Otra_Agencia',       label:'Otra agencia'},
  {key:'Prosp_Seguimiento',        label:'Seguimiento'},
  {key:'Visitas_Ventas',           label:'Visitas'},
  {key:'Prosp_Cartas_Intenciones', label:'Cartas de intenciones'},
  {key:'Prosp_Contratos',          label:'Contratos'},
];
/* Regla de Gaëlle (7 oct 2026): bono fijo de 150 € con 50 o más llamadas en el mes. */
const BONO_LLAMADAS = 50;
const BONO_EUROS    = 150;
const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* Mes actual 'YYYY-MM' en hora de Madrid (no la del dispositivo). */
function madridYearMonth(now){
  const d = (now === undefined) ? new Date() : new Date(now);
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Europe/Madrid', year:'numeric', month:'2-digit' }).formatToParts(d);
  let y = '', m = '';
  parts.forEach(function(p){ if(p.type === 'year') y = p.value; if(p.type === 'month') m = p.value; });
  return y + '-' + m;
}

/* 'YYYY-MM' → { desde:'YYYY-MM-01', hasta:'YYYY-MM-<último día>' } */
function monthRange(ym){
  const m = String(ym || '').match(/^(\d{4})-(\d{2})$/);
  if(!m) return null;
  const y = +m[1], mo = +m[2];
  if(mo < 1 || mo > 12) return null;
  const last = new Date(y, mo, 0).getDate();   /* día 0 del mes siguiente = último día de este */
  return { desde: m[1] + '-' + m[2] + '-01', hasta: m[1] + '-' + m[2] + '-' + String(last).padStart(2, '0') };
}

/* Suma (o resta) meses a 'YYYY-MM'. */
function shiftMonth(ym, delta){
  const m = String(ym).match(/^(\d{4})-(\d{2})$/);
  if(!m) return ym;
  const idx = (+m[1]) * 12 + (+m[2] - 1) + delta;
  const y = Math.floor(idx / 12), mo = idx % 12 + 1;
  return y + '-' + String(mo).padStart(2, '0');
}

function monthLabel(ym){
  const m = String(ym).match(/^(\d{4})-(\d{2})$/);
  return m ? MESES_LARGOS[+m[2] - 1] + ' ' + m[1] : String(ym);
}

/* Igual que parseFechaStr de reports-ventas.html (v05): cualquier formato de Fecha → Date local a mediodía. */
function parseFechaStr(s){
  if(!s) return null;
  let raw = String(s).trim().split('T')[0].split(' ')[0];
  let m;
  m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], 12, 0, 0);
  m = raw.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], 12, 0, 0);
  m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], 12, 0, 0);
  m = raw.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], 12, 0, 0);
  const dt = new Date(s);
  if(!isNaN(dt.getTime())) return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), 12, 0, 0);
  return null;
}

function toDateStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* Número de semanas de lunes a domingo que tocan el mes 'YYYY-MM' (aunque empiecen en el mes
   anterior o acaben en el siguiente): la base de "N de M semanas con reporte". Un registro del
   mes cuenta en la semana de su fecha (weekKey), y esa semana siempre toca el mes, así que el
   número de semanas con reporte nunca pasa de esta base. Octubre 2026 = 5, febrero 2027 = 4. */
function weeksInMonth(ym){
  const rg = monthRange(ym);
  if(!rg) return 0;
  const y = +ym.slice(0, 4), mo = +ym.slice(5, 7), last = +rg.hasta.slice(8, 10);
  const semanas = {};
  for(let d = 1; d <= last; d++){ semanas[weekKey(new Date(y, mo - 1, d, 12, 0, 0))] = 1; }
  return Object.keys(semanas).length;
}

/* Línea por agente bajo la tabla, p. ej. "Toni Moll: 3 de 4 semanas con reporte (3 filas)". */
function lineaSemanas(a, nSemanas){
  return a.nombre + ': ' + a.semanas + ' de ' + nSemanas + ' semanas con reporte (' + a.filas + (a.filas === 1 ? ' fila)' : ' filas)');
}

/* Aviso de registros que no se cuentan, en singular o plural. */
function avisoFueraDeMes(n, ym){
  if(!(n > 0)) return '';
  return n === 1
    ? '1 registro no se cuenta: su fecha no se puede leer o está fuera de ' + monthLabel(ym) + '.'
    : n + ' registros no se cuentan: su fecha no se puede leer o está fuera de ' + monthLabel(ym) + '.';
}

/* Lunes de la semana de una fecha, 'YYYY-MM-DD': identifica la semana del registro
   (y, en weeksInMonth, cada semana que toca el mes). */
function weekKey(d){
  const dow = (d.getDay() + 6) % 7;   /* 0 = lunes … 6 = domingo */
  const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow, 12, 0, 0);
  return toDateStr(mon);
}

/* Valor numérico de un campo; vacío, null o texto = 0. Nombre de campo sin distinguir mayúsculas,
   como _caspioFieldMap de reports-ventas.html (v16). */
function numVal(r, key){
  if(!r) return 0;
  let v = r[key];
  if(v === undefined){
    const lk = key.toLowerCase();
    const k = Object.keys(r).find(function(x){ return x.toLowerCase() === lk; });
    if(k !== undefined) v = r[k];
  }
  const n = parseFloat(v);
  return isFinite(n) ? n : 0;
}

/* Id del agente de una fila: mismo orden de campos que getAgenteRaw de reports-ventas.html (v09),
   con su misma red de seguridad (un valor que sea un UserID conocido). */
function agenteId(r, userMap){
  const v = r.Agente ?? r.agente ?? r.AGENTE ?? r.agente_id ?? r.AgentId ?? null;
  if(v != null && String(v).trim()) return String(v).trim();
  const um = userMap || {};
  for(const key of Object.keys(r)){
    if(/fecha|date|fech|captac|visita|firma|cartel|seguro|alquil|finca|clave|prosp|factur|Id$/i.test(key)) continue;
    const val = String(r[key] == null ? '' : r[key]).trim();
    if(val && um[val]) return val;
  }
  return '';
}

function fechaDe(r){
  return r.Fecha ?? r.fecha ?? r.FECHA ?? r.date ?? r.Date ?? '';
}

/* ¿La fecha de la fila cae dentro del mes 'YYYY-MM'? */
function inMonth(fechaStr, ym){
  const d = parseFechaStr(fechaStr);
  if(!d) return false;
  return toDateStr(d).slice(0, 7) === ym;
}

/* Regla del bono: 50 o más llamadas en el mes. */
function bonoInfo(llamadas){
  const n = Number(llamadas) || 0;
  return n >= BONO_LLAMADAS ? { ok:true, faltan:0 } : { ok:false, faltan: BONO_LLAMADAS - n };
}

/* Resumen del mes: una entrada por agente con al menos una fila en el mes, más los totales.
   semanas = número de semanas distintas (lunes) con registro de ese agente en el mes. */
function resumenMensual(rows, ym, userMap){
  const um = userMap || {};
  const porAgente = {};
  let fueraDeMes = 0;
  (rows || []).forEach(function(r){
    if(!inMonth(fechaDe(r), ym)){ fueraDeMes++; return; }
    const id = agenteId(r, um);
    if(!porAgente[id]){
      const sums = {};
      PROSP_FIELDS.forEach(function(f){ sums[f.key] = 0; });
      porAgente[id] = { id:id, nombre: id ? (um[id] || id) : '(sin agente)', sums:sums, filas:0, _sem:{} };
    }
    const a = porAgente[id];
    PROSP_FIELDS.forEach(function(f){ a.sums[f.key] += numVal(r, f.key); });
    a.filas++;
    a._sem[weekKey(parseFechaStr(fechaDe(r)))] = 1;
  });
  const agentes = Object.keys(porAgente).map(function(id){
    const a = porAgente[id];
    const out = { id:a.id, nombre:a.nombre, sums:a.sums, filas:a.filas, semanas:Object.keys(a._sem).length };
    out.bono = bonoInfo(a.sums.Prosp_Llamadas);
    return out;
  }).sort(function(x, y){ return x.nombre.localeCompare(y.nombre, 'es'); });
  const totales = {};
  PROSP_FIELDS.forEach(function(f){ totales[f.key] = agentes.reduce(function(s, a){ return s + a.sums[f.key]; }, 0); });
  return {
    agentes: agentes,
    totales: totales,
    filas: agentes.reduce(function(s, a){ return s + a.filas; }, 0),
    conBono: agentes.filter(function(a){ return a.bono.ok; }).length,
    fueraDeMes: fueraDeMes
  };
}

/* Aviso de filas duplicadas: un agente con más filas que semanas en el mes tiene dos filas
   en alguna semana. Las dos se suman, así que las llamadas (y el bono) pueden salir de más. */
function avisosDuplicados(resumen){
  return ((resumen && resumen.agentes) || [])
    .filter(function(a){ return a.filas > a.semanas; })
    .map(function(a){ return 'Atención: ' + a.nombre + ' tiene más filas que semanas en este mes; revisa el Reporte semanal, puede haber una fila duplicada.'; });
}

/* La lectura de Ta_raport_ventas, con el mismo WHERE y el mismo límite que loadData de
   reports-ventas.html v24: Fecha>='desde' AND Fecha<='hastaT23:59:59', limit 2000. Solo lectura.
   No se pide orden: el caspio-proxy no aplica orderBy en action=data, así que el orden de las
   filas que llegan no está garantizado. Esta página no depende de él: suma por agente y ordena
   los agentes por nombre en el navegador (resumenMensual). */
function buildMonthUrl(ym){
  const rg = monthRange(ym);
  if(!rg) return null;
  const where = "Fecha>='" + rg.desde + "' AND Fecha<='" + rg.hasta + "T23:59:59'";
  return WORKER + '?action=data&table=' + TABLE + '&where=' + encodeURIComponent(where) + '&limit=' + LIMIT;
}

/* ════════════════════════════════════════════════════════════════════
   ▲▲ CALCULO — fin
   ════════════════════════════════════════════════════════════════════ */

/* ══ STATE ══ */
let monthRows = [], salesAgents = [], userMap = {};
let reqId = 0;
const g = id => document.getElementById(id);

function esc(s){ return String(s === undefined || s === null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;'); }

/* ══ INIT ══ */
document.addEventListener('DOMContentLoaded', async () => {
  buildMesOptions(madridYearMonth());
  await loadUsers();
  loadData();
});

/* Selector de mes: los últimos 36 meses hasta el mes actual (Madrid). */
function buildMesOptions(selected){
  const cur = madridYearMonth();
  const sel = g('fMes');
  let html = '';
  for(let i = 0; i < 36; i++){
    const ym = shiftMonth(cur, -i);
    html += '<option value="' + ym + '"' + (ym === selected ? ' selected' : '') + '>' + monthLabel(ym) + '</option>';
  }
  sel.innerHTML = html;
  updateStepBtns();
}
function updateStepBtns(){
  const sel = g('fMes');
  g('btnNext').disabled = sel.selectedIndex <= 0;
  g('btnPrev').disabled = sel.selectedIndex >= sel.options.length - 1;
}
function stepMes(delta){
  const sel = g('fMes');
  const i = sel.selectedIndex - delta;   /* la lista va del mes actual hacia atrás */
  if(i < 0 || i >= sel.options.length) return;
  sel.selectedIndex = i;
  loadData();
}

/* ══ USUARIOS: misma lectura que reports-ventas.html v24 (TaUsers, UserID → Name, sales activos) ══ */
async function loadUsers(){
  try{
    const r = await fetch(Auth.url(WORKER + '?action=data&table=TaUsers&limit=300'));
    const j = await r.json();
    const rows = j.Result || j.result || [];
    rows.forEach(u => { const uid = String(u.UserID || '').trim(); if(uid) userMap[uid] = String(u.Name || u.name || uid); });
    if(g('navUser')){
      const me = rows.find(u => String(u.Email || '').toLowerCase() === (Auth.email ? Auth.email() : '').toLowerCase());
      if(me) g('navUser').textContent = (me.Name || '').split(' ')[0];
    }
    salesAgents = rows
      .filter(u => {
        const s = u.User_Status; const active = s === true || s === 1 || ['yes','sí','true'].includes(String(s).toLowerCase());
        return active && String(u.Role || u.role || '').toLowerCase() === 'sales';
      })
      .map(u => ({ id: String(u.UserID || '').trim(), name: String(u.Name || u.name || '').trim() }))
      .filter(u => u.id && u.name);
  }catch(e){ console.warn('loadUsers:', e); }
}

/* Selector de agente: los comerciales activos más cualquier agente con filas en el mes. */
function fillAgenteOptions(resumen){
  const sel = g('fAgente');
  const prev = sel.value;
  const seen = {};
  const list = [];
  salesAgents.forEach(u => { if(!seen[u.id]){ seen[u.id] = 1; list.push({ id:u.id, name:u.name }); } });
  resumen.agentes.forEach(a => { if(a.id && !seen[a.id]){ seen[a.id] = 1; list.push({ id:a.id, name:a.nombre }); } });
  list.sort((x, y) => x.name.localeCompare(y.name, 'es'));
  sel.innerHTML = '<option value="">Todos los agentes</option>' +
    list.map(u => '<option value="' + esc(u.id) + '">' + esc(u.name) + '</option>').join('');
  if(prev && seen[prev]) sel.value = prev;
}

/* ══ CARGA (solo lectura) ══ */
async function loadData(){
  const myId = ++reqId;
  updateStepBtns();
  const ym = g('fMes').value;
  g('stLoad').style.display = 'block'; g('stErr').style.display = 'none';
  g('stEmpty').style.display = 'none'; g('listView').style.display = 'none';
  g('statsBar').style.display = 'none'; g('avisos').innerHTML = '';
  try{
    const url = buildMonthUrl(ym);
    if(!url) throw new Error('Mes no válido: ' + ym);
    const res = await fetch(Auth.url(url));
    const json = await res.json();
    if(myId !== reqId) return;
    if(json.error) throw new Error(json.error);
    monthRows = json.Result || json.result || [];
    g('stLoad').style.display = 'none';
    render();
  }catch(err){
    if(myId !== reqId) return;
    g('stLoad').style.display = 'none'; g('stErr').style.display = 'block';
    g('errMsg').textContent = 'No se pudieron cargar los datos. ' + err.message; console.error('[Prospección v1]', err);
  }
}

/* ══ PINTAR ══ */
function render(){
  const ym = g('fMes').value;
  const full = resumenMensual(monthRows, ym, userMap);
  fillAgenteOptions(full);
  const agSel = g('fAgente').value;
  const rowsVista = agSel ? monthRows.filter(r => agenteId(r, userMap) === agSel) : monthRows;
  const rs = agSel ? resumenMensual(rowsVista, ym, userMap) : full;

  const avisos = [];
  if(monthRows.length >= LIMIT) avisos.push('La lectura llegó al límite de ' + LIMIT + ' filas: puede faltar algún registro de este mes.');
  avisosDuplicados(rs).forEach(t => avisos.push(t));
  if(full.fueraDeMes > 0) avisos.push(avisoFueraDeMes(full.fueraDeMes, ym));
  g('avisos').innerHTML = avisos.map(t => '<div class="info-box orange">' + esc(t) + '</div>').join('');

  g('navSub').textContent = monthLabel(ym) + ' · ' + rs.filas + ' registros';
  g('listView').style.display = 'none'; g('stEmpty').style.display = 'none'; g('statsBar').style.display = 'none';
  if(!rs.agentes.length){
    g('stEmpty').style.display = 'block';
    g('emptyMsg').textContent = agSel
      ? 'Sin registros de ' + (userMap[agSel] || agSel) + ' en ' + monthLabel(ym)
      : 'Sin registros en ' + monthLabel(ym);
    return;
  }
  g('stReg').textContent = rs.filas; g('stAg').textContent = rs.agentes.length; g('stBono').textContent = rs.conBono;
  g('statsBar').style.display = 'flex';

  g('tblHead').innerHTML = '<th>Agente</th>' + PROSP_FIELDS.map(f => '<th>' + esc(f.label) + '</th>').join('') + '<th>Bono ' + BONO_EUROS + ' €</th>';
  const numCell = n => '<td><span class="' + (n > 0 ? 'num-val' : 'num-zero') + '">' + (n > 0 ? n : 0) + '</span></td>';
  const filas = rs.agentes.map(a => {
    const bono = a.bono.ok
      ? '<span class="bono si">Sí</span>'
      : '<span class="bono no">No<small>faltan ' + a.bono.faltan + '</small></span>';
    return '<tr><td class="td-agente">' + esc(a.nombre) + '</td>' + PROSP_FIELDS.map(f => numCell(a.sums[f.key])).join('') + '<td>' + bono + '</td></tr>';
  }).join('');
  const tot = '<tr class="tot"><td>Total</td>' + PROSP_FIELDS.map(f => '<td>' + rs.totales[f.key] + '</td>').join('') +
    '<td>' + rs.conBono + ' de ' + rs.agentes.length + '</td></tr>';
  g('tblBody').innerHTML = filas + tot;

  const nSemanas = weeksInMonth(ym);
  g('semanasList').innerHTML = rs.agentes.map(a =>
    '<li' + (a.filas > a.semanas ? ' class="dup"' : '') + '>' + esc(lineaSemanas(a, nSemanas)) + '</li>').join('');
  g('listView').style.display = 'block';
}

Object.assign(window, { loadData, render, stepMes });
})();
</script>
</body>
</html>

dar el bono por error. Mes por defecto = mes actual en hora de Madrid. Aviso si la lectura llega a 2000 filas o si algún registro no se cuenta porque su fecha no se puede leer o cae fuera del mes (singular y plural). Si la lectura falla: "No se pudieron cargar los datos." y el error. Los encabezados de la tabla no se parten a mitad de palabra en el móvil. Pruebas reports-prospeccion-mensual.test.js. -->
