<style>
/* Tokens de cuadro-comercial.html; medidas y colores de la maqueta aprobada (maqueta-cuadro.html, 28/10/2026) */
:root{

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:'Open Sans',sans-serif;background:var(--gray-1);color:var(--gray-5);min-height:100vh;padding-bottom:40px}
/* NAV (como cuadro-comercial.html) */
.top-nav{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border-bottom:1.5px solid var(--gray-2);box-shadow:0 2px 8px rgba(0,0,0,.07);position:sticky;top:0;z-index:300}
.nav-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.nav-logo img{height:26px;object-fit:contain}
.nav-center{flex:1;min-width:0;padding:0 6px}
.h-title{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;color:var(--gray-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{font-size:11px;color:var(--gray-4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-menu-btn{display:flex;align-items:center;justify-content:center;background:var(--red);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer}
.nav-menu-btn:hover{background:var(--red-dark)}
.user-pill{display:inline-flex;align-items:center;gap:4px;background:var(--gray-1);border:1.5px solid var(--gray-2);color:var(--gray-4);padding:4px 10px;border-radius:20px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:14px 12px}
/* Cabecera de la pagina y filtros */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:12px}
.page-head h1{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:900}
.page-head p{font-size:13px;color:var(--gray-4);margin-top:2px}
.filtros{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-left:auto}
.grupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grupo>span{font-size:11px;font-weight:700;color:var(--gray-4)}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--gray-2);background:#fff;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;color:var(--gray-5);cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1.5px solid var(--gray-5);background:#fff;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:var(--gray-5);cursor:pointer}
.btn.rojo{background:var(--red);border-color:var(--red);color:#fff}
/* Cuatro cuadros */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{background:#fff;border-radius:12px;box-shadow:var(--shadow-soft);padding:14px 16px;border-left:5px solid var(--gray-3);min-width:0}
.tile .k{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-4)}
.tile .v{font-family:'Montserrat',sans-serif;font-size:30px;font-weight:900;line-height:1.1;margin-top:4px}
.tile .v .de{font-size:14px;color:var(--gray-4);font-weight:700}
.tile .v.cargando{font-size:14px;color:var(--gray-4);font-weight:700;padding:8px 0}

.bar{height:6px;border-radius:3px;background:var(--gray-2);margin-top:8px;overflow:hidden}

.casa.b::before{background:var(--green)}.casa.r::before{background:var(--orange)}.casa.m::before{background:var(--red)}
.casa .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;margin-left:6px;padding-right:68px;line-height:1.2}

.h0{background:var(--gray-1);color:var(--gray-3)}.h1{background:#fde3c8;color:#9a5200}.h2{background:#f9bda6;color:#7a2e00}.h3{background:#f2847a;color:#fff}.h4{background:var(--red);color:#fff}
.hr{background:var(--orange-light);color:var(--orange)}
.sec{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;color:var(--gray-4);text-transform:uppercase;letter-spacing:.5px;padding-top:10px}
.pri{display:inline-block;padding:2px 9px;border-radius:20px;font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800}
.pri.alto{background:var(--red);color:#fff}.pri.medio{background:var(--orange-light);color:var(--orange)}.pri.bajo{background:var(--gray-1);color:var(--gray-4)}
td.casa-n{font-weight:700;white-space:nowrap}
.mot{font-size:11.5px;color:var(--gray-4);margin-top:2px}
a.abrir{color:var(--red);font-weight:800;text-decoration:none;white-space:nowrap;font-size:12px}
tr.extra{display:none}
.ver-todas tr.extra{display:table-row}
tr.mas td{text-align:center;font-size:11px;color:var(--gray-4)}
tr.mas a{color:var(--gray-4);text-decoration:none;cursor:pointer}

td.vacio{text-align:center;color:var(--gray-4);padding:16px 8px}

.msg{background:#fff;border-radius:12px;padding:30px 16px;text-align:center;font-weight:700;margin-top:20px}

@media(max-width:900px){.dos{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}

  .page-head h1{font-size:19px}

  .t-obras td.casa-n::before,.t-obras td.vacio::before,.t-obras tr.mas td::before{content:none}
  .t-obras td.vacio,.t-obras tr.mas td{justify-content:center}

/* Impresion: A4 vertical, sin menu ni botones, todas las obras */
@media print{

}

<script>
const WORKER = 'https://www.3villas.com/intranet/api';
const PAGE_VERSION = 1;

/* ── auto-detección de versión (copia de villa.html) ── */
(function checkForNewerVersion(){
  try{
    if(location.protocol==='file:')return;
    fetch(location.pathname,{cache:'reload'}).then(r=>r.text()).then(html=>{
      const m=html.match(/VERSIÓN ACTUAL:\s*v(\d+)/i);
      if(!m)return;
      const serverV=parseInt(m[1]);
      if(serverV>PAGE_VERSION){
        const key='3v_vchk_'+location.pathname+'_v'+serverV;
        if(!sessionStorage.getItem(key)){
          sessionStorage.setItem(key,'1');
          location.reload();
        }
      }
    }).catch(()=>{});
  }catch(e){}
})();

/* ── Funciones puras (las prueba cuadro-informes-temporada.test.js con vm) ── */
/* Los 26 elementos comprobados del formulario: secciones 'estado' de seccionesDef() de informe-temporada.html v4 (mismas claves, palabras y orden) */
function elementosDef(){
  const s=(seccion,claves)=>claves.map(c=>({seccion:seccion,clave:c[0],label:c[1]}));
  return [].concat(
    s('interior',[
      ['pintura','Pintura interior (paredes, techos, carpintería)'],['colchones','Colchones y almohadas'],['sofas','Sofás, tapicerías y alfombras'],
      ['mobiliario_cocina','Mobiliario y módulos de cocina'],['menaje','Menaje de cocina'],['electrodomesticos','Electrodomésticos'],
      ['aire_acondicionado','Aire acondicionado/ventiladores (equipos y mandos)'],['puertas','Puertas de entrada (cierre y entrada de agua)'],
      ['ventanas','Ventanas y contraventanas (manecillas, mecanismos)'],['banos','Baños: grifería, duchas y mamparas'],
      ['desagues','Desagües (atascos y olores)'],['iluminacion','Iluminación interior'],['humedades','Humedades y ventilación']]),
    s('exterior',[
      ['fachada','Fachada y pintura exterior'],['carpinteria_exterior','Carpintería exterior (madera / PVC)'],['pavimentos','Pavimentos, escalones y rampas'],
      ['barandillas','Barreras y barandillas'],['jardin_muros','Jardín, muros y vallas'],
      ['piscina','Piscina (vaso, gresites, filtro / skimmer, ducha, depuradora, etc)'],['mobiliario_exterior','Mobiliario exterior'],
      ['barbacoa','Barbacoa'],['iluminacion_exterior','Iluminación exterior']]),
    s('seguridad',[
      ['cerraduras','Cerraduras y accesos'],['instalacion_electrica','Instalación eléctrica (cuadro, diferencial, potencia)'],
      ['fontaneria_agua_caliente','Fontanería y agua caliente (fugas, termo, llaves de paso, contador)'],['wifi_tv','Wifi y TV']]));
}
function gruposMapa(){return [['interior','Interior'],['exterior','Exterior'],['seguridad','Seguridad e instalaciones']];}
function temporadasDe(y){y=parseInt(y,10);return[y-1,y,y+1];}
/* Ids de la temporada en trozos de n informes (ordenados, sin repetir); cada trozo es una lectura de líneas */
function trozosIds(ids,n){
  const v=Array.from(new Set((ids||[]).map(x=>parseInt(x,10)).filter(x=>x>0))).sort((a,b)=>a-b),out=[];
  for(let i=0;i<v.length;i+=n)out.push(v.slice(i,i+n));
  return out;
}
/* Todas las secciones de un trozo: rango de informe_id (luego se guardan solo las del conjunto exacto) */
function whereLineasRango(ids){
  const n=(ids||[]).map(x=>parseInt(x,10)).filter(x=>x>0);
  return 'informe_id>='+Math.min.apply(null,n)+' AND informe_id<='+Math.max.apply(null,n);
}
/* Dos informes para la misma villa y temporada: vale el de informe_id más bajo (como el listado y el formulario) */
function informePorVilla(informes){
  const p={};(informes||[]).forEach(i=>{const k=String(i.villaid);if(!p[k]||parseInt(i.informe_id,10)<parseInt(p[k].informe_id,10))p[k]=i;});
  return p;
}
/* Una fila por informe, sección y clave; gana el linea_id más alto (como lineasDesdeFilas del formulario) */
function lineasUnicas(lineas){
  const m={};
  (lineas||[]).forEach(l=>{if(!l)return;const k=parseInt(l.informe_id,10)+'|'+l.seccion+'|'+l.clave,p=m[k];if(p&&(parseInt(p.linea_id,10)||0)>=(parseInt(l.linea_id,10)||0))return;m[k]=l;});
  return Object.keys(m).map(k=>m[k]);
}
/* Villa manager: KeyHolder_person es un contacto (ContactID) o un usuario (UserID), como resContact de villa.html */
function nombreVM(kh,contacts,users){
  const id=String(kh==null?'':kh).trim();if(!id)return'';
  const c=(contacts||[]).find(x=>x.id===id);if(c)return c.name;
  const u=(users||[]).find(x=>x.id===id);return u?u.name:'';
}
function abrirUrl(villaid,temporada){return 'informe-temporada.html?villaid='+encodeURIComponent(villaid)+'&temporada='+encodeURIComponent(temporada);}
function fechaVer(v){const m=String(v||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
/* Una fila por villa activa con su informe (el más bajo), su estado y las marcas M / R / A */
function construirCasas(villas,informes,lineas,contacts,users,temporada){
  const pv=informePorVilla(informes),lw=s=>String(s==null?'':s).trim().toLowerCase();
  const secc=gruposMapa().map(x=>x[0]),porInf={};
  (lineas||[]).forEach(l=>{const k=String(parseInt(l.informe_id,10));(porInf[k]=porInf[k]||[]).push(l);});
  return (villas||[]).map(v=>{
    const inf=pv[String(v.villaid)],id=inf?parseInt(inf.informe_id,10):null,ls=inf?(porInf[String(id)]||[]):[];
    const marca=e=>ls.filter(l=>secc.indexOf(l.seccion)>=0&&lw(l.estado)===e).length;
    const g=inf?lw(inf.estado_general):'';
    return{villaid:v.villaid,villa:String(v.Name||('Villa '+v.villaid)),vm:nombreVM(v.KeyHolder_person,contacts,users),informe_id:id,
      estado:inf?(lw(inf.estado)==='enviado'?'enviado':'borrador'):'',general:['bueno','regular','malo'].indexOf(g)>=0?g:'',
      fecha:inf?fechaVer(inf.fecha_revision):'',malo:marca('malo'),regular:marca('regular'),
      alta:ls.filter(l=>l.seccion==='resumen'&&String(l.texto_1||'').trim()&&lw(l.prioridad)==='alta').length,url:abrirUrl(v.villaid,temporada)};
  });
}
/* Grupo de la tarjeta: estado general; sin él, el estado del informe (borrador); sin informe: 'sin' */
function estadoDe(f){return f.general||f.estado||'sin';}
/* Los cuatro cuadros. Solo cuentan las líneas de los informes de estas filas */
function tiles(filas,lineas){
  const lw=s=>String(s==null?'':s).trim().toLowerCase(),secc=gruposMapa().map(x=>x[0]);
  const ids=new Set(filas.filter(f=>f.informe_id).map(f=>String(f.informe_id)));
  const ls=(lineas||[]).filter(l=>ids.has(String(parseInt(l.informe_id,10))));
  const acc=ls.filter(l=>l.seccion==='resumen'&&String(l.texto_1||'').trim()),alta=acc.filter(l=>lw(l.prioridad)==='alta');
  const marcas=ls.filter(l=>secc.indexOf(l.seccion)>=0);
  return{entregados:filas.filter(f=>f.estado==='enviado').length,total:filas.length,
    borrador:filas.filter(f=>f.estado==='borrador').length,sin:filas.filter(f=>!f.informe_id).length,
    casasMalo:(n=>({n:n.length,nombres:n}))(ordenarCasas(filas).filter(f=>f.general==='malo').map(f=>f.villa)),
    accionesAlta:{n:alta.length,casas:new Set(alta.map(l=>String(parseInt(l.informe_id,10)))).size,total:acc.length},
    marcasMalo:{n:marcas.filter(l=>lw(l.estado)==='malo').length,comprobaciones:ids.size*elementosDef().length,regular:marcas.filter(l=>lw(l.estado)==='regular').length}};
}
function textoNombres(n,max){return n.slice(0,max).join(', ')+(n.length>max?' +'+(n.length-max):'');}
/* Peor primero: Malo, Regular, Bueno, Borrador sin estado general, Sin informe; dentro, marcas Malo de más a menos y nombre */
function ordenarCasas(filas){
  const rango={malo:0,regular:1,bueno:2,borrador:3,enviado:3,sin:4};
  return filas.slice().sort((a,b)=>(rango[estadoDe(a)]-rango[estadoDe(b)])||((b.malo||0)-(a.malo||0))||a.villa.localeCompare(b.villa,'es',{sensitivity:'base'}));
}
/* Nº de casas con cada elemento en Malo y en Regular (una casa cuenta una vez por elemento) */
function mapaProblemas(lineas,filas){
  const out={},visto={},lw=s=>String(s==null?'':s).trim().toLowerCase();
  elementosDef().forEach(e=>{out[e.clave]={malo:0,regular:0};});
  const ids=new Set(filas.filter(f=>f.informe_id).map(f=>String(f.informe_id)));
  (lineas||[]).forEach(l=>{
    const id=String(parseInt(l.informe_id,10)),e=lw(l.estado),k=id+'|'+l.clave+'|'+e;
    if(!ids.has(id)||!out[l.clave]||(e!=='malo'&&e!=='regular')||visto[k])return;
    visto[k]=1;out[l.clave][e]++;
  });
  return out;
}
/* Color del nº de casas en Malo: 0 h0, 1 h1, 2-3 h2, 4-6 h3, 7+ h4 */
function claseCalor(n){return n<=0?'h0':n<=1?'h1':n<=3?'h2':n<=6?'h3':'h4';}
/* Palabras de prioridad: se ve Alto/Medio/Bajo, se guarda Alta/Media/Baja (copia del formulario) */
function prioridadVer(v){const s=String(v==null?'':v).trim(),m={alta:'Alto',media:'Medio',baja:'Bajo'};return m[s.toLowerCase()]||s;}
function prioridadGuardar(t){const s=String(t==null?'':t).trim(),m={alto:'Alta',medio:'Media',bajo:'Baja'};return m[s.toLowerCase()]||s;}
/* Obras pendientes: cada línea de 'resumen' con la actuación escrita; Alta, Media, Baja, sin prioridad; luego casa y orden */
function obras(lineas,filas){
  const lw=s=>String(s==null?'':s).trim().toLowerCase(),porId={},rango={alta:0,media:1,baja:2};
  filas.forEach(f=>{if(f.informe_id)porId[String(f.informe_id)]=f;});
  const may=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
  return (lineas||[]).filter(l=>l.seccion==='resumen'&&String(l.texto_1||'').trim()&&porId[String(parseInt(l.informe_id,10))]).map(l=>{
    const f=porId[String(parseInt(l.informe_id,10))],p=lw(l.prioridad),ver=prioridadVer(p);
    return{villa:f.villa,vm:f.vm,accion:String(l.texto_1).trim(),motivo:String(l.texto_2||'').trim(),prioridad:rango[p]!==undefined?ver:'',
      clase:rango[p]!==undefined?lw(ver):'',rango:rango[p]!==undefined?rango[p]:3,orden:parseInt(l.orden,10)||0,general:may(f.general),fecha:f.fecha,url:f.url};
  }).sort((a,b)=>(a.rango-b.rango)||a.villa.localeCompare(b.villa,'es',{sensitivity:'base'})||(a.orden-b.orden));
}
/* Filtro de villa manager: sus casas y las líneas de sus informes; '' = todas */
function filtrarPorVM(filas,lineas,vm){
  if(!vm)return{filas:filas,lineas:lineas};
  const f=filas.filter(x=>x.vm===vm),ids=new Set(f.filter(x=>x.informe_id).map(x=>String(x.informe_id)));
  return{filas:f,lineas:(lineas||[]).filter(l=>ids.has(String(parseInt(l.informe_id,10))))};
}
function vmsDe(filas){return Array.from(new Set(filas.map(f=>f.vm).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* Igual que informe-reservas.html: texto que empieza por = + - @ lleva apostrofo para que Excel no lo ejecute */
function csvCell(v){
  var s = String(v == null ? '' : v);
  if (/^[=@\t\r]/.test(s) || /^[+\-](?![\d\s().\-]+$)/.test(s)) s = "'" + s;
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* CSV de obras para Excel en español: BOM UTF-8 y ';' (como el listado) */
function csvObras(rows){
  const lines=[['Casa','Villa manager','Actuación','Motivo / impacto','Prioridad','Estado general de la casa','Fecha de revisión'].map(csvCell).join(';')];
  rows.forEach(r=>lines.push([r.villa,r.vm,r.accion,r.motivo,r.prioridad,r.general,r.fecha].map(csvCell).join(';')));
  return '﻿'+lines.join('\r\n')+'\r\n';
}
function puedeVerCuadro(role){const r=String(role||'').trim().toLowerCase();return r==='admin'||r==='manager';}

/* ── Pagina ── */
const g=id=>document.getElementById(id);
const TROZO=15,LIMITE=1000,MAX_OBRAS=10;
let VILLAS=[],USERS=[],CONTACTS=[],INFORMES=[],LINEAS=[],FILAS=[];
const TEMPORADAS=temporadasDe(new Date().getFullYear());
let TEMP=new Date().getFullYear(),VM='',MAS=false,PETICION=0;
async function leerJson(u){const r=await fetch(Auth.url(u));if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return j.Result||j.result||[];}
/* Un trozo de ids; si llega al límite (informes de otra temporada dentro del rango) se parte en dos y se lee otra vez */
async function leerTrozo(ids){
  const rows=await leerJson(WORKER+'?action=data&table=TaInformeTemporadaLineas&where='+encodeURIComponent(whereLineasRango(ids))+'&limit='+LIMITE);
  if(rows.length<LIMITE||ids.length<2)return rows;
  const m=Math.ceil(ids.length/2),r=await Promise.all([leerTrozo(ids.slice(0,m)),leerTrozo(ids.slice(m))]);
  return r[0].concat(r[1]);
}
/* Informes de la temporada y después todas sus líneas, por trozos de 15 informes; se guardan solo las de ese conjunto */
async function leerTemporada(t){
  const informes=await leerJson(WORKER+'?action=data&table=TaInformeTemporada&where='+encodeURIComponent('temporada='+parseInt(t,10))+'&limit=500');
  const ids=informes.map(i=>parseInt(i.informe_id,10)).filter(x=>x>0);
  if(!ids.length)return{informes:informes,lineas:[]};
  const set=new Set(ids.map(String));
  const trozos=await Promise.all(trozosIds(ids,TROZO).map(leerTrozo));
  return{informes:informes,lineas:lineasUnicas([].concat.apply([],trozos).filter(l=>set.has(String(parseInt(l.informe_id,10)))))};
}
/* Contador de peticiones: si llega tarde la respuesta de una temporada tocada antes, se ignora */
async function cargarInformes(t){
  const n=++PETICION;
  const r=await leerTemporada(t);
  if(n!==PETICION)return false;
  INFORMES=r.informes;LINEAS=r.lineas;
  return true;
}
async function cargarTodo(){
  const [v,u,c]=await Promise.all([
    leerJson(WORKER+'?action=data&table=TaVillas&where='+encodeURIComponent('Status=1')+'&limit=500'),
    leerJson(WORKER+'?action=data&table=TaUsers&limit=200'),
    leerJson(WORKER+'?action=data&table=TaContacts&limit=500'),
    cargarInformes(TEMP)
  ]);
  VILLAS=v;
  USERS=u.map(x=>({id:String(x.UserID||''),name:x.Name||x.UserID||''})).filter(x=>x.id);
  CONTACTS=c.map(x=>({id:String(x.ContactID||x.contactid||x.Id||x.id||''),name:x.Name||x.Nombre||x.Full_Name||x.FullName||''})).filter(x=>x.id&&x.name);
}
const TITULOS=[['verde','Informes entregados'],['rojo','Casas en estado Malo'],['naranja','Actuaciones prioridad Alta'],['','Marcas Malo en elementos']];
function esqueleto(){
  g('main').innerHTML='<div class="page-head"><div><h1>Informes de fin de temporada</h1><p>Qué casas necesitan obra, qué obra, y quién no ha entregado el informe.</p></div>'
    +'<div class="filtros" id="filtros"></div></div>'
    +'<div class="tiles" id="tiles"></div>'
    +'<div class="card"><h3>Casas <small>· peor primero · un clic abre el informe</small></h3><div class="casas" id="casas"></div>'
    +'<div class="leyenda"><span><i style="background:var(--green)"></i>Bueno</span><span><i style="background:var(--orange)"></i>Regular</span><span><i style="background:var(--red)"></i>Malo</span><span><i style="background:var(--gray-3)"></i>Sin informe</span><span>M = marcas Malo · R = marcas Regular · A = actuaciones Alta</span></div></div>'
    +'<div class="dos"><div class="card"><h3>Mapa de problemas <small>· nº de casas por elemento</small></h3><table id="mapa"></table>'
    +'<p class="small-print">Un elemento con muchas casas en Malo es una compra o una obra que se planifica una sola vez.</p></div>'
    +'<div class="card" id="cardObras"><h3>Obras pendientes <small>· actuaciones prioritarias de todas las casas</small></h3><table class="t-obras" id="obras"></table>'
    +'<p class="small-print">Filtra por villa manager; el CSV lleva la lista al presupuesto de obras.</p></div></div>';
}
function pintarFiltros(){
  const vms=vmsDe(FILAS);if(VM&&vms.indexOf(VM)<0)VM='';
  g('filtros').innerHTML='<div class="grupo"><span>Temporada</span>'+TEMPORADAS.map(t=>'<button class="chip'+(t===TEMP?' on':'')+'" data-temp="'+t+'" onclick="cambiarTemporada('+t+')">'+t+'</button>').join('')+'</div>'
    +'<div class="grupo"><span>Villa manager</span>'+[['','Todos']].concat(vms.map(v=>[v,v])).map(v=>'<button class="chip'+(v[0]===VM?' on':'')+'" data-vm="'+esc(v[0])+'" onclick="elegirVM(this.dataset.vm)">'+esc(v[1])+'</button>').join('')+'</div>'
    +'<button class="btn" onclick="descargarCsv()">⬇ CSV obras</button><button class="btn rojo" onclick="window.print()">🖨 Imprimir</button>';
}
function pintarCargando(){g('tiles').innerHTML=TITULOS.map(t=>'<div class="tile '+t[0]+'"><div class="k">'+t[1]+'</div><div class="v cargando">Cargando…</div></div>').join('');}
function tileHtml(i,v,s,extra){return '<div class="tile '+TITULOS[i][0]+'"><div class="k">'+TITULOS[i][1]+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div>'+(extra||'')+'</div>';}
function casaHtml(f){
  const e=estadoDe(f),c={malo:'m',regular:'r',bueno:'b',sin:'s'}[e]||'d',et={malo:'MALO',regular:'REGULAR',bueno:'BUENO',sin:'SIN INFORME',borrador:'BORRADOR',enviado:'ENVIADO'}[e];
  const vm=e==='sin'?'VM '+esc(f.vm||'—')+' · no entregado':esc(f.vm||'—')+(f.fecha?' · '+f.fecha:'');
  const pills=e==='sin'?'<span class="pill sin">sin informe</span>'
    :(f.estado==='borrador'?'<span class="pill borrador">borrador</span>':'')+'<span class="pill m">M '+f.malo+'</span><span class="pill r">R '+f.regular+'</span><span class="pill a">A '+f.alta+'</span>';
  return '<a class="casa '+c+'" href="'+esc(f.url)+'"><div class="est">'+et+'</div><div class="n">'+esc(f.villa)+'</div><div class="vm">'+vm+'</div><div class="cnt">'+pills+'</div></a>';
}
function mapaHtml(mp){
  const el=elementosDef();
  return '<thead><tr><th>Elemento</th><th class="num">Malo</th><th class="num">Regular</th></tr></thead><tbody>'+gruposMapa().map(gr=>
    '<tr><td class="sec" colspan="3">'+gr[1]+'</td></tr>'+el.filter(e=>e.seccion===gr[0]).map((e,i)=>[e,i])
      .sort((a,b)=>(mp[b[0].clave].malo-mp[a[0].clave].malo)||(mp[b[0].clave].regular-mp[a[0].clave].regular)||(a[1]-b[1]))
      .map(x=>{const m=mp[x[0].clave];return '<tr><td>'+esc(x[0].label)+'</td><td class="num"><span class="heat '+claseCalor(m.malo)+'">'+m.malo+'</span></td><td class="num"><span class="heat '+(m.regular?'hr':'h0')+'">'+m.regular+'</span></td></tr>';}).join('')
  ).join('')+'</tbody>';
}
function obrasHtml(rows){
  const cab='<thead><tr><th>Casa</th><th>Actuación</th><th>Prioridad</th><th>VM</th><th></th></tr></thead><tbody>';
  if(!rows.length)return cab+'<tr><td colspan="5" class="vacio">Ninguna actuación todavía</td></tr></tbody>';
  const resto=rows.length-MAX_OBRAS;
  return cab+rows.map((r,i)=>'<tr class="obra'+(i>=MAX_OBRAS&&!MAS?' extra':'')+'"><td class="casa-n" data-l="Casa">'+esc(r.villa)+'</td>'
    +'<td data-l="Actuación"><div>'+esc(r.accion)+(r.motivo?'<div class="mot">'+esc(r.motivo)+'</div>':'')+'</div></td>'
    +'<td data-l="Prioridad">'+(r.prioridad?'<span class="pri '+r.clase+'">'+r.prioridad+'</span>':'—')+'</td>'
    +'<td data-l="VM">'+esc(r.vm||'—')+'</td><td data-l=""><a class="abrir" href="'+esc(r.url)+'">Abrir ›</a></td></tr>').join('')
    +(resto>0&&!MAS?'<tr class="mas"><td colspan="5"><a onclick="verMas()">… '+resto+' actuaciones más</a></td></tr>':'')+'</tbody>';
}
function vista(){return filtrarPorVM(FILAS,LINEAS,VM);}
function pintar(){
  FILAS=ordenarCasas(construirCasas(VILLAS,INFORMES,LINEAS,CONTACTS,USERS,TEMP));
  pintarFiltros();
  const v=vista(),t=tiles(v.filas,v.lineas),pc=t.total?Math.round(t.entregados*100/t.total):0;
  g('tiles').innerHTML=tileHtml(0,t.entregados+' <span class="de">de '+t.total+'</span>',t.borrador+' en borrador · '+t.sin+' sin informe','<div class="bar"><i style="width:'+pc+'%"></i></div>')
    +tileHtml(1,t.casasMalo.n,t.casasMalo.n?esc(textoNombres(t.casasMalo.nombres,6)):'Ninguna casa en Malo')
    +tileHtml(2,t.accionesAlta.n,'en '+t.accionesAlta.casas+' casa'+(t.accionesAlta.casas===1?'':'s')+' · '+t.accionesAlta.total+' actuaciones en total')
    +tileHtml(3,t.marcasMalo.n,'de '+t.marcasMalo.comprobaciones+' comprobaciones · '+t.marcasMalo.regular+' Regular');
  g('casas').innerHTML=v.filas.map(casaHtml).join('');
  g('mapa').innerHTML=mapaHtml(mapaProblemas(v.lineas,v.filas));
  g('obras').innerHTML=obrasHtml(obras(v.lineas,v.filas));
}
function elegirVM(vm){VM=vm||'';MAS=false;pintar();}
function verMas(){MAS=true;pintar();}
function error(){g('main').innerHTML='<div class="msg err">No se pudieron leer los informes <button class="btn" onclick="iniciar()">Reintentar</button></div>';}
function descargarCsv(){
  const v=vista();
  const blob=new Blob([csvObras(obras(v.lineas,v.filas))],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='obras-temporada-'+TEMP+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
/* Cambiar de temporada lee otra vez informes y líneas, nunca las villas */
async function cambiarTemporada(t){
  TEMP=t;MAS=false;
  if(!/class="tiles"/.test(g('main').innerHTML))esqueleto();
  pintarFiltros();pintarCargando();
  const n=PETICION+1;
  try{if(await cargarInformes(t))pintar();}
  catch(e){console.error(e);if(n===PETICION)error();}
}
async function iniciar(){
  if(!puedeVerCuadro(Auth.role())){g('main').innerHTML='<div class="msg err">Sin acceso</div>';return;}
  esqueleto();pintarFiltros();pintarCargando();
  try{await cargarTodo();pintar();}
  catch(e){console.error(e);error();}
}
document.addEventListener('DOMContentLoaded',iniciar);
</script>
</body>
</html>
<!-- HISTORIAL: v1 - 28/10/2026 — primera versión: cuadro para dirección (Jordi, Toni y Gary) de los informes de fin de temporada que rellenan los villa managers en informe-temporada.html v4. Gary aprobó la maqueta con datos inventados (maqueta-cuadro.html) el 28/10/2026 y pidió construirla ("build it"). Una sola pantalla para todas las casas: cuatro cuadros (informes entregados, casas en estado Malo, actuaciones de prioridad Alta, marcas Malo en elementos), las casas de peor a mejor con un clic al informe, el mapa de problemas (nº de casas en Malo y en Regular por cada uno de los 26 elementos del formulario, con el color por tramos 0, 1, 2-3, 4-6, 7 o más), la lista de obras pendientes (Alta, Media, Baja; 10 a la vista y el resto con "más") y el CSV de obras para Excel (punto y coma, UTF-8 con BOM). Filtros de temporada (año anterior, actual y siguiente) y de villa manager, que se aplica a todo a la vez. Lee las mismas tablas que informes-temporada.html (TaVillas, TaUsers, TaContacts, TaInformeTemporada) y todas las secciones de TaInformeTemporadaLineas por trozos de 15 informes (un trozo que llega a 1000 filas se parte en dos); vale el informe_id más bajo por villa y la línea de linea_id más alto por clave, como el formulario. Solo lecturas: la página no escribe nada. Móvil: cuadros en una columna, dos casas por fila, obras en tarjetas. Impresión A4 vertical con todas las obras. Pruebas: cuadro-informes-temporada.test.js (funciones puras con vm y el script real con el Worker falso de arnes-informe.js). -->
