/* Tokens de cuadro-comercial.html; medidas y colores de la maqueta aprobada (maqueta-cuadro.html, 28/10/2026) */
:root{
  --red:#C8102E;--red-dark:#9e0c24;--red-light:#fce8eb;
  --green:#1e9e4e;--green-light:#e6f7ee;
  --orange:#e07b00;--orange-light:#fff4e0;
  --gray-1:#f4f5f7;--gray-2:#e8eaed;--gray-3:#c4c9d4;--gray-4:#7a8194;--gray-5:#2d3142;
  --shadow-soft:0 2px 10px rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:'Open Sans',sans-serif;background:var(--gray-1);color:var(--gray-5);min-height:100vh;padding-bottom:40px}
/* NAV (como cuadro-comercial.html) */
.top-nav{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border-bottom:1.5px solid var(--gray-2);box-shadow:0 2px 8px rgba(0,0,0,.07);position:sticky;top:0;z-index:300}
.nav-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.nav-logo img{height:26px;object-fit:contain}
.nav-center{flex:1;min-width:0;padding:0 6px}
.h-title{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;color:var(--gray-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{font-size:11px;color:var(--gray-4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-menu-btn{display:flex;align-items:center;justify-content:center;background:var(--red);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer}
.nav-menu-btn:hover{background:var(--red-dark)}
.user-pill{display:inline-flex;align-items:center;gap:4px;background:var(--gray-1);border:1.5px solid var(--gray-2);color:var(--gray-4);padding:4px 10px;border-radius:20px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:14px 12px}
/* Cabecera de la pagina y filtros */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:12px}
.page-head h1{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:900}
.page-head p{font-size:13px;color:var(--gray-4);margin-top:2px}
.filtros{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-left:auto}
.grupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grupo>span{font-size:11px;font-weight:700;color:var(--gray-4)}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--gray-2);background:#fff;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;color:var(--gray-5);cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1.5px solid var(--gray-5);background:#fff;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:var(--gray-5);cursor:pointer}
.btn.rojo{background:var(--red);border-color:var(--red);color:#fff}
/* Cuatro cuadros */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{background:#fff;border-radius:12px;box-shadow:var(--shadow-soft);padding:14px 16px;border-left:5px solid var(--gray-3);min-width:0}
.tile .k{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-4)}
.tile .v{font-family:'Montserrat',sans-serif;font-size:30px;font-weight:900;line-height:1.1;margin-top:4px}
.tile .v .de{font-size:14px;color:var(--gray-4);font-weight:700}
.tile .v.cargando{font-size:14px;color:var(--gray-4);font-weight:700;padding:8px 0}
.tile .s{font-size:11px;color:var(--gray-4);margin-top:2px}
.tile.verde{border-left-color:var(--green)}.tile.verde .v{color:var(--green)}
.tile.rojo{border-left-color:var(--red)}.tile.rojo .v{color:var(--red)}
.tile.naranja{border-left-color:var(--orange)}.tile.naranja .v{color:var(--orange)}
.tile .v.cargando{color:var(--gray-4)}
.bar{height:6px;border-radius:3px;background:var(--gray-2);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
/* Tarjetas */
.card{background:#fff;border-radius:12px;box-shadow:var(--shadow-soft);padding:14px 16px;margin-bottom:14px;min-width:0}
.card h3{font-family:'Montserrat',sans-serif;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-4);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3 small{font-weight:600;text-transform:none;letter-spacing:0;color:var(--gray-4)}
.dos{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start}
/* Casas */
.casas{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.casa{display:block;border:1.5px solid var(--gray-2);border-radius:10px;padding:10px 11px;position:relative;background:#fff;color:inherit;text-decoration:none;cursor:pointer}
.casa:hover{border-color:var(--gray-3);box-shadow:var(--shadow-soft)}
.casa::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--gray-3)}
.casa.b::before{background:var(--green)}.casa.r::before{background:var(--orange)}.casa.m::before{background:var(--red)}
.casa .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;margin-left:6px;padding-right:68px;line-height:1.2}
.casa .vm{font-size:11px;color:var(--gray-4);margin:1px 0 7px 6px}
.casa .cnt{display:flex;gap:6px;margin-left:6px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;white-space:nowrap}
.pill.m{background:var(--red-light);color:var(--red)}.pill.r{background:var(--orange-light);color:var(--orange)}.pill.a{background:var(--gray-1);color:var(--gray-5);border:1px solid var(--gray-2)}
.pill.sin{background:var(--gray-1);color:var(--gray-4);border:1px dashed var(--gray-3)}
.pill.borrador{background:var(--orange-light);color:var(--orange)}
.pill.gris{background:var(--gray-2);color:var(--gray-4);margin-left:4px;vertical-align:1px}
.casa .est{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;position:absolute;right:10px;top:10px;color:var(--gray-4)}
.casa.b .est{color:var(--green)}.casa.r .est{color:var(--orange)}.casa.m .est{color:var(--red)}.casa.s .est{color:var(--gray-4)}
.casa.s{background:var(--gray-1);border-style:dashed}
.casa.s::before{background:var(--gray-2)}
.leyenda{display:flex;gap:14px;font-size:11px;color:var(--gray-4);margin-top:10px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* Mapa y obras */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--gray-2);text-align:left;vertical-align:middle}
th{font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:800;color:var(--gray-4);white-space:nowrap}
td.num,th.num{text-align:center;width:54px}
.heat{display:inline-block;min-width:30px;padding:2px 6px;border-radius:6px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11px;text-align:center}
.h0{background:var(--gray-1);color:var(--gray-3)}.h1{background:#fde3c8;color:#9a5200}.h2{background:#f9bda6;color:#7a2e00}.h3{background:#f2847a;color:#fff}.h4{background:var(--red);color:#fff}
.hr{background:var(--orange-light);color:var(--orange)}
.sec{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;color:var(--gray-4);text-transform:uppercase;letter-spacing:.5px;padding-top:10px}
.pri{display:inline-block;padding:2px 9px;border-radius:20px;font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800}
.pri.alto{background:var(--red);color:#fff}.pri.medio{background:var(--orange-light);color:var(--orange)}.pri.bajo{background:var(--gray-1);color:var(--gray-4)}
td.casa-n{font-weight:700;white-space:nowrap}
.t-obras td{overflow-wrap:anywhere}
.t-obras td[data-l="VM"],.t-obras td[data-l="Prioridad"]{overflow-wrap:normal}
.mot{font-size:11.5px;color:var(--gray-4);margin-top:2px}
a.abrir{color:var(--red);font-weight:800;text-decoration:none;white-space:nowrap;font-size:12px}
tr.extra{display:none}
.ver-todas tr.extra{display:table-row}
tr.mas td{text-align:center;font-size:11px;color:var(--gray-4)}
.mas-btn{background:none;border:none;padding:0;font:inherit;color:var(--gray-4);cursor:pointer}
.mas-btn:hover,.mas-btn:focus-visible{color:var(--red)}
td.vacio{text-align:center;color:var(--gray-4);padding:16px 8px}

@media(max-width:900px){.dos{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
/* Movil: cuadros en una columna, dos casas por fila, mapa y obras apilados; las obras pasan a tarjetas (regla de la casa) */
@media (max-width: 640px){
  main{padding:10px}
  .page-head h1{font-size:19px}

  .tiles{grid-template-columns:1fr}
  .casas{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .casa .n{padding-right:0;margin-top:14px}
  .card{padding:12px}
  .t-obras thead{display:none}
  .t-obras,.t-obras tbody,.t-obras tr,.t-obras td{display:block;width:100%}
  .t-obras tr{border:1.5px solid var(--gray-2);border-radius:10px;margin-bottom:8px;padding:6px 10px;background:#fff}
  .t-obras tr.extra{display:none}
  .ver-todas .t-obras tr.extra{display:block}
  .t-obras tr.mas{border:none;background:none}
  .t-obras td{border:none;padding:3px 0;display:flex;justify-content:space-between;gap:10px;text-align:right}
  .t-obras td::before{content:attr(data-l);font-size:11px;font-weight:700;color:var(--gray-4);flex-shrink:0;text-align:left}
  .t-obras td.casa-n{font-size:14px;white-space:normal;text-align:left}
  .t-obras td.casa-n::before,.t-obras td.vacio::before,.t-obras tr.mas td::before{content:none}
  .t-obras td.vacio,.t-obras tr.mas td{justify-content:center}
}
/* Impresion: A4 vertical, sin menu ni botones, todas las obras */
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top-nav,.filtros .btn,tr.mas{display:none !important}
  body>*:not(main){display:none!important}
  main{max-width:none;padding:0}
  tr.extra{display:table-row !important}
  .tile,.casa,tr{break-inside:avoid}
  .card h3{break-after:avoid}
  .t-obras th:last-child,.t-obras tr.obra td:last-child{display:none!important}
  .card,.tile{box-shadow:none;border:1px solid var(--gray-2)}
  .tile{border-left-width:5px}
}

<script>
const WORKER = 'https://www.3villas.com/intranet/api';
const PAGE_VERSION = 3;

/* ── auto-detección de versión (copia de villa.html) ── */
(function checkForNewerVersion(){
  try{
    if(location.protocol==='file:')return;
    fetch(location.pathname,{cache:'reload'}).then(r=>r.text()).then(html=>{
      const m=html.match(/VERSIÓN ACTUAL:\s*v(\d+)/i);
      if(!m)return;
      const serverV=parseInt(m[1]);
      if(serverV>PAGE_VERSION){
        const key='3v_vchk_'+location.pathname+'_v'+serverV;
        if(!sessionStorage.getItem(key)){
          sessionStorage.setItem(key,'1');
          location.reload();
        }
      }
    }).catch(()=>{});
  }catch(e){}
})();

/* ── Funciones puras (las prueba cuadro-informes-temporada.test.js con vm) ── */
/* v3: las vistas usan los scripts del cuadro (Portada, Listas, Vistas, Extras); de estas funciones de la v2 siguen en uso elementosDef, temporadasDe,
   trozosIds, whereLineasRango, lineasUnicas, vmsDe, esc y puedeVerCuadro. Las demás (construirCasas, tiles, obras, mapaProblemas, informePorVilla…)
   ya no pintan nada: se quedan mientras las pruebas de la v2 las fijen (INTEGRATION.md del cuadro v3a). */
/* Los 26 elementos comprobados del formulario: secciones 'estado' de seccionesDef() de informe-temporada.html v4 (mismas claves, palabras y orden) */
function elementosDef(){
  const s=(seccion,claves)=>claves.map(c=>({seccion:seccion,clave:c[0],label:c[1]}));
  return [].concat(
    s('interior',[
      ['pintura','Pintura interior (paredes, techos, carpintería)'],['colchones','Colchones y almohadas'],['sofas','Sofás, tapicerías y alfombras'],
      ['mobiliario_cocina','Mobiliario y módulos de cocina'],['menaje','Menaje de cocina'],['electrodomesticos','Electrodomésticos'],
      ['aire_acondicionado','Aire acondicionado/ventiladores (equipos y mandos)'],['puertas','Puertas de entrada (cierre y entrada de agua)'],
      ['ventanas','Ventanas y contraventanas (manecillas, mecanismos)'],['banos','Baños: grifería, duchas y mamparas'],
      ['desagues','Desagües (atascos y olores)'],['iluminacion','Iluminación interior'],['humedades','Humedades y ventilación']]),
    s('exterior',[
      ['fachada','Fachada y pintura exterior'],['carpinteria_exterior','Carpintería exterior (madera / PVC)'],['pavimentos','Pavimentos, escalones y rampas'],
      ['barandillas','Barreras y barandillas'],['jardin_muros','Jardín, muros y vallas'],
      ['piscina','Piscina (vaso, gresites, filtro / skimmer, ducha, depuradora, etc)'],['mobiliario_exterior','Mobiliario exterior'],
      ['barbacoa','Barbacoa'],['iluminacion_exterior','Iluminación exterior']]),
    s('seguridad',[
      ['cerraduras','Cerraduras y accesos'],['instalacion_electrica','Instalación eléctrica (cuadro, diferencial, potencia)'],
      ['fontaneria_agua_caliente','Fontanería y agua caliente (fugas, termo, llaves de paso, contador)'],['wifi_tv','Wifi y TV']]));
}
function gruposMapa(){return [['interior','Interior'],['exterior','Exterior'],['seguridad','Seguridad e instalaciones']];}
function temporadasDe(y){y=parseInt(y,10);return[y-1,y,y+1];}
/* Ids de la temporada en trozos de n informes (ordenados, sin repetir); cada trozo es una lectura de líneas */
function trozosIds(ids,n){
  const v=Array.from(new Set((ids||[]).map(x=>parseInt(x,10)).filter(x=>x>0))).sort((a,b)=>a-b),out=[];
  for(let i=0;i<v.length;i+=n)out.push(v.slice(i,i+n));
  return out;
}
/* Un trozo: rango de informe_id (luego se guardan solo las del conjunto exacto) y las 8 secciones del formulario (v3: también estancia, huesped, final y foto, para obras, comentarios, la casa y las fotos) */
function whereLineasRango(ids){
  const n=(ids||[]).map(x=>parseInt(x,10)).filter(x=>x>0);
  return 'informe_id>='+Math.min.apply(null,n)+' AND informe_id<='+Math.max.apply(null,n)+" AND seccion IN ('resumen','interior','exterior','seguridad','estancia','huesped','final','foto')";
}
/* Dos informes para la misma villa y temporada: vale el de informe_id más bajo (como el listado y el formulario) */
function informePorVilla(informes){
  const p={};(informes||[]).forEach(i=>{const k=String(i.villaid);if(!p[k]||parseInt(i.informe_id,10)<parseInt(p[k].informe_id,10))p[k]=i;});
  return p;
}
/* Una fila por informe, sección y clave; gana el linea_id más alto (como lineasDesdeFilas del formulario) */
function lineasUnicas(lineas){
  const m={};
  (lineas||[]).forEach(l=>{if(!l)return;const k=parseInt(l.informe_id,10)+'|'+l.seccion+'|'+l.clave,p=m[k];if(p&&(parseInt(p.linea_id,10)||0)>=(parseInt(l.linea_id,10)||0))return;m[k]=l;});
  return Object.keys(m).map(k=>m[k]);
}
/* Regla única de las marcas (v2): cuentan solo la sección y la clave de uno de los 26 elementos de elementosDef() */
function esElemento(l){
  if(!esElemento.m){esElemento.m={};elementosDef().forEach(e=>{esElemento.m[e.seccion+'|'+e.clave]=1;});}
  return !!(l&&esElemento.m[l.seccion+'|'+l.clave]);
}
/* Villa manager: KeyHolder_person es un contacto (ContactID) o un usuario (UserID), como resContact de villa.html.
   v2: id con su origen (c:<ContactID> o u:<UserID>) para el filtro; el nombre solo se ve */
function vmDe(kh,contacts,users){
  const id=String(kh==null?'':kh).trim();if(!id)return{id:'',name:''};
  const c=(contacts||[]).find(x=>x.id===id);if(c)return{id:'c:'+id,name:c.name};
  const u=(users||[]).find(x=>x.id===id);return u?{id:'u:'+id,name:u.name}:{id:'',name:''};
}
function nombreVM(kh,contacts,users){return vmDe(kh,contacts,users).name;}
function abrirUrl(villaid,temporada){return 'informe-temporada.html?villaid='+encodeURIComponent(villaid)+'&temporada='+encodeURIComponent(temporada);}
function fechaVer(v){const m=String(v||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
/* Una fila por villa activa con su informe (el más bajo), su estado y las marcas M / R / A */
function construirCasas(villas,informes,lineas,contacts,users,temporada){
  const pv=informePorVilla(informes),lw=s=>String(s==null?'':s).trim().toLowerCase();
  const porInf={};
  (lineas||[]).forEach(l=>{const k=String(parseInt(l.informe_id,10));(porInf[k]=porInf[k]||[]).push(l);});
  return (villas||[]).map(v=>{
    const inf=pv[String(v.villaid)],id=inf?parseInt(inf.informe_id,10):null,ls=inf?(porInf[String(id)]||[]):[];
    const marca=e=>ls.filter(l=>esElemento(l)&&lw(l.estado)===e).length;
    const g=inf?lw(inf.estado_general):'',vm=vmDe(v.KeyHolder_person,contacts,users);
    return{villaid:v.villaid,villa:String(v.Name||('Villa '+v.villaid)),vm:vm.name,vmId:vm.id,informe_id:id,
      estado:inf?(lw(inf.estado)==='enviado'?'enviado':'borrador'):'',general:['bueno','regular','malo'].indexOf(g)>=0?g:'',
      fecha:inf?fechaVer(inf.fecha_revision):'',malo:marca('malo'),regular:marca('regular'),
      alta:ls.filter(l=>l.seccion==='resumen'&&String(l.texto_1||'').trim()&&lw(prioridadGuardar(l.prioridad))==='alta').length,url:abrirUrl(v.villaid,temporada)};
  });
}
/* Grupo de la tarjeta: estado general; sin él, el estado del informe (borrador); sin informe: 'sin' */
function estadoDe(f){return f.general||f.estado||'sin';}
/* Los cuatro cuadros. Solo cuentan las líneas de los informes de estas filas */
function tiles(filas,lineas){
  const lw=s=>String(s==null?'':s).trim().toLowerCase();
  const ids=new Set(filas.filter(f=>f.informe_id).map(f=>String(f.informe_id)));
  const ls=(lineas||[]).filter(l=>ids.has(String(parseInt(l.informe_id,10))));
  const acc=ls.filter(l=>l.seccion==='resumen'&&String(l.texto_1||'').trim()),alta=acc.filter(l=>lw(prioridadGuardar(l.prioridad))==='alta');
  const marcas=ls.filter(esElemento);
  return{entregados:filas.filter(f=>f.estado==='enviado').length,total:filas.length,
    borrador:filas.filter(f=>f.estado==='borrador').length,sin:filas.filter(f=>!f.informe_id).length,
    casasMalo:(n=>({n:n.length,nombres:n}))(ordenarCasas(filas).filter(f=>f.general==='malo').map(f=>f.villa)),
    accionesAlta:{n:alta.length,casas:new Set(alta.map(l=>String(parseInt(l.informe_id,10)))).size,total:acc.length},
    marcasMalo:{n:marcas.filter(l=>lw(l.estado)==='malo').length,comprobaciones:ids.size*elementosDef().length,regular:marcas.filter(l=>lw(l.estado)==='regular').length}};
}
function textoNombres(n,max){return n.slice(0,max).join(', ')+(n.length>max?' +'+(n.length-max):'');}
/* Peor primero: Malo, Regular, Bueno, Borrador sin estado general, Sin informe; dentro, marcas Malo de más a menos y nombre */
function ordenarCasas(filas){
  const rango={malo:0,regular:1,bueno:2,borrador:3,enviado:3,sin:4};
  return filas.slice().sort((a,b)=>(rango[estadoDe(a)]-rango[estadoDe(b)])||((b.malo||0)-(a.malo||0))||a.villa.localeCompare(b.villa,'es',{sensitivity:'base'}));
}
/* Nº de casas con cada elemento en Malo y en Regular (una casa cuenta una vez por elemento) */
function mapaProblemas(lineas,filas){
  const out={},visto={},lw=s=>String(s==null?'':s).trim().toLowerCase();
  elementosDef().forEach(e=>{out[e.clave]={malo:0,regular:0};});
  const ids=new Set(filas.filter(f=>f.informe_id).map(f=>String(f.informe_id)));
  (lineas||[]).forEach(l=>{
    const id=String(parseInt(l.informe_id,10)),e=lw(l.estado),k=id+'|'+l.clave+'|'+e;
    if(!ids.has(id)||!esElemento(l)||(e!=='malo'&&e!=='regular')||visto[k])return;
    visto[k]=1;out[l.clave][e]++;
  });
  return out;
}
/* Color del nº de casas en Malo: 0 h0, 1 h1, 2-3 h2, 4-6 h3, 7+ h4 */
function claseCalor(n){return n<=0?'h0':n<=1?'h1':n<=3?'h2':n<=6?'h3':'h4';}
/* Palabras de prioridad: se ve Alto/Medio/Bajo, se guarda Alta/Media/Baja (copia del formulario) */
function prioridadVer(v){const s=String(v==null?'':v).trim(),m={alta:'Alto',media:'Medio',baja:'Bajo'};return m[s.toLowerCase()]||s;}
function prioridadGuardar(t){const s=String(t==null?'':t).trim(),m={alto:'Alta',medio:'Media',bajo:'Baja'};return m[s.toLowerCase()]||s;}
/* Obras pendientes: cada línea de 'resumen' con la actuación escrita; Alta, Media, Baja, sin prioridad; luego casa y orden.
   v2: Alto/Medio/Bajo guardados cuentan como Alta/Media/Baja; las de un borrador se quedan y llevan informe 'Borrador' */
function obras(lineas,filas){
  const lw=s=>String(s==null?'':s).trim().toLowerCase(),porId={},rango={alta:0,media:1,baja:2};
  filas.forEach(f=>{if(f.informe_id)porId[String(f.informe_id)]=f;});
  const may=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
  return (lineas||[]).filter(l=>l.seccion==='resumen'&&String(l.texto_1||'').trim()&&porId[String(parseInt(l.informe_id,10))]).map(l=>{
    const f=porId[String(parseInt(l.informe_id,10))],p=lw(prioridadGuardar(l.prioridad)),ver=prioridadVer(p);
    return{villa:f.villa,vm:f.vm,accion:String(l.texto_1).trim(),motivo:String(l.texto_2||'').trim(),prioridad:rango[p]!==undefined?ver:'',
      clase:rango[p]!==undefined?lw(ver):'',rango:rango[p]!==undefined?rango[p]:3,orden:parseInt(l.orden,10)||0,general:may(f.general),fecha:f.fecha,url:f.url,informe:f.estado==='borrador'?'Borrador':'Enviado'};
  }).sort((a,b)=>(a.rango-b.rango)||a.villa.localeCompare(b.villa,'es',{sensitivity:'base'})||(a.orden-b.orden));
}
/* Filtro de villa manager por su id (c:<ContactID> o u:<UserID>): sus casas y las líneas de sus informes; '' = todas */
function filtrarPorVM(filas,lineas,vm){
  if(!vm)return{filas:filas,lineas:lineas};
  const f=filas.filter(x=>x.vmId===vm),ids=new Set(f.filter(x=>x.informe_id).map(x=>String(x.informe_id)));
  return{filas:f,lineas:(lineas||[]).filter(l=>ids.has(String(parseInt(l.informe_id,10))))};
}
/* Chips de villa manager: [id, etiqueta] por nombre; dos ids con el mismo nombre son dos chips ("Kike", "Kike (2)") */
function vmsDe(filas){
  const m={},n={};filas.forEach(f=>{if(f.vmId&&f.vm)m[f.vmId]=f.vm;});
  return Object.keys(m).sort((a,b)=>m[a].localeCompare(m[b],'es',{sensitivity:'base'})||(a<b?-1:a>b?1:0)).map(id=>{
    const k=m[id].trim().toLowerCase();n[k]=(n[k]||0)+1;return[id,m[id]+(n[k]>1?' ('+n[k]+')':'')];});
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* Igual que informe-reservas.html: texto que empieza por = + - @ lleva apostrofo para que Excel no lo ejecute */
function csvCell(v){
  var s = String(v == null ? '' : v);
  if (/^[=@\t\r]/.test(s) || /^[+\-](?![\d\s().\-]+$)/.test(s)) s = "'" + s;
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* CSV de obras para Excel en español: BOM UTF-8 y ';' (como el listado) */
function csvObras(rows){
  const lines=[['Casa','Villa manager','Actuación','Motivo / impacto','Prioridad','Estado general de la casa','Fecha de revisión','Informe'].map(csvCell).join(';')];
  rows.forEach(r=>lines.push([r.villa,r.vm,r.accion,r.motivo,r.prioridad,r.general,r.fecha,r.informe].map(csvCell).join(';')));
  return '﻿'+lines.join('\r\n')+'\r\n';
}
function puedeVerCuadro(role){const r=String(role||'').trim().toLowerCase();return r==='admin'||r==='manager';}

/* ── Pagina v3 (29/10/2026): tres niveles en una sola página; el estado vive en el hash (Rutas, cuadro-informes-temporada-rutas.js).
   Nivel 1 = Portada (cuadros, Listas, tabla por villa manager, casas, mapa) + las obras de abajo; nivel 2 = Listas.listas + Vistas.listaHtml;
   nivel 3 = Vistas.casaHtml con Extras (comparación con la temporada anterior, fotos). Las lecturas son las de la v2 (más secciones de líneas);
   la temporada anterior se lee solo cuando una vista la usa, una vez por año (Extras.cargarTemporadaPrevia con leerTemporada). ── */
const g=id=>document.getElementById(id);
const TROZO=15,LIMITE=1000,LIMITE_INFORMES=500,MAX_OBRAS=10;
let VILLAS=[],USERS=[],CONTACTS=[],INFORMES=[],LINEAS=[],FILAS=[];
const TEMPORADAS=temporadasDe(new Date().getFullYear());
/* CARGANDO: una temporada se está leyendo; pintar, CSV, "más" e imprimir no hacen nada. BASE: la lectura de villas, usuarios y contactos */
let TEMP=new Date().getFullYear(),VM='',MAS=false,PETICION=0,CARGANDO=false,BASE=null;
/* PREVIA[temporada mirada] = {estado:'leyendo'|'ok'|'error', casas}; ULT = el hash de la última vista pintada */
const PREVIA={};
let ULT=null;
/* Los seis scripts del cuadro v3 (se cargan en <head> con ?v=3) */
const SCRIPTS_V3=['InformeScore','Rutas','Listas','Portada','Vistas','Extras'];
const FORMULA='Condición = 100 × (2 × Bueno + Regular) ÷ (2 × elementos evaluados), con un decimal; provisional hasta marcar los 26; bandas: rojo &lt; 50, ámbar &lt; 80, verde ≥ 80, gris sin puntuación · puntuación v1 (consenso del 29/10/2026).';
/* Semilla para pruebas y capturas: si una prueba pone window.__FIXTURE__ (forma {temporada, villas, contacts:[{id,name}], users:[{id,name}], informes, lineas,
   previa:{temporada, informes, lineas}, vacia:{...}}, la de cuadro-informes-temporada-fixtures.js), se lee de ahí. Sin ella, el Worker. */
function semilla(){return (typeof window!=='undefined'&&window.__FIXTURE__)||null;}
async function leerJson(u){const r=await fetch(Auth.url(u));if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return j.Result||j.result||[];}
/* Un trozo de ids; si llega al límite (informes de otra temporada dentro del rango) se parte en dos y se lee otra vez.
   v2: un trozo de un solo informe que llega al límite sería una lectura cortada: error (línea roja y reintentar) */
async function leerTrozo(ids){
  const rows=await leerJson(WORKER+'?action=data&table=TaInformeTemporadaLineas&where='+encodeURIComponent(whereLineasRango(ids))+'&limit='+LIMITE);
  if(rows.length<LIMITE)return rows;
  if(ids.length<2)throw new Error('El informe '+ids[0]+' llega a '+LIMITE+' líneas: la lectura saldría cortada');
  const m=Math.ceil(ids.length/2),r=await Promise.all([leerTrozo(ids.slice(0,m)),leerTrozo(ids.slice(m))]);
  return r[0].concat(r[1]);
}
/* Informes de la temporada y después todas sus líneas, por trozos de 15 informes; se guardan solo las de ese conjunto */
async function leerTemporada(t){
  const fx=semilla();
  if(fx){const y=parseInt(t,10),d=[fx,fx.previa,fx.vacia].filter(x=>x&&parseInt(x.temporada,10)===y)[0];return{informes:d?d.informes.slice():[],lineas:d?lineasUnicas(d.lineas):[]};}
  const informes=await leerJson(WORKER+'?action=data&table=TaInformeTemporada&where='+encodeURIComponent('temporada='+parseInt(t,10))+'&limit='+LIMITE_INFORMES);
  if(informes.length>=LIMITE_INFORMES)throw new Error('La temporada llega a '+LIMITE_INFORMES+' informes: la lectura saldría cortada');
  const ids=informes.map(i=>parseInt(i.informe_id,10)).filter(x=>x>0);
  if(!ids.length)return{informes:informes,lineas:[]};
  const set=new Set(ids.map(String));
  const trozos=await Promise.all(trozosIds(ids,TROZO).map(leerTrozo));
  return{informes:informes,lineas:lineasUnicas([].concat.apply([],trozos).filter(l=>set.has(String(parseInt(l.informe_id,10)))))};
}
/* Contador de peticiones: si llega tarde la respuesta de una temporada tocada antes, se ignora */
async function cargarInformes(t){
  const n=++PETICION;

  INFORMES=r.informes;LINEAS=r.lineas;
  return true;
}
/* Villas, usuarios y contactos; la temporada la lee después cambiarTemporada (v2: el contador de peticiones guarda los dos caminos) */

    leerJson(WORKER+'?action=data&table=TaContacts&limit=500')
  ]);
  VILLAS=v;
  USERS=u.map(x=>({id:String(x.UserID||''),name:x.Name||x.UserID||''})).filter(x=>x.id);
  CONTACTS=c.map(x=>({id:String(x.ContactID||x.contactid||x.Id||x.id||''),name:x.Name||x.Nombre||x.Full_Name||x.FullName||''})).filter(x=>x.id&&x.name);

function pintarCargando(){g('cuerpo').innerHTML='<div class="msg">Cargando la temporada '+TEMP+'…</div>';g('printHead').innerHTML='';}

/* ── Temporada anterior: se lee la primera vez que una vista la usa (casa enviada, repetido, comparación); un fallo se puede reintentar ── */
function previaCasas(){const p=PREVIA[TEMP];return p&&p.estado==='ok'?p.casas:null;}
function leerPrevia(t){
  PREVIA[t]={estado:'leyendo'};
  Extras.cargarTemporadaPrevia(t,leerTemporada)
    .then(d=>{PREVIA[t]={estado:'ok',casas:Portada.construirCasasV3(VILLAS,d.informes,d.lineas,CONTACTS,USERS,t-1)};},e=>{console.error(e);PREVIA[t]={estado:'error'};})
    .then(()=>{if(t===TEMP&&!CARGANDO)pintar();});
}
/* true = la vista espera la temporada anterior (pinta "Cargando…" y la pide una vez) */
function esperaPrevia(){
  const p=PREVIA[TEMP];
  if(p&&p.estado!=='leyendo')return false;
  if(!p)leerPrevia(TEMP);
  g('cuerpo').innerHTML='<div class="msg">Cargando la temporada '+(TEMP-1)+' para comparar…</div>';
  return true;
}
function avisoPrevia(){const p=PREVIA[TEMP];return p&&p.estado==='error'?'<div class="aviso-linea m no-print">No se pudo leer la temporada '+(TEMP-1)+': la comparación no está disponible. <button type="button" class="btn" onclick="reintentarPrevia()">Reintentar</button></div><div style="height:10px"></div>':'';}
function reintentarPrevia(){delete PREVIA[TEMP];pintar();}

/* ── Las tres vistas ── */
function pintar(){
  if(CARGANDO)return;
  const falta=faltanScripts();
  if(falta.length){g('main').innerHTML='<div class="msg err">Faltan archivos del cuadro ('+esc(falta.join(', '))+'): recarga la página</div>';return;}
  FILAS=Portada.construirCasasV3(VILLAS,INFORMES,LINEAS,CONTACTS,USERS,TEMP);
  pintarFiltros();
  const r=ruta(),casas=Portada.filtrarVM(FILAS,VM);
  ULT=location.hash||'';
  let titulo='Cuadro',casa=null;
  if(/^casa:/.test(r.v)){casa=FILAS.filter(c=>String(c.villaid)===r.v.slice(5))[0]||null;titulo=casa?casa.villa:'Casa';pintarCasa(r,casas,casa);}
  else if(/^lista:/.test(r.v))titulo=pintarLista(r,casas);
  else pintarCuadro(r,casas);
  g('printHead').innerHTML=Extras.printHeader(r,{vmNombre:nombreVMActual(),titulo:titulo,casa:casa});
  document.title=(titulo==='Cuadro'?'':titulo+' · ')+'Cuadro de informes de temporada v3 — 3Villas';
}
/* Nivel 1: cada cifra es un enlace a su lista (Portada); las obras con sus filtros en el hash */
function pintarCuadro(r,casas){
  const prev=previaCasas();
  g('cuerpo').innerHTML='<div id="tiles"></div><div id="rapidas"></div><div id="vmt"></div><div id="casas"></div><div id="mapa"></div>'
    +'<div class="card" id="cardObras"><h3>Obras pendientes <small>· resumen + incidencias por estancia, sin duplicados · solo informes enviados</small></h3><div id="obras"></div></div>';
  g('tiles').innerHTML=Portada.tilesHtml(Portada.tilesV3(casas,prev),r)+'<p class="small-print formula">'+FORMULA+'</p>';
  g('rapidas').innerHTML=Portada.listasRapidasHtml(Portada.listasRapidas(casas,prev),r);
  g('vmt').innerHTML=Portada.tablaVMHtml(Portada.tablaVM(casas,r.s),r);
  g('casas').innerHTML=Portada.tarjetasHtml(Portada.tarjetas(casas),r);
  g('mapa').innerHTML=Portada.mapaHtml(Portada.mapaV3(casas),r);
  g('obras').innerHTML=obrasNivel1Html(r,casas);
}
/* Nivel 2: v=lista:<tipo>[:...]; la búsqueda, el orden y el grupo los aplica Vistas (las filas visibles = las del CSV) */
/* Ronda de arreglos 2: g agrupa por casa como el nivel 1 (Listas: orden por nombre), así anterior / siguiente siguen el orden de la pantalla */
function listaDe(v,casas,gr){const p=String(v).slice(6).split(':');return Listas.listas(p[0],{partes:p.slice(1),t:String(TEMP),g:gr||''},casas,previaCasas());}
function pintarLista(r,casas){
  if(/^lista:(repetido|comparacion)(:|$)/.test(r.v)&&esperaPrevia())return 'Cargando…';
  const L=listaDe(r.v,casas,r.g);
  g('cuerpo').innerHTML=avisoPrevia()+Vistas.listaHtml(L,r,{vmNombre:nombreVMActual()});
  return L.titulo||'Lista';
}
/* Nivel 3: la casa (todas las casas de la temporada, también fuera del filtro); anterior / siguiente por la lista de origen o las tarjetas */
function pintarCasa(r,casas,casa){
  if(casa&&casa.estado==='enviado'&&esperaPrevia())return;
  const prev=previaCasas(),casaPrev=casa?Extras.casaPreviaDe(casa,prev):null;
  const lista=r.from?listaDe(r.from,casas,r.g):Portada.tarjetas(casas);
  g('cuerpo').innerHTML=avisoPrevia()+Vistas.casaHtml(casa,casaPrev,r,lista);
}

/* ── Obras del nivel 1 (maqueta): filtros op/of/od/oq/og en el hash; filas de Listas.listas('obras') (solo informes enviados);
   diez filas y "… n actuaciones más"; el CSV lleva todas las filas filtradas ── */
function listaObras(r,casas){return Listas.listas('obras',{partes:r.op?[r.op]:[],fuente:r.of,sindetalle:r.od,q:r.oq,g:r.og,t:String(TEMP)},casas,null);}
/* Ronda de arreglos 1: la casa abierta desde una obra lleva la misma lista filtrada (anterior / siguiente y «‹ Lista»): lista:obras:<op|todas>[:of][:sindetalle] */
function fromObras(r){return 'lista:obras:'+(r.op||'todas')+(r.of?':'+r.of:'')+(r.od?':sindetalle':'');}
function celdaObra(f,c){
  const v=f[c.clave];
  if(c.clave==='villa')return esc(v);
  if(c.clave==='prioridad')return v?'<span class="pri '+({Alto:'alto',Medio:'medio',Bajo:'bajo'}[v]||'')+'">'+esc(v)+'</span>':'<span class="pri sin">sin prioridad</span>';
  if(c.clave==='coste')return '—';
  if(c.clave==='detalle')return v?'<span class="falta">⚠ '+esc(v)+'</span>':'';
  if(c.clave==='origen')return esc(v||'—')+(f.unidas?'<div class="mot">unidas: mismo texto</div>':'');
  return v==null||v===''?'—':esc(v);
}
function obrasNivel1Html(r,casas){
  const L=listaObras(r,casas),filas=L.filas,total=Listas.listas('obras',{partes:[]},casas,null).filas.length,keep=['s','op','of','od','oq','og'];
  const ch=(k,val,txt)=>{const on=(r[k]||'')===val;return '<a class="chip'+(on?' on':'')+'" href="'+esc(Rutas.href(r,{[k]:val},keep))+'" aria-pressed="'+on+'">'+txt+'</a>';};
  const tog=(k,txt)=>'<a class="chip'+(r[k]?' on':'')+'" href="'+esc(Rutas.href(r,{[k]:r[k]?'':'1'},keep))+'" aria-pressed="'+!!r[k]+'">'+(r[k]?'✓ ':'')+txt+'</a>';
  const h='<div class="herr no-print"><div class="grupo"><span>Prioridad</span>'+ch('op','','Todas')+ch('op','alta','Alto')+ch('op','media','Medio')+ch('op','baja','Bajo')+ch('op','sin','Sin prioridad')+'</div>'
    +'<div class="grupo"><span>Origen</span>'+ch('of','','Todos')+ch('of','resumen','Resumen')+ch('of','estancia','Estancia')+'</div><div class="grupo">'+tog('od','Sin detalle')+'</div></div>'
    +'<div class="herr no-print"><input type="search" id="oq" placeholder="Buscar actuación, casa, motivo…" value="'+esc(r.oq)+'" oninput="teclearObras(this.value)" aria-label="Buscar obras">'
    +tog('og','Agrupar por casa')+'<span class="cuenta">'+filas.length+' de '+total+' actuaciones</span><button type="button" class="btn" onclick="descargarCsv()">⬇️ CSV obras</button></div>'
    +(L.enBorradores?'<p class="small-print">'+L.enBorradores+' más en borradores (no cuentan)</p>':'');
  if(!filas.length)return h+'<div class="vacio-box"><b>Lista vacía</b>'+(total?'Ningún resultado con estos filtros. Quita un filtro o borra la búsqueda.':'Ninguna actuación todavía en los informes enviados.')+'</div>';
  const cols=L.columnas,n=cols.length+1;let ult=null,i=0;
  const cuerpo=filas.map(f=>{
    const extra=i>=MAX_OBRAS&&!MAS?' extra':'';i++;
    let gr='';
    if(r.og&&f.villa!==ult){ult=f.villa;gr='<tr class="grp'+extra+'"><td colspan="'+n+'">'+esc(f.villa)+' · '+filas.filter(x=>x.villa===ult).length+' actuaciones</td></tr>';}
    const dest=Rutas.href(r,{v:'casa:'+f.villaid,from:fromObras(r),q:r.oq,g:r.og,vs:r.s},Rutas.CLAVES_OBRAS);   /* ronda de arreglos 2: g = og y los filtros de obras viajan con la casa */
    return gr+'<tr class="obra'+extra+'" data-href="'+esc(dest)+'">'+cols.map(c=>'<td data-l="'+esc(c.label)+'"'+(c.clave==='villa'?' class="casa-n"':'')+'>'+celdaObra(f,c)+'</td>').join('')
      +'<td class="abr" data-l=""><a class="abrir" href="'+esc(dest)+'">Abrir ›</a></td></tr>';
  }).join('');
  const resto=filas.length-MAX_OBRAS;
  return h+'<table class="stack obras-n1"><thead><tr>'+cols.map(c=>'<th'+(c.num?' class="num"':'')+'>'+esc(c.label)+'</th>').join('')+'<th class="abr"></th></tr></thead><tbody>'+cuerpo
    +(resto>0&&!MAS?'<tr class="mas"><td colspan="'+n+'"><button type="button" class="mas-btn" onclick="verMas()">… '+resto+' actuaciones más</button></td></tr>':'')+'</tbody></table>'
    +(L.nota?'<p class="small-print">'+esc(L.nota)+'</p>':'');
}
function teclearObras(val){
  const h=Rutas.href(ruta(),{oq:val},true);
  if(window.history&&history.replaceState)history.replaceState(null,'',h);else location.hash=h;
  pintar();
  const el=g('oq');if(el&&el.focus){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}
}

function elegirVM(vm){VM=vm||'';MAS=false;irA(ruta());pintar();}
function verMas(){if(CARGANDO)return;MAS=true;pintar();}
/* n: la petición que falla; si ya hay otra más nueva, el fallo llega tarde y no cuenta */
function error(n){if(n!==undefined&&n!==PETICION)return;g('main').innerHTML='<div class="msg err">No se pudieron leer los informes <button class="btn" onclick="iniciar()">Reintentar</button></div>';}
/* CSV de las obras del nivel 1 con sus filtros (todas las filas filtradas, no solo las diez a la vista) */
function descargarCsv(){
  if(CARGANDO)return;
  const blob=new Blob([Listas.csv(listaObras(ruta(),Portada.filtrarVM(FILAS,VM)))],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='obras-temporada-'+TEMP+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function imprimir(){if(CARGANDO)return;window.print();}
/* Cambiar de temporada lee otra vez informes y líneas, nunca las villas. Mientras lee, CARGANDO; pinta solo la petición más nueva y con las villas ya leídas */
async function cambiarTemporada(t){
  TEMP=parseInt(t,10);MAS=false;CARGANDO=true;
  irA(ruta());
  if(!/id="cuerpo"/.test(g('main').innerHTML))esqueleto();
  pintarFiltros();pintarCargando();
  const n=PETICION+1;
  try{
    const r=await Promise.all([cargarInformes(TEMP),BASE]);
    if(r[0]&&n===PETICION){CARGANDO=false;pintar();}
  }
  catch(e){console.error(e);error(n);}
}
/* El hash cambió (enlace, Atrás, flechas): guarda la posición de la vista anterior, pinta y vuelve a la posición guardada de la nueva */
function alCambiarHash(){
  const h=location.hash||'';
  if(h===ULT||faltanScripts().length)return;
  const antes=ULT,vAntes=antes===null?'':Rutas.parse(antes).v;
  if(antes!==null)Rutas.scrollRecordar(antes,window.scrollY||0);
  const r=Rutas.parse(h,{t:String(TEMP)}),t=parseInt(r.t,10);
  VM=r.vm;MAS=false;
  if(t!==TEMP){cambiarTemporada(t);return;}
  pintar();
  const y=Rutas.scrollVolver(h);
  if(typeof window.scrollTo==='function')window.scrollTo(0,y!=null?y:(r.v!==vAntes?0:(window.scrollY||0)));
}
/* Primero villas, usuarios y contactos; después la temporada por cambiarTemporada (si no se tocó otra mientras tanto) */
async function iniciar(){
  if(!puedeVerCuadro(Auth.role())){g('main').innerHTML='<div class="msg err">Sin acceso</div>';return;}
  const falta=faltanScripts();
  if(falta.length){g('main').innerHTML='<div class="msg err">Faltan archivos del cuadro ('+esc(falta.join(', '))+'): recarga la página</div>';return;}
  const r0=Rutas.parse(location.hash||'',{t:String(TEMP)});TEMP=parseInt(r0.t,10)||TEMP;VM=r0.vm;
  CARGANDO=true;esqueleto();pintarFiltros();pintarCargando();
  const p0=PETICION;
  BASE=cargarBase();
  try{await BASE;}
  catch(e){console.error(e);error();return;}
  if(PETICION===p0)await cambiarTemporada(TEMP);
}
/* Flechas ← → en la casa (nunca dentro de un campo ni con la foto abierta: Extras.overlayAbierto) y clic en una fila o un cuadro con data-href */
document.addEventListener('keydown',e=>{
  if(CARGANDO||faltanScripts().length||!/^casa:/.test(ruta().v))return;
  const h=Rutas.teclas(e,Vistas.navActual,Extras.overlayAbierto());
  if(h){if(e.preventDefault)e.preventDefault();location.hash=h;}
});
document.addEventListener('click',e=>{
  const t=e&&e.target;if(!t||typeof t.closest!=='function'||t.closest('a,button,input'))return;
  const d=t.closest('[data-href]');if(d)location.hash=d.getAttribute('data-href');
});
window.addEventListener('hashchange',alCambiarHash);
document.addEventListener('DOMContentLoaded',iniciar);
</script>
</body>
