<html lang="es">

<style>
:root{
  --red:#C8102E;--red-dark:#9e0c24;--red-light:#fce8eb;
  --green:#1e9e4e;--green-light:#e6f7ee;
  --orange:#e07b00;--orange-light:#fff4e0;
  --gray-1:#f4f5f7;--gray-2:#e8eaed;--gray-3:#c4c9d4;--gray-4:#7a8194;--gray-5:#2d3142;
  --hdr:48px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Open Sans',sans-serif;background:var(--gray-1);color:var(--gray-5);min-height:100vh;padding-bottom:84px}

/* ── NAV (igual que villa.html) ── */
.top-nav{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1.5px solid var(--gray-2);box-shadow:0 2px 8px rgba(0,0,0,.07);position:sticky;top:0;z-index:300}
.nav-logo img{height:24px;object-fit:contain}
.nav-center{flex:1;min-width:0;padding:0 4px}
.h-title{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:var(--gray-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-meta{font-size:10px;color:var(--gray-4);margin-top:1px}
.nav-close-btn{display:flex;align-items:center;justify-content:center;background:rgba(200,16,46,.1);border:1.5px solid rgba(200,16,46,.2);color:var(--red);width:30px;height:30px;border-radius:50%;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0}
.nav-menu-btn{display:flex;align-items:center;justify-content:center;background:var(--red);border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer;flex-shrink:0}

/* ── v3: la hoja de Rafa (informe-ejemplo-rafa.pdf). La misma maqueta en escritorio, en el móvil y en papel ── */
main{max-width:860px;margin:0 auto;padding:16px 12px}
.hoja{background:#fff;max-width:820px;margin:0 auto;padding:36px 48px 44px;box-shadow:0 1px 6px rgba(0,0,0,.12);font-family:Arial,Helvetica,sans-serif;color:#222;font-size:13px;line-height:1.3}
.h-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--red)}
.h-logo{height:44px;width:129px;object-fit:cover;display:block} /* el PNG trae márgenes transparentes: cover los recorta y el logo dibujado ocupa los 44 px */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;margin-bottom:4px}
.pill.borrador{background:var(--orange-light);color:var(--orange)}
.pill.enviado{background:var(--green-light);color:var(--green)}
.h-tit{font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:700;color:var(--red);text-align:center;margin:26px 0 8px;line-height:1.2}
.h-sub{text-align:center;color:#808080;font-size:15px;margin-bottom:22px}
.aviso{margin:-8px 0 14px;padding:8px 10px;border-radius:6px;background:var(--orange-light);color:#8a4b00;font-size:12px;font-weight:600}
.aviso:empty{display:none}
.s-tit{font-size:17px;font-weight:700;color:#222;margin:24px 0 10px;line-height:1.25}
.s-ayuda{color:#555;font-size:13px;text-align:justify;margin:-2px 0 12px;line-height:1.4}
.t{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:12px}
.t th,.t td{border:1px solid #cfcfcf;padding:5px 8px;text-align:left;vertical-align:middle;font-size:13px;word-wrap:break-word}
.t th{background:#f2f2f2;font-weight:700;color:#222}
.t td{background:#fff;position:relative}
.t-cab th{width:28%}
.t-cab td{color:#777}
.t-gen{margin-bottom:22px}
.t-gen th{width:29%;height:30px}
.t-gen td{padding:2px 6px}
.c-n{width:37px;text-align:center!important}
.c-pri{width:100px;text-align:center!important}
.c-el{width:29%}
.c-st{width:62px;text-align:center!important;padding:0!important}
.c-e{width:20.5%}
.c-tema{width:22.5%}
.c-ori{width:29%}
.t-est tbody tr{height:34px}
.c-st .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border:none;background:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#555;cursor:pointer;padding:0}
.st.on{background:var(--red-light);color:#000}
.st:disabled{cursor:default}
.chk{border:none;background:none;font:inherit;font-size:13px;color:#222;padding:5px 8px;margin-right:4px;cursor:pointer;border-radius:4px}
.chk .cx{display:inline-block;min-width:.9em;text-align:center;color:#555}
.chk.on .cx{color:#000}
.in{display:block;width:100%;border:none;background:transparent;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.35;color:#222;padding:2px 0;margin:0;resize:none;overflow:hidden;border-radius:0}
textarea.in{min-height:20px}
.in:focus,.sel:focus,.st:focus-visible,.chk:focus-visible{outline:2px solid rgba(200,16,46,.35);outline-offset:1px}
.in:disabled,.sel:disabled{color:#222;-webkit-text-fill-color:#222;opacity:1}
.t-cab .in{color:#777;-webkit-text-fill-color:#777}
.ta-p{display:none}
.sel{-webkit-appearance:none;appearance:none;border:none;background:transparent;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#222;width:100%;text-align:center;text-align-last:center;cursor:pointer;padding:2px 0;margin:0}
.sel.vacio{color:#999;-webkit-text-fill-color:#999}
.sel option{color:#222}
.c-ori .sel{text-align:left;text-align-last:left}
.libre{color:#555}
.anadir{display:inline-block;border:none;background:none;color:#888;font-family:Arial,Helvetica,sans-serif;font-size:12px;padding:2px 0 4px;margin:-6px 0 8px;cursor:pointer;text-decoration:underline}
.anadir:hover{color:var(--red)}
.dot{position:absolute;left:2px;top:3px;width:6px;height:6px;border-radius:50%;background:transparent;pointer-events:none}
.dot.sucio{background:var(--orange)}

/* ── v5: N/A, ⚠ Peligro, coste y «Se refiere a». Los controles los pinta la fila; las líneas .h-v5 (hojaV5) son su copia en papel ── */
.st[data-v="N/A"]{color:#999}
.st[data-v="N/A"].on{background:var(--gray-2);color:#000}
.v5-peligro,[data-campo="peligro"]{color:#999;font-size:11px;cursor:pointer}
input[type="checkbox"][data-campo="peligro"]{width:14px;height:14px;accent-color:var(--red);vertical-align:middle}
.sel[data-campo="coste"],.sel[data-campo="clave_ref"]{text-align:left;text-align-last:left}
.h-v5{display:none}
.h-na,.h-peligro,.h-coste,.h-ref{font-size:12px;line-height:1.3;margin-top:3px;color:#444;white-space:pre-wrap;word-wrap:break-word}
.h-na{color:#777}
.h-peligro{color:var(--red);font-weight:700}

/* ── Fotos (como la página 4 del PDF: a lo ancho de la hoja, pie debajo) ── */
.fotos{margin-top:26px}
.foto{position:relative;margin-bottom:26px}
.f-img{display:flex;align-items:center;justify-content:center;min-height:40px}
.f-img img{display:block;width:100%;max-height:60vh;object-fit:contain}
.foto.vacia .f-img{flex-direction:column;min-height:110px;border:1.5px dashed #cfcfcf;border-radius:6px;color:#999;font-size:14px}
.pie{margin-top:8px;color:#555}
.f-ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.f-pick{display:inline-block;padding:6px 12px;border-radius:6px;background:var(--red);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11px;cursor:pointer}
.f-pick.gal{background:var(--gray-5)}
.f-pick input{display:none}
.f-quitar{padding:6px 12px;border:1.5px solid var(--gray-3);border-radius:6px;background:#fff;color:var(--gray-4);font-family:'Montserrat',sans-serif;font-weight:800;font-size:11px;cursor:pointer}
.spin{width:28px;height:28px;border:3px solid var(--gray-3);border-top-color:var(--red);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ── Móvil: la misma hoja y las mismas tablas; la columna de texto larga baja a una segunda línea ── */
@media (max-width:699px){
  main{padding:8px 0}
  .hoja{padding:16px 10px 26px;box-shadow:none}
  .hoja,.t th,.t td,.chk,.s-ayuda{font-size:14px}
  .in,.sel,.in.fecha{font-size:16px}
  .h-logo{height:36px;width:106px}
  .h-tit{font-size:22px;margin-top:18px}
  .h-sub{font-size:14px;margin-bottom:16px}
  .s-tit{font-size:17px;margin:20px 0 8px}
  .t,.t thead,.t tbody{display:block;width:100%}
  .t{border-top:1px solid #cfcfcf;border-left:1px solid #cfcfcf}
  .t tr{display:grid;width:100%}
  .t th,.t td{display:block;width:auto!important;min-width:0;border:0;border-right:1px solid #cfcfcf;border-bottom:1px solid #cfcfcf}
  .t td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:#999;margin-bottom:2px}
  .t-cab tr{grid-template-columns:40% minmax(0,1fr)}
  .t-gen tr{grid-template-columns:minmax(0,1fr)}
  .t-gen td{display:flex;flex-wrap:wrap;padding:2px 4px}
  .chk{min-height:44px;flex:1 1 0;padding:4px 6px}
  .t-est tr{grid-template-columns:minmax(0,1fr) 44px 44px 44px 44px} /* v5: Bueno, Regular, Malo y N/A */
  .t-est tbody tr{height:auto}
  .t-est .c-obs{grid-column:1/-1}
  .t th.c-obs-h{display:none}
  .c-st{display:flex!important;align-items:stretch;min-height:44px}
  .c-st .st{font-size:17px}
  .t-est th.c-st{align-items:center;justify-content:center;font-size:10px;padding:0 1px!important;overflow:hidden}
  .t-acc tr{grid-template-columns:44px minmax(0,1fr)}
  .t-acc .c-n{grid-row:1;grid-column:1}
  .t-acc .c-pri{grid-row:1;grid-column:2;text-align:right!important}
  .t-acc .c-pri .sel{text-align:right;text-align-last:right}
  .t-acc .c-txt{grid-column:1/-1}
  .t-inc tr{grid-template-columns:minmax(0,1fr) 110px}
  .t-inc .c-e{grid-row:1;grid-column:1}
  .t-inc .c-pri{grid-row:1;grid-column:2}
  .t-inc .c-txt{grid-column:1/-1}
  .t-hue tr{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .t-hue .c-txt{grid-column:1/-1}
  .t th.c-txt-h{display:none}
  .sel{min-height:32px}
  .anadir{font-size:13px;padding:8px 0}
  .f-pick,.f-quitar{padding:10px 14px;font-size:12px}
  /* v5: la marca de peligro sigue pequeña y gris, pero con 44 px de alto para el dedo */
  label[data-campo="peligro"],.v5-peligro{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:12px}
  input[type="checkbox"][data-campo="peligro"]{width:20px;height:20px}
}

/* ── Barra inferior ── */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:400;background:#fff;border-top:1.5px solid var(--gray-2);box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:8px 10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.barra button{flex:1 1 0;max-width:200px;min-width:0;height:42px;border:none;border-radius:10px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;padding:0 6px}
.b-guardar{background:var(--gray-5);color:#fff}.b-enviar{background:var(--red);color:#fff}
.b-reabrir{background:var(--orange);color:#fff}.b-imprimir{background:var(--gray-2);color:var(--gray-5)}
.barra[hidden]{display:none}
.barra [hidden]{display:none}
.estado-guardado{flex-basis:100%;text-align:center;font-size:11px;color:var(--gray-4);font-weight:600}
.estado-guardado.sucio{color:var(--orange)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d3142;color:#fff;padding:12px 22px;border-radius:30px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:999;max-width:90vw;text-align:center;line-height:1.35}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.msg{background:#fff;border-radius:12px;padding:30px 16px;text-align:center;font-weight:700;margin-top:20px}
.msg.err{color:var(--red)}

/* ── Impresión: la misma maqueta de la pantalla (v3: sin vista aparte) ── */
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top-nav,.barra,.toast,.pill,.aviso,.anadir,.f-ctl,.foto.vacia,.dot,#nav-sidebar,#nav-overlay,.nav-hamburger{display:none!important}
  body>*:not(main){display:none!important}
  main{max-width:none;margin:0;padding:0}
  .hoja{max-width:none;margin:0;padding:0;box-shadow:none}
  .h-tit{margin-top:22px}
  tr{break-inside:avoid;page-break-inside:avoid}
  .s-tit{break-after:avoid;page-break-after:avoid}
  .s-ayuda{break-after:avoid;page-break-after:avoid}
  textarea{display:none!important}
  .ta-p{display:block;white-space:pre-wrap;word-wrap:break-word;font-size:13px;line-height:1.35;min-height:1em}
  .libre+.ta-p{color:#555}
  .st.on,.chk.on{background:none!important}
  /* Chrome no pinta los bordes colapsados de una celda position:relative con fondo: en papel, celdas planas */
  .t td{position:static;background:none}
  .c-st .st{position:static;height:auto;min-height:0}
  .sel{color:#222}
  .sel.vacio{color:#999;-webkit-text-fill-color:#999}
  .in.fecha::-webkit-calendar-picker-indicator{display:none}
  .fotos{margin:0}
  .foto{break-before:page;page-break-before:always;break-inside:avoid;page-break-inside:avoid;margin:0}
  .f-img{display:block;min-height:0;overflow:hidden;padding-top:1px}
  .f-img img{max-height:240mm;width:100%;object-fit:contain}
  /* v5: en papel salen las líneas de la hoja (hojaV5) en lugar de los controles nuevos; la casilla N/A sale como las otras (X / ☐) */
  .h-v5{display:block}
  .v5-ctl,[data-campo="na_motivo"],[data-campo="peligro"],[data-campo="peligro_texto"],[data-campo="coste"],[data-campo="clave_ref"],[data-campo="na_motivo"]+.ta-p,[data-campo="peligro_texto"]+.ta-p{display:none!important}
  .st[data-v="N/A"]{color:#222}
}
</style>

<main id="main"><div class="msg" id="stLoad">Cargando…</div></main>

  <button class="b-guardar" id="bGuardar" onclick="guardarTodo()">💾 Guardar</button>
  <button class="b-enviar" id="bEnviar" onclick="enviarInforme()">📤 Enviar</button>

<script>
const WORKER = 'https://www.3villas.com/intranet/api';
const PAGE_VERSION = 4;
const R2_PUBLIC = 'https://pub-48c1cfd5de614ff0a0cebfec482a7b32.r2.dev/';
const FOTOS_HOST = 'https://www.3villas.com/intranet/fotos/';
const urlP = new URLSearchParams(window.location.search);
const VILLAID = (urlP.get('villa_id')||urlP.get('villaid')||'').trim();
const TEMPORADA = (function(){const t=parseInt(urlP.get('temporada'),10);return t>=2000&&t<=2100?t:new Date().getFullYear();})();

/* ── auto-detección de versión (copia de villa.html) ── */
(function checkForNewerVersion(){
  try{
    if(location.protocol==='file:')return;
    fetch(location.pathname,{cache:'reload'}).then(r=>r.text()).then(html=>{
      const m=html.match(/VERSIÓN ACTUAL:\s*v(\d+)/i);
      if(!m)return;
      const serverV=parseInt(m[1]);
      if(serverV>PAGE_VERSION){
        const key='3v_vchk_'+location.pathname+'_v'+serverV;
        if(!sessionStorage.getItem(key)){
          sessionStorage.setItem(key,'1');
          location.reload();
        }
      }
    }).catch(()=>{});
  }catch(e){}
})();
/* v2: el ✕ guarda lo pendiente antes de salir (en el móvil se perdía lo escrito en la última caja) */
window.goBack=async function(){
  if(INFORME&&!SOLO&&haySucios()){
    const ok=await guardarPendientes();
    if(!ok&&!confirm('Hay cambios sin guardar (se quedan en este móvil). ¿Salir igualmente?'))return;
  }
  try{window.close();}catch(e){}setTimeout(function(){history.back();},200);
};

/* ── Helpers puros (los prueba informe-temporada.test.js con vm) ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escQ(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function dos(n){return String(n).padStart(2,'0');}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+dos(d.getMonth()+1)+'-'+dos(d.getDate());}
function ahoraCaspio(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function rolDe(role){return String(role||'').trim().toLowerCase();}
function esAdminManager(role){const r=rolDe(role);return r==='admin'||r==='manager';}
/* Puerta: admin y manager siempre; staff solo si es villa manager (Keyholder_por_defecto en su fila de TaUsers, como villa.html) */
function puedeAbrirInforme(role,isVM){return esAdminManager(role)||(isVM===true&&rolDe(role)==='staff');}
function esVillaManager(uRows,email){const em=String(email||'').trim().toLowerCase();if(!em)return false;const me=(uRows||[]).find(u=>String(u.Email||'').trim().toLowerCase()===em);return!!me&&String(me.Keyholder_por_defecto||'').trim()!=='';}
/* Secciones y claves en el orden del informe de Rafa (mismas claves en el formulario, el listado y la impresion) */
function seccionesDef(){
  const n=(p,c,l)=>Array.from({length:c},(_,i)=>[p+(i+1),l+' '+(i+1)]);
  return [
    {id:'resumen',titulo:'1. Resumen y actuaciones prioritarias',tipo:'accion',claves:n('accion_',5,'Actuación')},
    {id:'interior',titulo:'2. Interior',tipo:'estado',claves:[
      ['pintura','Pintura interior (paredes, techos, carpintería)'],['colchones','Colchones y almohadas'],['sofas','Sofás, tapicerías y alfombras'],
      ['mobiliario_cocina','Mobiliario y módulos de cocina'],['menaje','Menaje de cocina'],['electrodomesticos','Electrodomésticos'],
      ['aire_acondicionado','Aire acondicionado/ventiladores (equipos y mandos)'],['puertas','Puertas de entrada (cierre y entrada de agua)'],
      ['ventanas','Ventanas y contraventanas (manecillas, mecanismos)'],['banos','Baños: grifería, duchas y mamparas'],

/* Una fila -> una peticion. Conocida (linea_id): PUT where linea_id; nueva: POST (luego se lee otra vez). Nunca la accion update del Worker. */
function lineaRequest(informeId,L){
  const v={};['estado','texto_1','texto_2','prioridad','foto_url','na_motivo','peligro_texto','coste','clave_ref'].forEach(c=>{v[c]=L[c]==null?'':String(L[c]);});
  /* v5: na y peligro son columnas Sí/No de Caspio: van como true / false (vacío o null = false) */
  ['na','peligro'].forEach(c=>{const x=L[c];v[c]=x===true||x===1||['1','true','sí','si','yes'].indexOf(String(x==null?'':x).trim().toLowerCase())>=0;});
  if(L.linea_id)return{method:'PUT',url:WORKER+'?action=save&table=TaInformeTemporadaLineas&where='+encodeURIComponent('linea_id='+parseInt(L.linea_id,10))+'&method=PUT',body:v};
  return{method:'POST',url:WORKER+'?action=save&table=TaInformeTemporadaLineas&method=POST',body:Object.assign({informe_id:parseInt(informeId,10),seccion:L.seccion,clave:L.clave,orden:L.orden},v)};

/* v2: el Worker (caspio-proxy, action save) solo hace PUT con where o POST: no hay borrado. Quitar una foto = PUT que vacía la fila */
/* Par (seccion, clave) repetido en Caspio (reintentos de v1): vale la fila de linea_id más alto */
function mejorLinea(rows){let m=null;(rows||[]).forEach(r=>{if(r&&(!m||(parseInt(r.linea_id,10)||0)>(parseInt(m.linea_id,10)||0)))m=r;});return m;}
/* Cabecera repetida para villa y temporada: vale la de informe_id más bajo (la primera que se creó) */
function primerInforme(rows){let m=null;(rows||[]).forEach(r=>{if(r&&r.informe_id&&(!m||parseInt(r.informe_id,10)<parseInt(m.informe_id,10)))m=r;});return m;}
/* v5: valor de una columna Sí/No (na, peligro): true, 1, '1', 'true', 'sí', 'si', 'yes' = sí; lo demás (null incluido) = no */
function siNo(v){return v===true||v===1||['1','true','sí','si','yes'].indexOf(String(v==null?'':v).trim().toLowerCase())>=0;}
/* Filas de Caspio -> LINEAS ('seccion|clave' -> fila); campos null -> '', orden por defecto, gana el linea_id más alto */
function lineasDesdeFilas(rows){
  const out={};
  (rows||[]).forEach(r=>{
    if(!r||!r.seccion||!r.clave)return;
    const k=r.seccion+'|'+r.clave,prev=out[k];
    if(prev&&(parseInt(prev.linea_id,10)||0)>=(parseInt(r.linea_id,10)||0))return;
    const L=Object.assign({},r,{_sucio:false,_ver:0});
    ['estado','texto_1','texto_2','prioridad','foto_url','na_motivo','peligro_texto','coste','clave_ref'].forEach(c=>{L[c]=r[c]==null?'':String(r[c]);});
    L.na=siNo(r.na);L.peligro=siNo(r.peligro); /* v5: Sí/No; null (filas de antes de la v5) = false */
    if(!L.orden){const d=defDe(r.seccion,r.clave);if(d)L.orden=d.orden;}
    out[k]=L;
  });
  return out;
}

/* 6 letras o cifras al azar: la dirección pública de la foto no se puede adivinar */
function aleatorio6(){
  const a='abcdefghijklmnopqrstuvwxyz0123456789',b=new Uint8Array(6);let s='';
  try{crypto.getRandomValues(b);}catch(e){for(let i=0;i<6;i++)b[i]=Math.floor(Math.random()*256);}
  for(let i=0;i<6;i++)s+=a[b[i]%36];
  return s;
}

/* ── Llamadas al Worker ── */
async function enviar(req){
  const opt={method:req.method,keepalive:true};
  if(req.body!==undefined){opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(req.body);}
  const r=await fetch(Auth.url(req.url),opt);
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}throw new Error('HTTP '+r.status+(t?': '+t.slice(0,120):''));}
  return r;
}
async function leer(tabla,where,limit){
  const r=await fetch(Auth.url(WORKER+'?action=data&table='+tabla+(where?'&where='+encodeURIComponent(where):'')+'&limit='+limit));
  if(!r.ok)throw new Error('HTTP '+r.status+' al leer '+tabla);
  const j=await r.json();return j.Result||j.result||[];
}
function camposCabecera(){return{fecha_revision:INFORME.fecha_revision||hoyISO(),estado_general:INFORME.estado_general||'',observaciones_finales:INFORME.observaciones_finales||''};}
/* La cabecera se crea con la primera edicion (abrir el informe no crea nada). POST y luego se lee otra vez: el POST no devuelve la fila. */
async function asegurarInforme(){
  if(INFORME.informe_id)return INFORME.informe_id;
  if(CREANDO)return CREANDO;
  CREANDO=(async()=>{
    try{
      let inf=primerInforme(await leer('TaInformeTemporada',whereInforme(VILLAID,TEMPORADA),5));
      if(!inf){
        const ver=CAB_VER;
        await enviar(informeRequest(INFORME,camposCabecera()));
        inf=primerInforme(await leer('TaInformeTemporada',whereInforme(VILLAID,TEMPORADA),5));
        if(!inf)throw new Error('el informe creado no aparece');
        if(CAB_VER===ver)CAB_SUCIO=false;
      }
      INFORME.informe_id=inf.informe_id;
      if(!INFORME.estado)INFORME.estado=inf.estado||'borrador';
      return INFORME.informe_id;
    }finally{CREANDO=null;pintarGuardado();}
  })();
  return CREANDO;
}
async function guardarCabecera(){
  if(!CAB_SUCIO)return true;
  if(CAB_VUELO){CAB_OTRA=true;return CAB_VUELO;}
  CAB_VUELO=(async()=>{
    let ok=true;
    try{
      const nuevo=!INFORME.informe_id;
      await asegurarInforme();
      if(!nuevo||CAB_SUCIO){const ver=CAB_VER;await enviar(informeRequest(INFORME,camposCabecera()));if(CAB_VER===ver)CAB_SUCIO=false;}
    }catch(e){ok=false;toast('No guardado: '+e.message,'error');}
    finally{
      CAB_VUELO=null;pintarGuardado();
      if(ok&&CAB_SUCIO&&CAB_OTRA){CAB_OTRA=false;setTimeout(guardarCabecera,0);}
    }
    return ok;
  })();
  return CAB_VUELO;
}
/* Una llamada por fila editada: PUT si la conocemos; si no, lectura (por si un intento anterior ya la creó), POST y lectura para saber su linea_id */
async function guardarFila(k){
  const L=LINEAS[k];if(!L||!L._sucio)return true;
  /* v2: la fila nueva y vacía se resuelve ANTES de marcar el vuelo (en v1 el finally borraba la marca antes de guardarla y la fila no se volvía a guardar nunca) */
  if(!L.linea_id&&!L._post&&filaVacia(L)){L._sucio=false;pintarPunto(k);pintarGuardado();return true;}
  if(L._vuelo){L._otraVez=true;return L._vuelo;}
  L._vuelo=(async()=>{
    let ok=true;
    try{
      const ver=L._ver;
      const id=await asegurarInforme();
      if(!L.linea_id){const prev=mejorLinea(await leer('TaInformeTemporadaLineas',whereLinea(id,L.seccion,L.clave),5));if(prev)L.linea_id=prev.linea_id;}
      if(!L.linea_id&&filaVacia(L)){L._post=false;if(L._ver===ver)L._sucio=false;return true;}
      if(!L.linea_id)L._post=true;
      await enviar(lineaRequest(id,L));
      if(!L.linea_id){
        const fila=mejorLinea(await leer('TaInformeTemporadaLineas',whereLinea(id,L.seccion,L.clave),5));
        if(!fila)throw new Error('la fila guardada no aparece');
        L.linea_id=fila.linea_id;L._post=false;
      }
      if(L._ver===ver)L._sucio=false;
    }catch(e){ok=false;toast('No guardado: '+e.message,'error');}
    finally{
      L._vuelo=null;pintarPunto(k);pintarGuardado();
      if(ok&&L._sucio&&L._otraVez){L._otraVez=false;setTimeout(()=>guardarFila(k),0);}
    }
    return ok;
  })();
  return L._vuelo;
}
/* Guarda todo lo que falta (tambien los fallos anteriores: el reintento va con la siguiente edicion o con Guardar) */
async function guardarPendientes(){
  clearTimeout(TIMER);TIMER=null;
  let ok=await guardarCabecera();
  /* dos vueltas: lo que se escribió mientras una fila estaba en vuelo también sale */
  for(let v=0;v<2&&ok;v++){
    const ks=Object.keys(LINEAS).filter(k=>LINEAS[k]._sucio);if(!ks.length)break;
    for(const k of ks)ok=(await guardarFila(k))&&ok;
  }
  if(ok&&CAB_SUCIO)ok=await guardarCabecera();
  return ok;
}
function programar(ms){clearTimeout(TIMER);TIMER=setTimeout(guardarPendientes,ms);}
function haySucios(){return CAB_SUCIO||Object.values(LINEAS).some(L=>L._sucio);}
/* ── v2: borrador local (localStorage informe:<villaid>:<temporada>) con las filas sin guardar; solo texto, sin fotos ── */
function claveBorrador(){return 'informe:'+parseInt(VILLAID,10)+':'+TEMPORADA;}
function borradorDe(lineas,cab){
  const d={};

}

function borrarBorrador(){try{localStorage.removeItem(claveBorrador());}catch(e){}}
/* Al cargar, después de las filas de Caspio: las del borrador que siguen distintas se ponen encima y quedan sucias para guardarse */
function mezclarBorrador(d){
  let n=0;if(!d)return 0;
  const campos=['estado','texto_1','texto_2','prioridad'],txt=v=>v==null?'':String(v);
  /* v5: los campos nuevos solo cuentan si el borrador los trae (un borrador de la v4 no borra un N/A guardado) */
  const nuevos=['na','na_motivo','peligro','peligro_texto','coste','clave_ref'],norm=(c,v)=>c==='na'||c==='peligro'?siNo(v):txt(v);
  Object.keys(d).forEach(k=>{
    const b=d[k];if(!b||typeof b!=='object')return;
    if(k==='__cab'){
      const cambia=['estado_general','observaciones_finales'].some(c=>b[c]!=null&&txt(b[c])!==txt(INFORME[c]))||(b.fecha_revision&&b.fecha_revision!==fechaInput(INFORME.fecha_revision));
      if(cambia){['fecha_revision','estado_general','observaciones_finales'].forEach(c=>{if(b[c]!=null)INFORME[c]=txt(b[c]);});CAB_SUCIO=true;CAB_VER++;n++;}
      return;
    }
    const p=k.split('|');if(p.length!==2||!defDe(p[0],p[1]))return;
    const actual=LINEAS[k];
    const cs=campos.concat(nuevos.filter(c=>b[c]!==undefined));
    if(cs.every(c=>norm(c,b[c])===norm(c,actual&&actual[c])))return;
    const L=fila(k);cs.forEach(c=>{L[c]=norm(c,b[c]);});L._sucio=true;L._ver++;n++;
  });
  return n;
}
async function guardarTodo(){
  if(SOLO)return;
  const habia=haySucios();
  const ok=await guardarPendientes();
  /* v2: nunca "✓ Guardado" con algo pendiente */
  if(ok&&!haySucios())toast(habia?'✓ Guardado':'✓ Todo guardado','success');
  else if(ok)toast('Quedan cambios sin guardar: vuelve a pulsar Guardar','error');
}
async function enviarInforme(){
  if(SOLO)return;
  const err=validarEnvio(INFORME);
  if(err){toast(err,'error');return;}
  /* v5: N/A sin motivo y peligro sin texto paran el envío y dicen dónde */
  const faltas=faltasEnvio(LINEAS),fm=mensajeFaltas(faltas);
  if(fm){toast(fm,'error');enfocarFalta(faltas);return;}
  if(!confirm('¿Enviar el informe de '+nombreVilla()+'? Después solo podrá cambiarlo administración.'))return;
  if(!(await guardarPendientes())||haySucios()){toast('No enviado: hay cambios sin guardar. Vuelve a intentarlo.','error');return;}
  try{
    await asegurarInforme();
    await enviar(informeRequest(INFORME,{estado:'enviado',enviado_at:ahoraCaspio()}));
    INFORME.estado='enviado';
    toast('📤 Informe enviado','success');
    pintarTodo();
  }catch(e){toast('No guardado: '+e.message,'error');}
}
async function reabrirInforme(){
  if(!esAdminManager(ROL)||!INFORME.informe_id)return;
  try{
    await enviar(informeRequest(INFORME,{estado:'borrador',enviado_at:null}));
    INFORME.estado='borrador';INFORME.enviado_at=null;
    toast('🔓 Informe reabierto','success');
    pintarTodo();
  }catch(e){toast('No guardado: '+e.message,'error');}
}

/* ── Edicion ── */
function editarFila(k,campo,v){const L=fila(k);L[campo]=v;L._sucio=true;L._ver++;pintarPunto(k);pintarGuardado();}
function editarCab(campo,v){INFORME[campo]=v;CAB_SUCIO=true;CAB_VER++;pintarGuardado();}
function crecer(t){t.style.height='auto';t.style.height=t.scrollHeight+2+'px';}
function alPulsar(e){
  const b=e.target.closest('.st');if(!b||SOLO||b.disabled)return;
  const campo=b.dataset.campo,caja=b.closest('[data-k]'),k=caja.dataset.k;
  const v=b.classList.contains('on')?'':b.dataset.v;
  /* v3: las casillas de la fila (o de "Estado general") pasan a X / ☐ */
  pintarMarcas(caja,campo,v);
  if(k==='__cab')editarCab(campo,v);
  else{
    /* v5: N/A quita Bueno / Regular / Malo; una marca quita N/A (y su motivo) */
    const cm=cambiosMarca(LINEAS[k],campo,v);
    Object.keys(cm).forEach(c=>editarFila(k,c,cm[c]));
    pintarFilaV5(caja,LINEAS[k]);
    if(cm.na===true)enfocar(caja,'na_motivo');
  }
  guardarPendientes();
}
/* v5: los cambios de un toque en la fila: N/A = {na: true, estado: ''}; quitar N/A = {na: false, na_motivo: ''};
   una marca sobre una fila N/A = {estado, na: false, na_motivo: ''}; si no, solo el campo pulsado */
function cambiosMarca(L,campo,v){
  const c={};
  if(campo==='na'){if(v!==''){c.na=true;c.estado='';}else{c.na=false;c.na_motivo='';}return c;}
  c[campo]=v;
  if(campo==='estado'&&v!==''&&L&&siNo(L.na)){c.na=false;c.na_motivo='';}
  return c;
}
/* v5: repinta las marcas, N/A y las cajas que se abren (motivo de N/A, texto del peligro) de una fila ya pintada */
function pintarFilaV5(caja,L){
  if(!caja||!caja.querySelector||!L)return;
  pintarMarcas(caja,'estado',L.estado||'');
  pintarMarcas(caja,'na',siNo(L.na)?'N/A':'');
  const a=caja.querySelector('.na-caja');if(a)a.hidden=!siNo(L.na);
  const p=caja.querySelector('.peligro-caja');if(p)p.hidden=!siNo(L.peligro);
  [['na_motivo',L.na_motivo],['peligro_texto',L.peligro_texto]].forEach(x=>{const i=caja.querySelector('[data-campo="'+x[0]+'"]');if(i&&i.value!==String(x[1]||''))i.value=String(x[1]||'');});
}
function enfocar(caja,campo){const i=caja&&caja.querySelector&&caja.querySelector('[data-campo="'+campo+'"]');if(i&&i.focus)i.focus();}
function alEscribir(e){
  const t=e.target;if(!t.dataset||!t.dataset.campo||SOLO)return;
  if(t.tagName==='TEXTAREA'){crecer(t);const p=t.nextElementSibling;if(p&&p.classList&&p.classList.contains('ta-p'))p.textContent=t.value;}
  if(t.tagName==='SELECT')t.classList.toggle('vacio',!t.value);
  const caja=t.closest('[data-k]');if(!caja)return;const k=caja.dataset.k,campo=t.dataset.campo;
  if(campo==='foto')return;
  /* v5: casilla ⚠ Peligro = true / false (nunca "on"); input y change del mismo toque no cuentan dos veces; desmarcar borra el texto */
  if(t.type==='checkbox'){
    const on=!!t.checked,L=fila(k);if(siNo(L[campo])===on)return;
    editarFila(k,campo,on);if(campo==='peligro'&&!on)editarFila(k,'peligro_texto','');
    pintarFilaV5(caja,LINEAS[k]);if(on)enfocar(caja,'peligro_texto');
    programar(1500);return;
  }
  if(k==='__cab')editarCab(campo,t.value);
  else if(campo==='est_nombre'||campo==='est_inc')editarFila(k,'texto_1',textoEstancia(caja.querySelector('[data-campo=est_nombre]').value,caja.querySelector('[data-campo=est_inc]').value));
  else editarFila(k,campo,campo==='prioridad'?prioridadGuardar(t.value):t.value);
  /* v2: en el móvil la caja no siempre pierde el foco antes de cerrar: se guarda también mientras se escribe (1,5 s sin teclear) */
  programar(1500);
}
function alSalir(e){const t=e.target;if(t.dataset&&t.dataset.campo&&t.dataset.campo!=='foto'&&haySucios())programar(800);}

/* ── Pintar (v3: la hoja de Rafa, informe-ejemplo-rafa.pdf; la misma maqueta sale en papel) ── */
/* Prioridad: se guarda como siempre (Alta / Media / Baja); se ve con las palabras del PDF (Alto / Medio / Bajo) */
function prioridadVer(v){const s=String(v==null?'':v).trim(),m={alta:'Alto',media:'Medio',baja:'Bajo'};return m[s.toLowerCase()]||s;}
function prioridadGuardar(t){const s=String(t==null?'':t).trim(),m={alto:'Alta',medio:'Media',bajo:'Baja'};return m[s.toLowerCase()]||s;}

function casilla(v,actual){const on=actual===v;return '<td class="c-st"><button type="button" class="st'+(on?' on':'')+'" data-campo="estado" data-v="'+v+'" aria-label="'+v+'" aria-pressed="'+on+'"'+dis()+'>'+(on?'X':'☐')+'</button></td>';}

/* Copia de task-limpieza.html v11 (misma firma; 1200 px, calidad 0,8). v2: un archivo que no es JPEG se recodifica aunque sea pequeño, para subir siempre .jpg */
function compressImage(file,maxPx,quality){
  maxPx=maxPx||1200;quality=quality||0.80;
  return new Promise(function(resolve){
    if(file.size<300*1024&&file.type==='image/jpeg'){resolve(file);return;}
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){if(w>=h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(function(blob){
        resolve(blob?new File([blob],file.name,{type:'image/jpeg',lastModified:Date.now()}):file);
      },'image/jpeg',quality);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve(file);};
    img.src=url;
  });
}
async function subirFoto(k,file){
  if(SOLO||!file)return;
  const caja=document.querySelector('.foto[data-k="'+k+'"]'),im=caja&&caja.querySelector('.f-img'),antes=im?im.innerHTML:'';
  if(im)im.innerHTML='<div class="spin"></div>';
  let tm=null;
  try{
    const id=await asegurarInforme();
    const L=fila(k);
    const jpg=await compressImage(file,1200,0.8);
    const nombre=fotoNombre(TEMPORADA,id,L.clave);
    const fd=new FormData();fd.append('file',jpg,nombre);fd.append('filename','informe/'+nombre);
    /* sin respuesta en 60 s: se corta y el hueco vuelve a como estaba */
    const ac=new AbortController();tm=setTimeout(()=>ac.abort(),60000);
    const r=await fetch(Auth.url(WORKER+'?action=upload'),{method:'POST',body:fd,signal:ac.signal});
    const t=await r.text();
    clearTimeout(tm);tm=null;
    if(!r.ok)throw new Error('HTTP '+r.status);
    const url=urlDeSubida(t);
    if(!url)throw new Error('la subida no devolvió la URL de la foto');
    editarFila(k,'foto_url',conVersion(url));
    repintarFoto(k);
    await guardarFila(k);
  }catch(e){
    const sinRed=e&&(e.name==='AbortError'||e.name==='TypeError');
    toast(sinRed?'Foto no subida: sin conexión':'Foto no subida: '+e.message,'error');
    if(im)im.innerHTML=antes;
  }finally{if(tm)clearTimeout(tm);}
}

/* v5: la hoja en papel de los cuatro datos nuevos (líneas .h-v5: ocultas en pantalla, donde mandan los controles; en papel
   sustituyen a los controles). Leen la línea tal como vuelve de Caspio: na y peligro YES/NO (true/false, null = no),
   na_motivo, peligro_texto, coste (desconocido | <500 | 500-2000 | 2000-10000 | 10000+, en blanco = nada, nunca 0), clave_ref.
   La marca de la columna N/A es la casilla de la fila (sale X / ☐ como Bueno, Regular y Malo); aquí va su motivo. */
function hojaSi(v){if(v===true||v===1)return true;return typeof v==='string'&&/^(1|true|s[ií]|yes)$/.test(v.trim().toLowerCase());}
function hojaNa(L){if(!L||!hojaSi(L.na))return '';const m=String(L.na_motivo==null?'':L.na_motivo).trim();return '<div class="h-v5 h-na">N/A: '+esc(m||'sin motivo')+'</div>';}
function hojaPeligro(L){if(!L||!hojaSi(L.peligro))return '';const t=String(L.peligro_texto==null?'':L.peligro_texto).trim();return '<div class="h-v5 h-peligro">⚠ '+esc(t||'Peligro (sin descripción)')+'</div>';}
function hojaCosteTexto(v){const s=String(v==null?'':v).trim(),m={'desconocido':'desconocido','<500':'menos de 500 €','500-2000':'500 a 2.000 €','2000-10000':'2.000 a 10.000 €','10000+':'más de 10.000 €'};return m[s.toLowerCase()]||s;}
function hojaCoste(L){const t=L?hojaCosteTexto(L.coste):'';return t?'<div class="h-v5 h-coste">Coste estimado: '+esc(t)+'</div>':'';}
/* clave_ref: uno de los 26 elementos, una de las 7 estancias o "otra"; una clave desconocida sale tal cual */
function hojaRefTexto(clave){
  const c=String(clave==null?'':clave).trim();if(!c)return '';if(c==='otra')return 'Otra';
  let t='';seccionesDef().forEach(s=>{if(s.tipo==='estado'||s.tipo==='estancia')s.claves.forEach(x=>{if(x[0]===c)t=x[1];});});
  return t||c;
}
function hojaRef(L){const t=L?hojaRefTexto(L.clave_ref):'';return t?'<div class="h-v5 h-ref">Se refiere a: '+esc(t)+'</div>':'';}
/* Una llamada por fila: elemento = bajo la observación; actuación y estancia = tras la acción; foto = bajo el pie */
function hojaV5(L){return hojaNa(L)+hojaPeligro(L)+hojaCoste(L)+hojaRef(L);}
