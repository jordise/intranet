<style>
:root{
  --red:#C8102E;--red-dark:#9e0c24;--red-light:#fce8eb;
  --green:#1e9e4e;--green-light:#e6f7ee;
  --orange:#e07b00;--orange-light:#fff4e0;
  --gray-1:#f4f5f7;--gray-2:#e8eaed;--gray-3:#c4c9d4;--gray-4:#7a8194;--gray-5:#2d3142;
  --hdr:48px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Open Sans',sans-serif;background:var(--gray-1);color:var(--gray-5);min-height:100vh;padding-bottom:84px}

/* ── NAV (igual que villa.html) ── */
.top-nav{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1.5px solid var(--gray-2);box-shadow:0 2px 8px rgba(0,0,0,.07);position:sticky;top:0;z-index:300}
.nav-logo img{height:24px;object-fit:contain}
.nav-center{flex:1;min-width:0;padding:0 4px}
.h-title{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:var(--gray-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-meta{font-size:10px;color:var(--gray-4);margin-top:1px}
.nav-close-btn{display:flex;align-items:center;justify-content:center;background:rgba(200,16,46,.1);border:1.5px solid rgba(200,16,46,.2);color:var(--red);width:30px;height:30px;border-radius:50%;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0}
.nav-menu-btn{display:flex;align-items:center;justify-content:center;background:var(--red);border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer;flex-shrink:0}

/* ── Cabecera del informe ── */
main{max-width:960px;margin:0 auto;padding:12px}
.cab{background:#fff;border:1.5px solid var(--gray-2);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.cab h1{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:900;line-height:1.25;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cab .sub{font-size:11px;color:var(--gray-4);font-weight:600;margin-top:2px}
.cab-linea{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;margin-top:8px}
.cab-linea input[type=date]{font:inherit;font-size:13px;padding:5px 8px;border:1.5px solid var(--gray-2);border-radius:8px;background:#fff;color:var(--gray-5);min-height:34px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800}
.pill.borrador{background:var(--orange-light);color:var(--orange)}
.pill.enviado{background:var(--green-light);color:var(--green)}
.aviso{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--orange-light);color:#8a4b00;font-size:12px;font-weight:600}
.aviso:empty{display:none}

/* ── Secciones ── */
.sec{background:#fff;border:1.5px solid var(--gray-2);border-radius:12px;margin-bottom:12px}
.sec>summary{list-style:none;cursor:pointer;position:sticky;top:var(--hdr);z-index:200;background:#fff;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:8px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px;border-bottom:1px solid transparent}
.sec[open]>summary{border-bottom-color:var(--gray-2);border-radius:12px 12px 0 0}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'▸';color:var(--red);transition:transform .15s}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec-t{flex:1;min-width:0}
.sec-n{font-size:11px;font-weight:700;color:var(--gray-4);background:var(--gray-1);border-radius:20px;padding:2px 8px;white-space:nowrap}
.sec-b{padding:6px 14px 12px}
.sec-ayuda{font-size:12px;color:var(--gray-4);margin:6px 0 4px}
.fila{padding:10px 0;border-bottom:1px solid var(--gray-2);min-width:0}
.fila:last-of-type{border-bottom:none}
.f-lab{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:flex-start;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;background:transparent}
.dot.sucio{background:var(--orange)}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.st{height:36px;border-radius:8px;border:1.5px solid var(--gray-3);background:#fff;color:var(--gray-5);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;cursor:pointer;min-width:0}
.st.on.v-bueno,.st.on.v-baja{background:var(--green);border-color:var(--green);color:#fff}
.st.on.v-regular,.st.on.v-media{background:#e0a100;border-color:#e0a100;color:#fff}
.st.on.v-malo,.st.on.v-alta{background:var(--red);border-color:var(--red);color:#fff}
.st.on.v-review,.st.on.v-parte,.st.on.v-propuesta{background:#1967d2;border-color:#1967d2;color:#fff}
.st:disabled{cursor:default;opacity:.85}
.campo{display:block;margin-bottom:6px;min-width:0}
.campo>span{display:block;font-size:11px;font-weight:700;color:var(--gray-4);margin-bottom:2px}
textarea,.txt{width:100%;font:inherit;font-size:14px;line-height:1.4;padding:7px 9px;border:1.5px solid var(--gray-2);border-radius:8px;background:#fff;color:var(--gray-5);resize:none;overflow:hidden;min-height:36px}
textarea:focus,.txt:focus{outline:none;border-color:var(--red)}
textarea:disabled,.txt:disabled{background:var(--gray-1)}
.anadir{display:block;width:100%;margin-top:8px;padding:9px;border:1.5px dashed var(--gray-3);border-radius:8px;background:none;color:var(--gray-4);font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer;text-align:left}
.anadir:hover{border-color:var(--red);color:var(--red)}
.nueva-est{display:flex;gap:6px;margin-top:8px}
.nueva-est .txt{flex:1;min-width:0}
.nueva-est button{flex-shrink:0;padding:0 14px;border:none;border-radius:8px;background:var(--red);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;cursor:pointer}
@media(min-width:720px){
  .fila.est{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:14px;align-items:start}
  .fila.est .f-lab{grid-column:1}.fila.est .btns3{grid-column:2;grid-row:1}.fila.est .campo{grid-column:1/3}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
}

/* ── Fotos ── */
.fotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:6px}
@media(min-width:720px){.fotos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.foto{border:1.5px solid var(--gray-2);border-radius:10px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.f-img{aspect-ratio:4/3;border-radius:8px;background:var(--gray-1);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:26px;color:var(--gray-3)}
.f-img img{width:100%;height:100%;object-fit:cover;display:block}
.f-picks{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.f-pick{display:block;text-align:center;padding:8px 2px;border-radius:8px;background:var(--red);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.f-pick.gal{background:var(--gray-5)}
.f-pick input{display:none}
.f-pie{display:flex;gap:6px;align-items:flex-start;min-width:0}
.f-pie textarea{flex:1;min-width:0}
.f-quitar{padding:6px;border:1.5px solid var(--gray-3);border-radius:8px;background:#fff;color:var(--gray-4);font-family:'Montserrat',sans-serif;font-weight:800;font-size:11px;cursor:pointer}
.spin{width:28px;height:28px;border:3px solid var(--gray-3);border-top-color:var(--red);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ── Barra inferior ── */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:400;background:#fff;border-top:1.5px solid var(--gray-2);box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:8px 10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.barra button{flex:1 1 0;max-width:200px;min-width:0;height:42px;border:none;border-radius:10px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;padding:0 6px}
.b-guardar{background:var(--gray-5);color:#fff}.b-enviar{background:var(--red);color:#fff}
.b-reabrir{background:var(--orange);color:#fff}.b-imprimir{background:var(--gray-2);color:var(--gray-5)}
.barra[hidden]{display:none}
.barra [hidden]{display:none}
.estado-guardado{flex-basis:100%;text-align:center;font-size:11px;color:var(--gray-4);font-weight:600}
.estado-guardado.sucio{color:var(--orange)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d3142;color:#fff;padding:12px 22px;border-radius:30px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:999;max-width:90vw;text-align:center;line-height:1.35}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.msg{background:#fff;border-radius:12px;padding:30px 16px;text-align:center;font-weight:700;margin-top:20px}
.msg.err{color:var(--red)}

/* ── Vista de impresion: la maqueta de Rafa ── */
#printView{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}

#printView .pv-ayuda{break-before:avoid;break-after:avoid}
#printView table{width:100%;border-collapse:collapse;margin-bottom:6px}

<script>
const WORKER = 'https://www.3villas.com/intranet/api';
const PAGE_VERSION = 2;
const R2_PUBLIC = 'https://pub-48c1cfd5de614ff0a0cebfec482a7b32.r2.dev/';
const FOTOS_HOST = 'https://www.3villas.com/intranet/fotos/';
const urlP = new URLSearchParams(window.location.search);
const VILLAID = (urlP.get('villa_id')||urlP.get('villaid')||'').trim();
const TEMPORADA = (function(){const t=parseInt(urlP.get('temporada'),10);return t>=2000&&t<=2100?t:new Date().getFullYear();})();

/* ── auto-detección de versión (copia de villa.html) ── */
(function checkForNewerVersion(){
  try{
    if(location.protocol==='file:')return;
    fetch(location.pathname,{cache:'reload'}).then(r=>r.text()).then(html=>{
      const m=html.match(/VERSIÓN ACTUAL:\s*v(\d+)/i);
      if(!m)return;
      const serverV=parseInt(m[1]);
      if(serverV>PAGE_VERSION){
        const key='3v_vchk_'+location.pathname+'_v'+serverV;
        if(!sessionStorage.getItem(key)){
          sessionStorage.setItem(key,'1');
          location.reload();
        }
      }
    }).catch(()=>{});
  }catch(e){}
})();
/* v2: el ✕ guarda lo pendiente antes de salir (en el móvil se perdía lo escrito en la última caja) */
window.goBack=async function(){
  if(INFORME&&!SOLO&&haySucios()){
    const ok=await guardarPendientes();
    if(!ok&&!confirm('Hay cambios sin guardar (se quedan en este móvil). ¿Salir igualmente?'))return;
  }
  try{window.close();}catch(e){}setTimeout(function(){history.back();},200);
};

/* ── Helpers puros (los prueba informe-temporada.test.js con vm) ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escQ(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function dos(n){return String(n).padStart(2,'0');}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+dos(d.getMonth()+1)+'-'+dos(d.getDate());}
function ahoraCaspio(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function rolDe(role){return String(role||'').trim().toLowerCase();}
function esAdminManager(role){const r=rolDe(role);return r==='admin'||r==='manager';}
/* Puerta: admin y manager siempre; staff solo si es villa manager (Keyholder_por_defecto en su fila de TaUsers, como villa.html) */
function puedeAbrirInforme(role,isVM){return esAdminManager(role)||(isVM===true&&rolDe(role)==='staff');}
function esVillaManager(uRows,email){const em=String(email||'').trim().toLowerCase();if(!em)return false;const me=(uRows||[]).find(u=>String(u.Email||'').trim().toLowerCase()===em);return!!me&&String(me.Keyholder_por_defecto||'').trim()!=='';}
/* Secciones y claves en el orden del informe de Rafa (mismas claves en el formulario, el listado y la impresion) */
function seccionesDef(){
  const n=(p,c,l)=>Array.from({length:c},(_,i)=>[p+(i+1),l+' '+(i+1)]);
  return [
    {id:'resumen',titulo:'1. Resumen y actuaciones prioritarias',tipo:'accion',claves:n('accion_',5,'Actuación')},
    {id:'interior',titulo:'2. Interior',tipo:'estado',claves:[
      ['pintura','Pintura interior (paredes, techos, carpintería)'],['colchones','Colchones y almohadas'],['sofas','Sofás, tapicerías y alfombras'],
      ['mobiliario_cocina','Mobiliario y módulos de cocina'],['menaje','Menaje de cocina'],['electrodomesticos','Electrodomésticos'],
      ['aire_acondicionado','Aire acondicionado / ventiladores (equipos y mandos)'],['puertas','Puertas de entrada (cierre y entrada de agua)'],
      ['ventanas','Ventanas y contraventanas (manecillas, mecanismos)'],['banos','Baños: grifería, duchas y mamparas'],
      ['desagues','Desagües (atascos y olores)'],['iluminacion','Iluminación interior'],['humedades','Humedades y ventilación']]},
    {id:'exterior',titulo:'3. Exterior',tipo:'estado',claves:[
      ['fachada','Fachada y pintura exterior'],['carpinteria_exterior','Carpintería exterior (madera / PVC)'],['pavimentos','Pavimentos, escalones y rampas'],
      ['barandillas','Barreras y barandillas'],['jardin_muros','Jardín, muros y vallas'],
      ['piscina','Piscina (vaso, gresites, filtro / skimmer, ducha, depuradora, etc.)'],['mobiliario_exterior','Mobiliario exterior'],
      ['barbacoa','Barbacoa'],['iluminacion_exterior','Iluminación exterior']]},
    {id:'seguridad',titulo:'4. Seguridad e instalaciones',tipo:'estado',claves:[
      ['cerraduras','Cerraduras y accesos'],['instalacion_electrica','Instalación eléctrica (cuadro, diferencial, potencia)'],
      ['fontaneria_agua_caliente','Fontanería y agua caliente (fugas, termo, llaves de paso, contador)'],['wifi_tv','Wifi y TV']]},
    {id:'estancia',titulo:'5. Incidencias por estancia',tipo:'estancia',ayuda:'Detalle de los desperfectos concretos detectados en cada estancia que no queden recogidos en los apartados anteriores.',claves:[
      ['salon','Salón / comedor'],['cocina','Cocina'],['dormitorio_principal','Dormitorio principal'],['dormitorio_2','Dormitorio 2'],
      ['bano_1','Baño 1'],['bano_2','Baño 2'],['exterior_piscina','Exterior / zona piscina']],
      extra:['otra_1','otra_2','otra_3','otra_4','otra_5']},
    {id:'huesped',titulo:'6. Comentarios de huéspedes y propuestas de mejora',tipo:'huesped',ayuda:'Quejas o sugerencias repetidas de los huéspedes (reviews, partes o comentarios directos) y mejoras de equipamiento que aumentarían su satisfacción (p. ej., espejos, baldas).',claves:n('comentario_',8,'Comentario')},
    {id:'final',titulo:'7. Observaciones finales',tipo:'final',claves:[]},
    {id:'foto',titulo:'Fotos',tipo:'foto',claves:n('foto_',6,'Foto')}
  ];
}
/* Las 52 filas por defecto (5 + 13 + 9 + 4 + 7 + 8 + 6); las otra_N de estancia van aparte, orden 8..12 */
function clavesDefecto(){
  const out=[];
  seccionesDef().forEach(s=>s.claves.forEach((c,i)=>out.push({seccion:s.id,clave:c[0],orden:i+1,label:c[1]})));
  return out;
}
function whereInforme(villaid,temporada){return 'villaid='+parseInt(villaid,10)+' AND temporada='+parseInt(temporada,10);}
function whereLinea(informeId,seccion,clave){const q=s=>String(s).replace(/'/g,"''");return 'informe_id='+parseInt(informeId,10)+" AND seccion='"+q(seccion)+"' AND clave='"+q(clave)+"'";}
/* Una fila -> una peticion. Conocida (linea_id): PUT where linea_id; nueva: POST (luego se lee otra vez). Nunca la accion update del Worker. */
function lineaRequest(informeId,L){
  const v={};['estado','texto_1','texto_2','prioridad','foto_url'].forEach(c=>{v[c]=L[c]==null?'':String(L[c]);});
  if(L.linea_id)return{method:'PUT',url:WORKER+'?action=save&table=TaInformeTemporadaLineas&where='+encodeURIComponent('linea_id='+parseInt(L.linea_id,10))+'&method=PUT',body:v};
  return{method:'POST',url:WORKER+'?action=save&table=TaInformeTemporadaLineas&method=POST',body:Object.assign({informe_id:parseInt(informeId,10),seccion:L.seccion,clave:L.clave,orden:L.orden},v)};
}
/* v2: el Worker (caspio-proxy, action save) solo hace PUT con where o POST: no hay borrado. Quitar una foto = PUT que vacía la fila */
/* Par (seccion, clave) repetido en Caspio (reintentos de v1): vale la fila de linea_id más alto */
function mejorLinea(rows){let m=null;(rows||[]).forEach(r=>{if(r&&(!m||(parseInt(r.linea_id,10)||0)>(parseInt(m.linea_id,10)||0)))m=r;});return m;}
/* Cabecera repetida para villa y temporada: vale la de informe_id más bajo (la primera que se creó) */
function primerInforme(rows){let m=null;(rows||[]).forEach(r=>{if(r&&r.informe_id&&(!m||parseInt(r.informe_id,10)<parseInt(m.informe_id,10)))m=r;});return m;}
/* Filas de Caspio -> LINEAS ('seccion|clave' -> fila); campos null -> '', orden por defecto, gana el linea_id más alto */
function lineasDesdeFilas(rows){
  const out={};
  (rows||[]).forEach(r=>{
    if(!r||!r.seccion||!r.clave)return;
    const k=r.seccion+'|'+r.clave,prev=out[k];
    if(prev&&(parseInt(prev.linea_id,10)||0)>=(parseInt(r.linea_id,10)||0))return;
    const L=Object.assign({},r,{_sucio:false,_ver:0});
    ['estado','texto_1','texto_2','prioridad','foto_url'].forEach(c=>{L[c]=r[c]==null?'':String(r[c]);});
    if(!L.orden){const d=defDe(r.seccion,r.clave);if(d)L.orden=d.orden;}
    out[k]=L;
  });
  return out;
}
/* Villa manager asignado: KeyHolder_person de TaVillas es un contacto (TaContacts) o un usuario (TaUsers), como resContact de villa.html */
function nombreVillaManager(kh,contacts,users){
  const id=String(kh==null?'':kh).trim();if(!id)return'';
  const c=(contacts||[]).find(x=>String(x.ContactID||x.contactid||x.Id||x.id||'')===id);
  const cn=c&&(c.Name||c.Nombre||c.Full_Name||c.FullName);if(cn)return String(cn);
  const u=(users||[]).find(x=>String(x.UserID||'')===id);return u&&u.Name?String(u.Name):'';
}
/* Cabecera: conocida (informe_id) -> PUT con los campos cambiados; nueva -> POST con villa, temporada, UserID y estado borrador */
function informeRequest(inf,cambios){
  const c=Object.assign({},cambios||{});
  if(inf&&inf.informe_id){c.updated_at=ahoraCaspio();return{method:'PUT',url:WORKER+'?action=save&table=TaInformeTemporada&where='+encodeURIComponent('informe_id='+parseInt(inf.informe_id,10))+'&method=PUT',body:c};}
  return{method:'POST',url:WORKER+'?action=save&table=TaInformeTemporada&method=POST',body:Object.assign({villaid:parseInt(inf.villaid,10),UserID:String(inf.UserID||''),temporada:parseInt(inf.temporada,10),estado:'borrador',updated_at:ahoraCaspio()},c)};
}
function validarEnvio(inf){return inf&&String(inf.estado_general||'').trim()?'':'Falta el estado general';}
/* Enviado = solo lectura para el villa manager; admin y manager pueden seguir editando o reabrir */
function soloLectura(inf,role){return!!inf&&String(inf.estado||'').trim().toLowerCase()==='enviado'&&!esAdminManager(role);}
/* 6 letras o cifras al azar: la dirección pública de la foto no se puede adivinar */
function aleatorio6(){
  const a='abcdefghijklmnopqrstuvwxyz0123456789',b=new Uint8Array(6);let s='';
  try{crypto.getRandomValues(b);}catch(e){for(let i=0;i<6;i++)b[i]=Math.floor(Math.random()*256);}
  for(let i=0;i<6;i++)s+=a[b[i]%36];
  return s;
}
/* v2: siempre JPEG (compressImage): <temporada>_informe_<informe_id>_<clave>_<6 al azar>.jpg */
function fotoNombre(year,informeId,clave,sufijo){
  const s=/^[a-z0-9]{6}$/.test(String(sufijo||''))?String(sufijo):aleatorio6();
  return parseInt(year,10)+'_informe_'+parseInt(informeId,10)+'_'+String(clave).replace(/[^a-z0-9_]/gi,'')+'_'+s+'.jpg';
}
/* Rompe-cache en foto_url, como task-limpieza v11: una foto cambiada se ve al momento */
function conVersion(u){return u+(u.indexOf('?')>=0?'&':'?')+'v='+Date.now();}
/* Mismo host que villa.html v23: r2.dev -> www.3villas.com/intranet/fotos/<clave> */
function fotoUrl(u){
  if(!u||typeof u!=='string')return u;
  u=u.trim();
  return u.startsWith(R2_PUBLIC)?FOTOS_HOST+u.slice(R2_PUBLIC.length):u;
}
/* Respuesta de action=upload: {url}, {publicUrl} o la URL como texto (historial v11 de task-limpieza) */
function urlDeSubida(t){
  const s=String(t||'').trim();if(!s)return'';
  try{const j=JSON.parse(s);const u=typeof j==='string'?j:(j&&(j.url||j.publicUrl));return typeof u==='string'&&/^https?:\/\//.test(u.trim())?u.trim():'';}catch(e){}
  return /^https?:\/\/\S+$/.test(s)?s:'';
}
/* Estancia añadida (otra_N): texto_1 = "<estancia>: <incidencia>"; v2: siempre con ": " (sin nombre: ": <incidencia>"), vacío si no hay nada */
function textoEstancia(nombre,incidencia){const n=String(nombre||'').trim(),i=String(incidencia||'');return n||i?n+': '+i:'';}
function partirEstancia(texto){const t=String(texto||''),p=t.indexOf(':');if(p<0)return{nombre:'',incidencia:t};return{nombre:t.slice(0,p).trim(),incidencia:t.slice(p+1).replace(/^ /,'')};}
function filaVacia(L){return!L||['estado','texto_1','texto_2','prioridad','foto_url'].every(c=>!String(L[c]==null?'':L[c]).trim());}

/* ── Estado de la pagina ── */
let ROL='',USERS=[],CONTACTS=[],ME=null,VILLA=null,INFORME=null,SOLO=false;
let LINEAS={};           /* 'seccion|clave' -> fila (solo las que existen o se han tocado) */
let CAB_SUCIO=false,CAB_VER=0,CAB_VUELO=null,CAB_OTRA=false,CREANDO=null,TIMER=null;
const VISIBLES=new Set(); /* filas vacias que el usuario ha abierto con "+ Añadir" */
const g=id=>document.getElementById(id);

function toast(msg,type){const t=g('toast');t.textContent=msg;t.className='toast show '+(type||'');clearTimeout(t._h);t._h=setTimeout(()=>{t.className='toast';},type==='error'?4500:2500);}
function sinAcceso(){g('main').innerHTML='<div class="msg err">Sin acceso</div>';g('barra').hidden=true;}
function errorCarga(m){g('main').innerHTML='<div class="msg err">'+esc(m)+'</div>';g('barra').hidden=true;}
function defDe(sec,clave){
  const s=seccionesDef().find(x=>x.id===sec);if(!s)return null;
  const i=s.claves.findIndex(c=>c[0]===clave);if(i>=0)return{orden:i+1,label:s.claves[i][1]};
  const j=(s.extra||[]).indexOf(clave);if(j>=0)return{orden:s.claves.length+j+1,label:'Otra estancia '+(j+1)};
  return null;
}
function fila(k){
  if(!LINEAS[k]){const p=k.split('|'),d=defDe(p[0],p[1])||{orden:0};LINEAS[k]={seccion:p[0],clave:p[1],orden:d.orden,estado:'',texto_1:'',texto_2:'',prioridad:'',foto_url:'',_sucio:false,_ver:0};}
  return LINEAS[k];
}
function valor(sec,clave,campo){const L=LINEAS[sec+'|'+clave];return L&&L[campo]!=null?String(L[campo]):'';}
function nombreVilla(){return VILLA?(VILLA.Name||'Villa '+VILLAID):'Villa '+VILLAID;}
/* v2: el villa manager asignado a la villa (no el autor; el autor queda en UserID) */
function nombreVM(){return VILLA?nombreVillaManager(VILLA.KeyHolder_person,CONTACTS,USERS):'';}
function fechaInput(v){const s=String(v||'');return /^\d{4}-\d\d-\d\d/.test(s)?s.slice(0,10):hoyISO();}

/* ── Llamadas al Worker ── */
async function enviar(req){
  const opt={method:req.method,keepalive:true};
  if(req.body!==undefined){opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(req.body);}
  const r=await fetch(Auth.url(req.url),opt);
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}throw new Error('HTTP '+r.status+(t?': '+t.slice(0,120):''));}
  return r;
}
async function leer(tabla,where,limit){
  const r=await fetch(Auth.url(WORKER+'?action=data&table='+tabla+(where?'&where='+encodeURIComponent(where):'')+'&limit='+limit));
  if(!r.ok)throw new Error('HTTP '+r.status+' al leer '+tabla);
  const j=await r.json();return j.Result||j.result||[];
}
function camposCabecera(){return{fecha_revision:INFORME.fecha_revision||hoyISO(),estado_general:INFORME.estado_general||'',observaciones_finales:INFORME.observaciones_finales||''};}
/* La cabecera se crea con la primera edicion (abrir el informe no crea nada). POST y luego se lee otra vez: el POST no devuelve la fila. */
async function asegurarInforme(){
  if(INFORME.informe_id)return INFORME.informe_id;
  if(CREANDO)return CREANDO;
  CREANDO=(async()=>{
    try{
      let inf=primerInforme(await leer('TaInformeTemporada',whereInforme(VILLAID,TEMPORADA),5));
      if(!inf){
        const ver=CAB_VER;
        await enviar(informeRequest(INFORME,camposCabecera()));
        inf=primerInforme(await leer('TaInformeTemporada',whereInforme(VILLAID,TEMPORADA),5));
        if(!inf)throw new Error('el informe creado no aparece');
        if(CAB_VER===ver)CAB_SUCIO=false;
      }
      INFORME.informe_id=inf.informe_id;
      if(!INFORME.estado)INFORME.estado=inf.estado||'borrador';
      return INFORME.informe_id;
    }finally{CREANDO=null;pintarGuardado();}
  })();
  return CREANDO;
}
async function guardarCabecera(){
  if(!CAB_SUCIO)return true;
  if(CAB_VUELO){CAB_OTRA=true;return CAB_VUELO;}
  CAB_VUELO=(async()=>{
    let ok=true;
    try{
      const nuevo=!INFORME.informe_id;
      await asegurarInforme();
      if(!nuevo||CAB_SUCIO){const ver=CAB_VER;await enviar(informeRequest(INFORME,camposCabecera()));if(CAB_VER===ver)CAB_SUCIO=false;}
    }catch(e){ok=false;toast('No guardado: '+e.message,'error');}
    finally{
      CAB_VUELO=null;pintarGuardado();
      if(ok&&CAB_SUCIO&&CAB_OTRA){CAB_OTRA=false;setTimeout(guardarCabecera,0);}
    }
    return ok;
  })();
  return CAB_VUELO;
}
/* Una llamada por fila editada: PUT si la conocemos; si no, lectura (por si un intento anterior ya la creó), POST y lectura para saber su linea_id */
async function guardarFila(k){
  const L=LINEAS[k];if(!L||!L._sucio)return true;
  /* v2: la fila nueva y vacía se resuelve ANTES de marcar el vuelo (en v1 el finally borraba la marca antes de guardarla y la fila no se volvía a guardar nunca) */
  if(!L.linea_id&&!L._post&&filaVacia(L)){L._sucio=false;pintarPunto(k);pintarGuardado();return true;}
  if(L._vuelo){L._otraVez=true;return L._vuelo;}
  L._vuelo=(async()=>{
    let ok=true;
    try{
      const ver=L._ver;
      const id=await asegurarInforme();
      if(!L.linea_id){const prev=mejorLinea(await leer('TaInformeTemporadaLineas',whereLinea(id,L.seccion,L.clave),5));if(prev)L.linea_id=prev.linea_id;}
      if(!L.linea_id&&filaVacia(L)){L._post=false;if(L._ver===ver)L._sucio=false;return true;}
      if(!L.linea_id)L._post=true;
      await enviar(lineaRequest(id,L));
      if(!L.linea_id){
        const fila=mejorLinea(await leer('TaInformeTemporadaLineas',whereLinea(id,L.seccion,L.clave),5));
        if(!fila)throw new Error('la fila guardada no aparece');
        L.linea_id=fila.linea_id;L._post=false;
      }
      if(L._ver===ver)L._sucio=false;
    }catch(e){ok=false;toast('No guardado: '+e.message,'error');}
    finally{
      L._vuelo=null;pintarPunto(k);pintarGuardado();
      if(ok&&L._sucio&&L._otraVez){L._otraVez=false;setTimeout(()=>guardarFila(k),0);}
    }
    return ok;
  })();
  return L._vuelo;
}
/* Guarda todo lo que falta (tambien los fallos anteriores: el reintento va con la siguiente edicion o con Guardar) */
async function guardarPendientes(){
  clearTimeout(TIMER);TIMER=null;
  let ok=await guardarCabecera();
  /* dos vueltas: lo que se escribió mientras una fila estaba en vuelo también sale */
  for(let v=0;v<2&&ok;v++){
    const ks=Object.keys(LINEAS).filter(k=>LINEAS[k]._sucio);if(!ks.length)break;
    for(const k of ks)ok=(await guardarFila(k))&&ok;
  }
  if(ok&&CAB_SUCIO)ok=await guardarCabecera();
  return ok;
}
function programar(ms){clearTimeout(TIMER);TIMER=setTimeout(guardarPendientes,ms);}
function haySucios(){return CAB_SUCIO||Object.values(LINEAS).some(L=>L._sucio);}
/* ── v2: borrador local (localStorage informe:<villaid>:<temporada>) con las filas sin guardar; solo texto, sin fotos ── */
function claveBorrador(){return 'informe:'+parseInt(VILLAID,10)+':'+TEMPORADA;}
function borradorDe(lineas,cab){
  const d={};
  Object.keys(lineas||{}).forEach(k=>{const L=lineas[k];if(L&&L._sucio)d[k]={seccion:L.seccion,clave:L.clave,estado:L.estado||'',texto_1:L.texto_1||'',texto_2:L.texto_2||'',prioridad:L.prioridad||''};});
  if(cab)d.__cab=cab;
  return d;
}
function guardarBorrador(){
  if(!INFORME||SOLO)return;
  try{
    const d=borradorDe(LINEAS,CAB_SUCIO?camposCabecera():null);
    if(Object.keys(d).length)localStorage.setItem(claveBorrador(),JSON.stringify(d));else localStorage.removeItem(claveBorrador());
  }catch(e){}
}
function leerBorrador(){try{const d=JSON.parse(localStorage.getItem(claveBorrador())||'null');return d&&typeof d==='object'?d:null;}catch(e){return null;}}
function borrarBorrador(){try{localStorage.removeItem(claveBorrador());}catch(e){}}
/* Al cargar, después de las filas de Caspio: las del borrador que siguen distintas se ponen encima y quedan sucias para guardarse */
function mezclarBorrador(d){
  let n=0;if(!d)return 0;
  const campos=['estado','texto_1','texto_2','prioridad'],txt=v=>v==null?'':String(v);
  Object.keys(d).forEach(k=>{
    const b=d[k];if(!b||typeof b!=='object')return;
    if(k==='__cab'){
      const cambia=['estado_general','observaciones_finales'].some(c=>b[c]!=null&&txt(b[c])!==txt(INFORME[c]))||(b.fecha_revision&&b.fecha_revision!==fechaInput(INFORME.fecha_revision));
      if(cambia){['fecha_revision','estado_general','observaciones_finales'].forEach(c=>{if(b[c]!=null)INFORME[c]=txt(b[c]);});CAB_SUCIO=true;CAB_VER++;n++;}
      return;
    }
    const p=k.split('|');if(p.length!==2||!defDe(p[0],p[1]))return;
    const actual=LINEAS[k];
    if(campos.every(c=>txt(b[c])===txt(actual&&actual[c])))return;
    const L=fila(k);campos.forEach(c=>{L[c]=txt(b[c]);});L._sucio=true;L._ver++;n++;
  });
  return n;
}
async function guardarTodo(){
  if(SOLO)return;
  const habia=haySucios();
  const ok=await guardarPendientes();
  /* v2: nunca "✓ Guardado" con algo pendiente */
  if(ok&&!haySucios())toast(habia?'✓ Guardado':'✓ Todo guardado','success');
  else if(ok)toast('Quedan cambios sin guardar: vuelve a pulsar Guardar','error');
}
async function enviarInforme(){
  if(SOLO)return;
  const err=validarEnvio(INFORME);
  if(err){toast(err,'error');return;}
  if(!confirm('¿Enviar el informe de '+nombreVilla()+'? Después solo podrá cambiarlo administración.'))return;
  if(!(await guardarPendientes())||haySucios()){toast('No enviado: hay cambios sin guardar. Vuelve a intentarlo.','error');return;}
  try{
    await asegurarInforme();
    await enviar(informeRequest(INFORME,{estado:'enviado',enviado_at:ahoraCaspio()}));
    INFORME.estado='enviado';
    toast('📤 Informe enviado','success');
    pintarTodo();
  }catch(e){toast('No guardado: '+e.message,'error');}
}
async function reabrirInforme(){
  if(!esAdminManager(ROL)||!INFORME.informe_id)return;
  try{
    await enviar(informeRequest(INFORME,{estado:'borrador',enviado_at:null}));
    INFORME.estado='borrador';INFORME.enviado_at=null;
    toast('🔓 Informe reabierto','success');
    pintarTodo();
  }catch(e){toast('No guardado: '+e.message,'error');}
}

/* ── Edicion ── */
function editarFila(k,campo,v){const L=fila(k);L[campo]=v;L._sucio=true;L._ver++;pintarPunto(k);pintarGuardado();pintarCuentas();}
function editarCab(campo,v){INFORME[campo]=v;CAB_SUCIO=true;CAB_VER++;pintarGuardado();}
function crecer(t){t.style.height='auto';t.style.height=t.scrollHeight+2+'px';}
function alPulsar(e){
  const b=e.target.closest('.st');if(!b||SOLO||b.disabled)return;
  const grupo=b.parentElement,campo=b.dataset.campo,k=b.closest('[data-k]').dataset.k;
  const v=b.classList.contains('on')?'':b.dataset.v;
  grupo.querySelectorAll('.st').forEach(x=>x.classList.toggle('on',x===b&&v!==''));
  if(k==='__cab')editarCab(campo,v);else editarFila(k,campo,v);
  guardarPendientes();
}
function alEscribir(e){
  const t=e.target;if(!t.dataset||!t.dataset.campo||SOLO)return;
  if(t.tagName==='TEXTAREA')crecer(t);
  const caja=t.closest('[data-k]');if(!caja)return;const k=caja.dataset.k,campo=t.dataset.campo;
  if(campo==='foto')return;
  if(k==='__cab')editarCab(campo,t.value);
  else if(campo==='est_nombre'||campo==='est_inc')editarFila(k,'texto_1',textoEstancia(caja.querySelector('[data-campo=est_nombre]').value,caja.querySelector('[data-campo=est_inc]').value));
  else editarFila(k,campo,t.value);
  /* v2: en el móvil la caja no siempre pierde el foco antes de cerrar: se guarda también mientras se escribe (1,5 s sin teclear) */
  programar(1500);
}
function alSalir(e){const t=e.target;if(t.dataset&&t.dataset.campo&&t.dataset.campo!=='foto'&&haySucios())programar(800);}

/* ── Pintar ── */
function btns(campo,opciones,actual){

}
function area(campo,etq,v,ph){return '<label class="campo"><span>'+etq+'</span><textarea rows="1" data-campo="'+campo+'" placeholder="'+escQ(ph||'')+'"'+(SOLO?' disabled':'')+'>'+esc(v)+'</textarea></label>';}
function dot(k){const L=LINEAS[k];return '<span class="dot'+(L&&L._sucio?' sucio':'')+'" data-dot="'+k+'"></span>';}

function filaEstanciaHtml(clave,label,esOtra){

function filaHuespedHtml(c){
  const k='huesped|'+c[0];
  return '<div class="fila" data-k="'+k+'"><div class="f-lab">'+dot(k)+esc(c[1])+'</div>'

/* Copia de task-limpieza.html v11 (misma firma; 1200 px, calidad 0,8). v2: un archivo que no es JPEG se recodifica aunque sea pequeño, para subir siempre .jpg */
function compressImage(file,maxPx,quality){
  maxPx=maxPx||1200;quality=quality||0.80;
  return new Promise(function(resolve){
    if(file.size<300*1024&&file.type==='image/jpeg'){resolve(file);return;}
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){if(w>=h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(function(blob){
        resolve(blob?new File([blob],file.name,{type:'image/jpeg',lastModified:Date.now()}):file);
      },'image/jpeg',quality);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve(file);};
    img.src=url;
  });
}
async function subirFoto(k,file){
  if(SOLO||!file)return;
  const caja=document.querySelector('.foto[data-k="'+k+'"]'),im=caja&&caja.querySelector('.f-img'),antes=im?im.innerHTML:'';
  if(im)im.innerHTML='<div class="spin"></div>';
  let tm=null;
  try{
    const id=await asegurarInforme();
    const L=fila(k);
    const jpg=await compressImage(file,1200,0.8);
    const nombre=fotoNombre(TEMPORADA,id,L.clave);
    const fd=new FormData();fd.append('file',jpg,nombre);fd.append('filename','informe/'+nombre);
    /* sin respuesta en 60 s: se corta y el hueco vuelve a como estaba */
    const ac=new AbortController();tm=setTimeout(()=>ac.abort(),60000);
    const r=await fetch(Auth.url(WORKER+'?action=upload'),{method:'POST',body:fd,signal:ac.signal});
    const t=await r.text();
    clearTimeout(tm);tm=null;
    if(!r.ok)throw new Error('HTTP '+r.status);
    const url=urlDeSubida(t);
    if(!url)throw new Error('la subida no devolvió la URL de la foto');
    editarFila(k,'foto_url',conVersion(url));
    repintarFoto(k);
    await guardarFila(k);
  }catch(e){
    const sinRed=e&&(e.name==='AbortError'||e.name==='TypeError');
    toast(sinRed?'Foto no subida: sin conexión':'Foto no subida: '+e.message,'error');
    if(im)im.innerHTML=antes;
  }finally{if(tm)clearTimeout(tm);}
}
/* v2: el Worker no tiene DELETE: Quitar vacía la fila (foto_url y pie) con un PUT y conserva su linea_id */
async function quitarFoto(k){
  if(SOLO)return;
  if(!confirm('¿Quitar esta foto?'))return;
  const L=LINEAS[k];if(!L)return;
  if(L._vuelo){try{await L._vuelo;}catch(e){}}
  L.foto_url='';L.texto_1='';L._sucio=true;L._ver++;
  repintarFoto(k);
  const ok=await guardarFila(k);
  pintarCuentas();pintarGuardado();
  if(ok)toast('Foto quitada','success');
}

async function iniciar(){

  if(!VILLAID||!parseInt(VILLAID,10)){errorCarga('Falta el parámetro villaid en la URL');return;}

    USERS=await leer('TaUsers','',200);
    if(!puedeAbrirInforme(rol,esVillaManager(USERS,Auth.email()))){sinAcceso();return;}
    const em=String(Auth.email()||'').trim().toLowerCase();

      leer('TaContacts','',500)
    ]);
    if(!vRows.length){errorCarga('Villa no encontrada');return;}
    VILLA=vRows[0];CONTACTS=cRows;
    const inf=primerInforme(iRows);
    INFORME=inf?Object.assign({},inf):{villaid:parseInt(VILLAID,10),temporada:TEMPORADA,UserID:ME?String(ME.UserID||''):'',estado:'borrador',estado_general:'',observaciones_finales:'',fecha_revision:hoyISO()};
    LINEAS={};
    if(INFORME.informe_id)LINEAS=lineasDesdeFilas(await leer('TaInformeTemporadaLineas','informe_id='+parseInt(INFORME.informe_id,10),1000));
    SOLO=soloLectura(INFORME,ROL);
    let n=0;
    if(SOLO)borrarBorrador();else n=mezclarBorrador(leerBorrador());

    if(n){toast('Recuperados '+n+(n===1?' cambio sin guardar':' cambios sin guardar')+' de este móvil','success');programar(1500);}
  }catch(err){console.error(err);errorCarga('Error al cargar. Vuelve a intentarlo.');}
}

<!-- HISTORIAL: v2 - 27/10/2026 — ronda de arreglos 1 tras las dos revisiones independientes del 27/10/2026 de la primera versión. Corrección de un dato: el Worker (caspio-proxy, action save) no tiene rama DELETE (sin cuerpo da 400 'JSON inválido'; solo PUT con where o POST), así que ya no hay ningún DELETE en la página ni en las pruebas. (1) Bloqueo: una fila guardada una vez estando vacía no se volvía a guardar nunca (en guardarFila la vuelta temprana de la fila vacía iba después de marcar L._vuelo y el finally borraba la marca antes de guardarla); ahora la fila nueva y vacía se resuelve antes de empezar el guardado. Guardar ya no dice '✓ Guardado' si queda algo pendiente (haySucios) y Enviar se para con el aviso 'No enviado: hay cambios sin guardar' si falla un guardado. (2) Quitar foto = PUT por lineaRequest que vacía foto_url y el pie y conserva el linea_id. (3) Sin duplicados al reintentar: una fila sin linea_id se lee primero por whereLinea (limit 5) y si ya existe se adopta y va PUT; en cada lectura y al cargar vale el linea_id más alto del par (seccion, clave) (lineasDesdeFilas, mejorLinea); la cabecera se lee con limit 5 y vale el informe_id más bajo (primerInforme), al crearla y al cargar. (4) Todas las primeras lecturas por leer(), que mira r.ok (TaUsers, TaVillas, TaInformeTemporada, TaContacts y las líneas): cualquier fallo enseña 'Error al cargar. Vuelve a intentarlo.' sin barra y sin formulario, nunca un Borrador en blanco encima de un informe que existe; un fallo de TaUsers ya no sale como 'Sin acceso'. (5) Móvil: guardado también mientras se escribe (1,5 s sin teclear) además de los 800 ms al salir de la caja, al ocultar la página (visibilitychange) y en pagehide; el ✕ espera a guardarPendientes() antes de salir; borrador local en localStorage 'informe:<villaid>:<temporada>' con las filas sin guardar (solo texto, sin fotos; también los campos de cabecera sin guardar) que al cargar se mezcla encima de las filas de Caspio si sigue distinto, queda mar
