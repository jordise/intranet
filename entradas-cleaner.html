  <style>
    :root{--red:#C8102E;--red-dark:#9e0c24;--green:#187e3e;--orange:#a85a00;--blue:#1565c0;--gray-1:#f4f5f7;--gray-2:#e8eaed;--gray-3:#c4c9d4;--gray-4:#5c6273;--gray-5:#2d3142;--shadow-sm:0 1px 4px rgba(0,0,0,.08);--shadow-lg:0 8px 28px rgba(0,0,0,.13)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Open Sans',sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;background:var(--gray-1);color:var(--gray-5);min-height:100vh;-webkit-text-size-adjust:100%;overflow-x:hidden}

    /* ── Nav compacta — mismo patrón que entradas-equipo (sin cambios) ── */
    .top-nav{display:flex;align-items:center;gap:10px;padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:#fff;border-bottom:1.5px solid var(--gray-2);box-shadow:0 2px 8px rgba(0,0,0,.07);position:sticky;top:0;z-index:300}
    .nav-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
    .nav-logo img{height:26px;object-fit:contain}
    .nav-center{flex:1;min-width:0;padding:0 6px}
    .h-title{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;color:var(--gray-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
    .h-count{font-family:'Montserrat',sans-serif;font-size:11px;color:var(--gray-4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .nav-menu-btn{display:flex;align-items:center;justify-content:center;background:var(--red);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:16px;transition:background .15s;flex-shrink:0;cursor:pointer}
    .nav-menu-btn:hover{background:var(--red-dark)}
    .user-pill{display:inline-flex;align-items:center;background:var(--gray-1);border:1.5px solid var(--gray-2);color:var(--gray-4);padding:4px 10px;border-radius:14px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;max-width:140px;overflow:hidden}
    .user-pill .up-name{overflow:hidden;text-overflow:ellipsis;max-width:118px}

    /* ── Barra de filtros ── */
    /* top se ajusta en init() a la altura real de la nav (syncStickyTop) */
    #filterBar{background:#fff;border-bottom:1px solid var(--gray-2);padding:8px 12px;position:sticky;top:48px;z-index:200;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    /* grupo derecho: nunca se parte, asi el boton de refrescar no cae solo a otra fila */
    .fb-right{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-left:auto;min-width:0}
    .pill-opts{display:flex;background:var(--gray-1);border:1px solid var(--gray-2);border-radius:20px;padding:3px;gap:2px}
    .pill-opt{border:none;border-radius:18px;min-height:36px;padding:0 14px;font-family:'Open Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:none;color:var(--gray-4);transition:all .15s;white-space:nowrap}
    .pill-opt.on{background:#fff;color:var(--gray-5);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
    .team-chip{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--gray-3);color:var(--gray-5);padding:6px 12px;border-radius:18px;font-size:13px;font-weight:600;max-width:190px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .btn-team{min-height:32px;min-width:44px;padding:6px 4px;border:none;background:none;color:var(--gray-5);font-family:'Open Sans',sans-serif;font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;white-space:nowrap;flex-shrink:0}
    .btn-team:hover{color:var(--red)}
    .btn-refresh{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1.5px solid var(--gray-3);border-radius:50%;background:#fff;color:var(--gray-4);cursor:pointer;transition:all .15s;flex-shrink:0}
    .btn-refresh:hover{border-color:var(--red);color:var(--red)}
    .btn-refresh svg{width:18px;height:18px;display:block}
    .btn-refresh.spinning{animation:btnRefreshSpin .6s linear}
    @keyframes btnRefreshSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    main{padding:16px 12px 44px;max-width:920px;margin:0 auto}

    /* ── Estados de pantalla ── */
    .state-box{text-align:center;padding:48px 18px}
    .state-box h3{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:var(--gray-5);margin-bottom:6px}
    .state-box p{font-size:15px;color:var(--gray-4)}
    .btn-retry{min-height:44px;padding:0 20px;border:none;border-radius:10px;background:var(--red);color:#fff;font-family:'Open Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px}
    .btn-retry:hover{background:var(--red-dark)}

    /* ── Días ── */
    .day{margin-bottom:24px}
    .day-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;font-size:14px;font-weight:700;color:var(--gray-5)}
    .day-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-3);flex-shrink:0}
    .day.today .day-dot{background:var(--red)}
    .day-n{margin-left:auto;font-size:14px;font-weight:400;color:var(--gray-4)}
    .day-cards{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}

    /* ── Tarjeta ── */
    .card{background:#fff;border:1px solid var(--gray-2);border-left:4px solid var(--blue);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
    .card.salida{border-left-color:var(--red)}
    .c-top{display:flex;flex-direction:column;gap:2px}
    .tipo-badge{font-size:13px;font-weight:600;color:var(--gray-4)}
    .villa-name{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:var(--gray-5);line-height:1.3;word-break:break-word}
    .c-unit{font-family:'Open Sans',sans-serif;font-size:16px;font-weight:600;color:var(--gray-4)}
    .c-tag{display:inline-block;margin-left:8px;padding:1px 8px;border:1px solid var(--gray-3);border-radius:4px;font-family:'Open Sans',sans-serif;font-size:12px;font-weight:600;color:var(--gray-4);white-space:nowrap;vertical-align:middle}
    .ival{font-size:16px;color:var(--gray-5);word-break:break-word}
    .note{background:var(--gray-1);border-left:2px solid var(--gray-3);border-radius:8px;padding:10px 12px}
    .note-l{display:block;font-size:13px;font-weight:600;color:var(--gray-4)}
    .note-t{font-size:16px;color:var(--gray-5);white-space:pre-wrap;word-break:break-word}
    .c-addr{display:flex;align-items:flex-start;gap:6px;font-size:15px;color:var(--gray-4);line-height:1.4}
    .c-addr svg{width:16px;height:16px;flex-shrink:0;margin-top:3px}
    .c-addr>span{min-width:0;word-break:break-word}
    .c-maps{display:inline-block;color:var(--red);font-weight:600;text-decoration:none;white-space:nowrap;padding:12px 8px;margin:-12px -4px}
    .c-maps:hover{text-decoration:underline}
    .lnk-k{width:100%;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1.5px solid var(--gray-3);border-radius:10px;background:#fff;color:var(--gray-5);font-family:'Open Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
    .lnk-k svg{width:16px;height:16px;flex-shrink:0}
    .lnk-k.shown{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;letter-spacing:.5px;color:var(--gray-5)}
    .c-actions{display:flex;gap:8px;flex-wrap:wrap}
    .sbtn{flex:1 1 auto;gap:7px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;text-decoration:none;font-family:'Open Sans',sans-serif;font-size:15px;font-weight:700;padding:0 12px;text-align:center;white-space:nowrap;color:#fff}
    .sbtn-mark{font-weight:700;line-height:1}
    .sbtn.ok{background:var(--green)}
    .sbtn.pend{background:var(--orange)}
    .no-code{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;background:var(--gray-1);border-radius:10px;font-size:15px;font-weight:600;color:var(--gray-4);text-align:center}

    /* ── Selector de equipo ── */
    #teamModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:950;align-items:center;justify-content:center;padding:18px}
    #teamModal.open{display:flex}
    .tm-box{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);max-width:420px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
    .tm-head{padding:16px 18px;font-family:'Montserrat',sans-serif;font-size:17px;font-weight:800;color:var(--gray-5);border-bottom:1px solid var(--gray-2)}
    .tm-sub{font-family:'Open Sans',sans-serif;font-size:14px;font-weight:400;color:var(--gray-4);margin-top:4px}
    .tm-list{overflow-y:auto;padding:4px 0}
    .tm-item{width:100%;min-height:48px;display:flex;align-items:center;padding:0 18px;font-family:'Open Sans',sans-serif;font-size:16px;color:var(--gray-5);background:none;border:none;border-bottom:1px solid var(--gray-2);text-align:left;cursor:pointer}
    .tm-item:hover,.tm-item:active{background:var(--gray-1)}
    .tm-empty{padding:18px;font-size:15px;color:var(--gray-4);text-align:center}
    .tm-foot{padding:0 18px 16px;text-align:center}

    /* ══ SPINNER — corazón 3Villas ══ */
    img.spinner{display:block!important;width:56px!important;height:56px!important;margin:0 auto 12px!important;object-fit:contain!important;animation:spin-3v .9s linear infinite!important}
    @keyframes spin-3v{to{transform:rotate(360deg)}}

    @media(min-width:760px){
      .day-cards{grid-template-columns:repeat(2,1fr)}
      .lnk-k{width:auto;align-self:flex-start;padding:0 20px}
    }
    /* v7: aviso cuando la pantalla no ensena el equipo propio */
    .tm-banner{display:none;align-items:flex-start;flex-wrap:wrap;gap:10px;margin:0 0 12px;padding:12px 14px;background:#e8f0fb;border:1.5px solid var(--blue);border-left-width:4px;border-radius:10px;font-size:15px;color:var(--gray-5)}
    .tm-banner.on{display:flex}
    .tm-banner .tb-txt{flex:1 1 180px;min-width:0;line-height:1.45}
    .tm-banner .tb-btn{flex-shrink:0;min-height:44px;padding:0 14px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
    .tm-note{display:none;margin:0 0 12px;font-size:14px;color:var(--gray-4);line-height:1.45}
    .tm-note.on{display:block}
  </style>

<script>
// ════════════════ CONFIGURACIÓN ════════════════
const CFG = {
  workerUrl    : 'https://www.3villas.com/intranet/api',
  viewName     : 'Vi_villas_and_bookings2021',
  contactsTable: 'TaContacts',
  multiunitsTable: 'TaMultiunits',
};
const WORKER = CFG.workerUrl;
/* Mismos nombres de campo que entradas-equipo (mapa F) */
const F = {
  reservationId:'TaBookings2021_BookingID',confirmCode:'TaBookings2021_FS_confirmation_code',
  villaName:'TaVillas_Name_villa_para_inquilinos',
  checkIn:'TaBookings2021_Checkin',checkOut:'TaBookings2021_Checkout',
  checkinTime:'TaBookings2021_Checkin_time',checkoutTime:'TaBookings2021_Checkout_time',
  adults:'TaBookings2021_Adults',children:'TaBookings2021_Children',
  status:'TaBookings2021_BookingStatus',
  limpieza:'TaBookings2021_LimpiezaTerminada',
  wellcomePack:'TaBookings2021_Welcomepackentregado',
  cierre:'TaBookings2021_Checkoutcontrolado',
  cleaner:'TaVillas_Cleanning_team',
  cleaningNotes:'TaBookings2021_CleaningNotes',
  notasIrene:'TaBookings2021_keyholderNotes',
  guestInfo:'TaBookings2021_Guest_info',
  googleMaps:'TaVillas_Googlemaps_link',keyboxCode:'TaVillas_Keybox_code',
  address:'TaVillas_Address',
  multiunitId:'TaBookings2021_PMSmultiunitID',
};
/* Campo Sí/No de TaContacts que marca los equipos de limpieza */
const F_LIMPIEZA='Limpieza';
/* Únicas páginas a las que esta página puede enlazar con datos de reserva */
const TASK_PAGES = {
  limpieza:{page:'task-limpieza.html',type:'10'},
  wp      :{page:'task-wp.html',      type:'20'},
  cierre  :{page:'task-cierre.html',  type:'30'},
};
const LS_TEAM = '3v_cleaner_team';
const DIAS_RANGO = 7;              /* hoy + los 6 dias siguientes */
const FETCH_TIMEOUT_MS = 20000;    /* v2: ninguna carga se queda colgada */
const MSG_TIMEOUT   = 'La carga ha tardado demasiado. Pulsa el botón de refrescar para reintentar.';
const MSG_JOBS_ERR  = 'Error al cargar los trabajos';
const MSG_CONTACTS_ERR = 'Error al cargar los contactos';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// ════════════════ ESTADO ════════════════
let _team=null;          /* {id:Number, name:String} */
let _range='7d';         /* 'hoy' | 'manana' | '7d' */
let _rows=[];            /* reservas del rango */
let _cleaners=[];        /* contactos con Limpieza=Sí */
let _ownTeam=null;       /* v7: el equipo que identifica el email de la sesion, si lo hay */
let _manyMatches=false;  /* v7: el email sale en mas de un contacto de limpieza */
let _muMap=new Map();    /* multiunits: id -> keybox, 'name_'+id -> nombre */
let _muDone=false;
let _loadId=0;

const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined&&txt!==null)e.textContent=txt;return e;}
function g(r,key){const v=r[F[key]];return (v===null||v===undefined)?'':v;}

/* v2: toda petición lleva un tope de tiempo. Si el navegador no soporta
   AbortSignal.timeout se sigue sin él (el resto del código no cambia). */
function fetchOpts(){try{return {signal:AbortSignal.timeout(FETCH_TIMEOUT_MS)};}catch(e){return {};}}
function isTimeoutErr(err){const nm=err&&err.name;return nm==='TimeoutError'||nm==='AbortError';}
/* Error con un texto ya redactado en español (el único que se enseña tal cual) */
function shownError(msg){const e=new Error(msg);e.__shown=true;return e;}
/* Nunca se enseña el texto crudo de un parser ni el que venga del servidor */
function errText(err,fallback){
  if(isTimeoutErr(err))return MSG_TIMEOUT;
  if(err&&err.__shown)return err.message;
  return fallback;
}
/* 10. Solo se abre Maps si el enlace es https y el host es de Google Maps */
function safeMapsUrl(raw){
  const s=String(raw===null||raw===undefined?'':raw).trim();
  if(!/^https:\/\//i.test(s))return '';
  let u;try{u=new URL(s);}catch(e){return '';}
  if(u.protocol!=='https:')return '';
  const h=u.hostname.toLowerCase(),p=u.pathname;
  const tld='[a-z]{2,3}(?:\\.[a-z]{2,3})?';
  const isMapsPath=/^\/maps(\/|$)/.test(p);
  const ok =
      (new RegExp('^(?:www\\.)?google\\.'+tld+'$').test(h) && isMapsPath)
   || (new RegExp('^maps\\.google\\.'+tld+'$').test(h))
   || h==='maps.app.goo.gl'
   || (h==='goo.gl' && isMapsPath);
  return ok?u.href:'';
}

/* Copiado de entradas-equipo: lectura robusta de los Yes/No de Caspio */
function isOk(val){if(val===null||val===undefined)return null;if(typeof val==='boolean')return val;if(typeof val==='number'){if(val===0)return false;if(val===-1)return true;return val>0;}const s=String(val).trim().toLowerCase();if(!s)return null;return!['0','x','no','false','pendiente','n/a','na','null','none','–','-'].includes(s);}
function _clTruthy(v){return !!(v&&['1','-1','true','yes','sí','si'].includes(String(v).toLowerCase().trim()));}
function parseTimeMin(timeStr){if(!timeStr)return 9999;const clean=String(timeStr).trim();const m=clean.match(/^(\d{1,2})[:h](\d{2})/);if(m)return parseInt(m[1])*60+parseInt(m[2]);return 9999;}
function isCancelled(s){const x=String(s||'').toLowerCase();return x==='cancelled'||x.includes('cancel');}

/* Copiado de entradas-equipo (v110/v112): premium y WelcomePack especial */
function isPremiumEE(v){
  if(v===true) return true;
  var s=String(v===null||v===undefined?'':v).trim().toLowerCase();
  return s==='true'||s==='yes'||s==='y'||s==='1'||s==='sí'||s==='si';
}
function starFlags(r){
  var pv=(r['TaBookings2021_checkin_premium']!==undefined)?r['TaBookings2021_checkin_premium']:r['TaBookings2021_Checkin_premium'];
  var p=isPremiumEE(pv);
  var w=String(r['TaVillas_TipoWellcomepack']||'').trim()==='3';
  return {p:p,w:w};
}

// ════════════════ FECHAS ════════════════
function ymd(d){const m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;}
function todayDate(){const d=new Date();d.setHours(0,0,0,0);return d;}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dayPart(v){return String(v===null||v===undefined?'':v).trim().slice(0,10);}
function dayLabel(ds,idx){
  const d=new Date(ds+'T00:00:00');
  if(isNaN(d))return ds;
  const wd=d.toLocaleDateString('es-ES',{weekday:'long'});
  const txt=wd+' '+d.getDate()+' '+MESES[d.getMonth()];
  if(idx===0)return 'Hoy · '+txt;
  if(idx===1)return 'Mañana · '+txt;
  return txt;
}

// ════════════════ EQUIPO DE LIMPIEZA ════════════════
function storedTeam(){
  try{
    const raw=localStorage.getItem(LS_TEAM);if(!raw)return null;
    const o=JSON.parse(raw);const id=parseInt(o&&o.id,10);
    if(!(id>0))return null;
    return {id:id,name:String((o&&o.name)||('#'+id))};
  }catch(e){return null;}
}
function setTeam(t,persist){
  _team={id:t.id,name:t.name};
  if(persist){try{localStorage.setItem(LS_TEAM,JSON.stringify(_team));}catch(e){}}
  $('teamName').textContent=_team.name;
  $('teamChip').style.display='inline-flex';
  updateTeamBanner();
}
/* v7: la pantalla dice siempre de quien es el trabajo que se ve.
   - Si el email de la sesion identifica un equipo y se esta mirando otro,
     sale un aviso naranja con un boton para volver al propio.
   - Si el email no identifica ningun equipo (hoy le pasa a 24 de los 43
     usuarios con rol cleaner), sale una linea gris recordando que el equipo
     se ha elegido a mano. Sin aviso naranja: no es un error de la persona.
   - Si se esta mirando el equipo propio, no sale nada. */
function updateTeamBanner(){
  var ban=$('tmBanner'), txt=$('tmBannerTxt'), note=$('tmNote');
  if(!ban||!txt||!note)return;
  ban.classList.remove('on'); note.classList.remove('on');
  if(!_team)return;
  if(_ownTeam&&_ownTeam.id!==_team.id){
    txt.textContent='Estás viendo el trabajo de '+_team.name+'. No es tu equipo.';
    ban.classList.add('on');
    return;
  }
  if(!_ownTeam){
    note.textContent=(_manyMatches?'Tu correo aparece en más de un equipo. ':'')+'Estás viendo el equipo '+_team.name+'. Si no es el tuyo, pulsa Cambiar equipo.';
    note.classList.add('on');
  }
}
function openPicker(){
  const list=$('tmList');list.innerHTML='';
  /* 5: lista vacía = la carga no ha traído equipos; se ofrece reintentar */
  $('tmFoot').style.display=_cleaners.length?'none':'block';
  if(!_cleaners.length){list.appendChild(el('div','tm-empty','No hay equipos de limpieza en la lista de contactos.'));}
  _cleaners.forEach(c=>{
    const b=el('button','tm-item',c.name);
    b.type='button';
    b.addEventListener('click',()=>{closePicker();setTeam(c,true);loadJobs();});
    list.appendChild(b);
  });
  $('teamModal').classList.add('open');
}
function closePicker(){$('teamModal').classList.remove('open');}

// ════════════════ ESTADOS DE PANTALLA ════════════════
function showOnly(which,msg){
  ['stLoad','stErr','stEmpty'].forEach(id=>{$(id).style.display=(id===which)?'block':'none';});
  $('dayList').style.display=(which===null)?'block':'none';
  /* v7: el aviso de equipo habla de una lista; si no hay lista en pantalla
     (cargando, error o vacio) se esconde para no quedar huerfano encima. */
  var b=$('tmBanner'), n=$('tmNote');
  if(b)b.style.display=(which===null)?'':'none';
  if(n)n.style.display=(which===null)?'':'none';
  if(which==='stErr')$('errMsg').textContent=msg||'Error desconocido';
}
function showLoading(){showOnly('stLoad');}
function showError(msg){showOnly('stErr',msg);$('hCount').textContent='';$('hCountLabel').textContent='';}

// ════════════════ CARGA DE DATOS ════════════════
/* WHERE igual que entradas-equipo: cancelled fuera + equipo de limpieza (INTEGER)
   + check-in o check-out dentro del rango, con el mismo formato de fecha. */
function buildWhere(desde,hasta){
  const parts=[`${F.status}<>'cancelled'`];
  parts.push(`${F.cleaner}=${_team.id}`);
  parts.push(`((${F.checkIn}>='${desde}T00:00:00' AND ${F.checkIn}<='${hasta}T23:59:59') OR (${F.checkOut}>='${desde}T00:00:00' AND ${F.checkOut}<='${hasta}T23:59:59'))`);
  return parts.join(' AND ');
}

/* 1: mismo mapa de multiunits que entradas-equipo (loadMultiunits, línea 1308):
   id -> Keybox y 'name_'+id -> descripción. Una sola vez por sesión de página. */
async function loadMultiunits(){
  if(_muDone)return;
  try{
    const res=await fetch(Auth.url(`${WORKER}?action=data&table=${CFG.multiunitsTable}&limit=500`),fetchOpts());
    if(res.status===401){Auth.logout();return;}
    if(!res.ok)return;
    const json=await res.json();
    const rows=json.Result||json.result||[];
    rows.forEach(r=>{
      const id=String(r['multiunitID']||r['MultiunitID']||r['MultiUnitID']||'').trim();
      if(!id)return;
      _muMap.set(id,String(r['Keybox']||r['keybox']||'').trim());
      _muMap.set('name_'+id,String(r['descripcion']||r['Descripcion']||r['name']||r['Name']||'').trim());
    });
    _muDone=true;
  }catch(e){/* sin multiunits se sigue con los datos de la villa */}
}

/* Caspio rechaza el literal true en un campo Si/No: Limpieza=true devuelve
     HTTP 400 'Invalid column name'. Comprobado contra la base real el 14/09/2026. */
function contactsWhere(){return `${F_LIMPIEZA}=1`;}

async function loadIdentity(){
  showLoading();
  let email='';
  try{email=String((Auth.email&&Auth.email())||'').trim().toLowerCase();}catch(e){}
  try{
    const cUrl=`${WORKER}?action=data&table=${CFG.contactsTable}&where=${encodeURIComponent(contactsWhere())}&limit=500`;
    const res=await fetch(Auth.url(cUrl),fetchOpts());
    if(res.status===401){Auth.logout();return;}
    if(!res.ok)throw shownError('No se han podido cargar los contactos (HTTP '+res.status+')');
    const json=await res.json();
    if(json.error)throw new Error('respuesta con error');
    const rows=json.Result||json.result||[];
    _cleaners=rows
      .filter(c=>_clTruthy(c.Limpieza)&&c.ContactID!==null&&c.ContactID!==undefined)
      .map(c=>({id:parseInt(c.ContactID,10),name:String(c.Name||('#'+c.ContactID)),email:String(c.Email||'').trim().toLowerCase()}))
      .filter(c=>c.id>0)
      .sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}));
    /* 8: si el email sale en más de un equipo no se elige por orden alfabético.
       Manda el equipo guardado en el móvil; si no hay ninguno, decide la persona
       en el selector. */
    const matches=email?_cleaners.filter(c=>c.email===email):[];
    let mine=matches.length===1?matches[0]:null;
    _ownTeam=mine?{id:mine.id,name:mine.name}:null;   /* v7 */
    _manyMatches=matches.length>1;                    /* v7 */
    if(!mine)mine=storedTeam();
    if(!mine){showOnly(null);$('dayList').innerHTML='';openPicker();return;}
    setTeam(mine,false);
    loadJobs();
  }catch(err){
    showError(errText(err,MSG_CONTACTS_ERR));
  }
}

async function loadJobs(){
  if(!_team){loadIdentity();return;}
  const myId=++_loadId;
  showLoading();
  /* 9: la ventana es hoy + los 6 días siguientes = 7 días en total */
  const desde=ymd(todayDate()),hasta=ymd(addDays(todayDate(),DIAS_RANGO-1));
  const where=buildWhere(desde,hasta);
  const url=`${CFG.workerUrl}?action=view&view=${encodeURIComponent(CFG.viewName)}&where=${encodeURIComponent(where)}&orderBy=${encodeURIComponent(F.checkIn)}&limit=500`;
  try{
    const muP=loadMultiunits();
    const res=await fetch(Auth.url(url),fetchOpts());
    if(myId!==_loadId)return;
    if(res.status===401){Auth.logout();return;}
    if(!res.ok)throw shownError('No se han podido cargar tus trabajos (HTTP '+res.status+')');
    const json=await res.json();
    if(json.error)throw new Error('respuesta con error');
    const raw=json.Result||json.result||[];
    await muP; /* los nombres y códigos de unidad ya están antes de pintar */
    if(myId!==_loadId)return;
    /* dedup por código de reserva, igual que entradas-equipo */
    const seen=new Set();
    _rows=raw.filter(r=>{const key=r[F.confirmCode]||r[F.reservationId]||'';if(!key)return true;if(seen.has(key))return false;seen.add(key);return true;});
    render();
  }catch(err){
    if(myId!==_loadId)return;
    showError(errText(err,MSG_JOBS_ERR));
  }
}

// ════════════════ AGRUPACIÓN POR DÍA ════════════════
function jobsForDay(ds){
  const out=[];
  _rows.forEach(r=>{
    if(isCancelled(g(r,'status')))return; /* refuerzo del WHERE */
    if(dayPart(g(r,'checkOut'))===ds)out.push({r:r,type:'salida'});
    if(dayPart(g(r,'checkIn'))===ds)out.push({r:r,type:'entrada'});
  });
  /* mismo día y misma villa: primero la SALIDA, después la ENTRADA */
  out.sort((a,b)=>{
    if(a.type!==b.type)return a.type==='salida'?-1:1;
    const at=parseTimeMin(a.type==='salida'?g(a.r,'checkoutTime'):g(a.r,'checkinTime'));
    const bt=parseTimeMin(b.type==='salida'?g(b.r,'checkoutTime'):g(b.r,'checkinTime'));
    if(at!==bt)return at-bt;
    return String(g(a.r,'villaName')).localeCompare(String(g(b.r,'villaName')),'es',{sensitivity:'base'});
  });
  return out;
}

function visibleDays(){
  const t=todayDate();
  if(_range==='hoy')return [{ds:ymd(t),idx:0}];
  if(_range==='manana')return [{ds:ymd(addDays(t,1)),idx:1}];
  const out=[];
  for(let i=0;i<DIAS_RANGO;i++)out.push({ds:ymd(addDays(t,i)),idx:i});
  return out;
}
function rangeLabel(){return _range==='hoy'?'hoy':(_range==='manana'?'mañana':DIAS_RANGO+' días');}

// ════════════════ RENDER ════════════════
function render(){
  const wrap=$('dayList');
  wrap.innerHTML='';
  let total=0;
  visibleDays().forEach(d=>{
    const jobs=jobsForDay(d.ds);
    if(!jobs.length)return;
    total+=jobs.length;
    const box=el('div','day'+(d.idx===0?' today':''));
    const head=el('div','day-head');
    head.appendChild(el('span','day-dot'));
    head.appendChild(el('span',null,dayLabel(d.ds,d.idx)));
    head.appendChild(el('span','day-n',jobs.length+(jobs.length===1?' trabajo':' trabajos')));
    box.appendChild(head);
    const cards=el('div','day-cards');
    jobs.forEach(j=>cards.appendChild(buildCard(j.r,j.type)));
    box.appendChild(cards);
    wrap.appendChild(box);
  });
  $('hCount').textContent=total;
  $('hCountLabel').textContent=(total===1?' trabajo · ':' trabajos · ')+rangeLabel();
  if(!total){
    $('emptyTitle').textContent = _range==='hoy'?'No tienes trabajos hoy'
      : (_range==='manana'?'No tienes trabajos mañana'
      : 'No tienes trabajos en los próximos '+DIAS_RANGO+' días');
    showOnly('stEmpty');
  }else{
    showOnly(null);
  }
}

/* URL de las páginas de reportar hecho. Mismos parámetros que entradas-equipo
   (líneas 1878-1880): Idreserva = código de confirmación, Tasktype_booking 10/20/30
   y code con el mismo valor. Aquí, además, los valores van con encodeURIComponent
   y la página destino sale siempre de TASK_PAGES (lista blanca). */
function taskUrl(kind,code){
  const t=TASK_PAGES[kind];
  if(!t||!code)return '';
  const c=encodeURIComponent(String(code));
  return `${t.page}?Idreserva=${c}&Tasktype_booking=${t.type}&code=${c}`;
}

/* Iconos de línea. Toda la página tiene tres: pin (dirección), llave (caja de
   llaves) y flecha de refrescar. Nada más es un icono: el resto es texto. */
const SVG_NS='http://www.w3.org/2000/svg';
const ICON_PATHS={
  pin:[['path',{d:'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z'}],['circle',{cx:'12',cy:'10',r:'3'}]],
  key:[['circle',{cx:'7',cy:'12',r:'3.5'}],['path',{d:'M10.5 12H21M18 12v3.5M14.5 12v2.5'}]],
};
function icon(kind){
  const svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');
  svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.8');
  svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');
  svg.setAttribute('aria-hidden','true');
  (ICON_PATHS[kind]||[]).forEach(function(p){
    const e=document.createElementNS(SVG_NS,p[0]);
    Object.keys(p[1]).forEach(function(k){e.setAttribute(k,p[1][k]);});
    svg.appendChild(e);
  });
  return svg;
}

/* Un solo párrafo de datos: personas, reparto y extras del formulario. */
const EXTRAS_MAX=60;
function factsText(r){
  const ad=parseInt(g(r,'adults'),10)||0,ni=parseInt(g(r,'children'),10)||0,pax=ad+ni;
  const parts=[];
  if(pax){
    parts.push(pax+(pax===1?' persona':' personas'));
    const who=[];
    if(ad)who.push(ad+(ad===1?' adulto':' adultos'));
    if(ni)who.push(ni+(ni===1?' niño':' niños'));
    if(who.length)parts.push(who.join(', '));
  }else{
    parts.push('Sin datos de personas');
  }
  const ex=String(g(r,'guestInfo')||'').trim().replace(/\s+/g,' ');
  if(ex)parts.push(ex.length>EXTRAS_MAX?ex.slice(0,EXTRAS_MAX).trim()+'…':ex);
  return parts.join(' · ');
}

/* Botón de estado. Es el único color de la tarjeta junto al borde izquierdo. */
function statusBtn(label,doneWord,rawOk,href){
  const ok=isOk(rawOk)===true;
  const a=el('a','sbtn '+(ok?'ok':'pend'));
  a.href=href||'#';
  if(ok)a.appendChild(el('span','sbtn-mark','✓'));
  a.appendChild(el('span',null,label+' · '+(ok?doneWord:'pendiente')));
  return a;
}

function noteBox(label,txt){
  const box=el('div','note');
  box.appendChild(el('span','note-l',label));
  box.appendChild(el('div','note-t',String(txt)));
  return box;
}

/* 1: unidad de un multiunit. Mismo criterio que entradas-equipo (getMuNames,
   línea 2109, y la preferencia de keybox de las líneas 1846-1847): manda el
   nombre y el código de la UNIDAD; el de la villa solo si la unidad no tiene. */
function muInfo(r){
  const id=String(g(r,'multiunitId')||'').trim();
  if(!id)return{id:'',name:'',keybox:''};
  return{id:id,name:String(_muMap.get('name_'+id)||''),keybox:String(_muMap.get(id)||'')};
}

function buildCard(r,type){
  const isSalida=type==='salida';
  const card=el('div','card'+(isSalida?' salida':''));

  /* ── Cabecera: tipo y hora, después el nombre ── */
  const top=el('div','c-top');
  const hora=String((isSalida?(g(r,'checkoutTime')||g(r,'checkinTime')):g(r,'checkinTime'))||'').trim();
  top.appendChild(el('div','tipo-badge',(isSalida?'Salida':'Entrada')+' · '+(hora||'sin hora')));
  const mu=muInfo(r);
  const name=el('div','villa-name',String(g(r,'villaName')||g(r,'confirmCode')||'Villa sin nombre'));
  if(mu.name)name.appendChild(el('span','c-unit',' · '+mu.name));
  const sf=starFlags(r);
  if(sf.p)name.appendChild(el('span','c-tag','Premium'));
  if(sf.w)name.appendChild(el('span','c-tag','WelcomePack especial'));
  top.appendChild(name);
  card.appendChild(top);

  /* ── Datos en una línea ── */
  card.appendChild(el('p','ival',factsText(r)));

  /* ── Notas ── */
  const nl=String(g(r,'cleaningNotes')||'').trim();
  const ni2=String(g(r,'notasIrene')||'').trim();
  if(nl)card.appendChild(noteBox('Notas de limpieza',nl));
  if(ni2)card.appendChild(noteBox('Notas del villa manager',ni2));

  /* ── Dirección y Maps (10: solo hosts de Google Maps por https) ── */
  const addr=String(g(r,'address')||'').trim();
  const mp=safeMapsUrl(g(r,'googleMaps'));
  if(addr||mp){
    const row=el('div','c-addr');
    row.appendChild(icon('pin'));
    const txt=el('span',null,addr);
    if(mp){
      const a=el('a','c-maps','Maps');
      a.href=mp;a.target='_blank';a.rel='noopener noreferrer';
      if(addr)txt.appendChild(document.createTextNode(' '));
      txt.appendChild(a);
    }
    row.appendChild(txt);
    card.appendChild(row);
  }

  /* ── Caja de llaves ── */
  const kb=mu.keybox||String(g(r,'keyboxCode')||'').trim();
  if(kb){
    /* El código vive solo en esta variable hasta que el usuario pulsa.
       Nunca se escribe en el DOM inicial ni en la consola. */
    const b=el('button','lnk-k');
    b.type='button';
    b.appendChild(icon('key'));
    b.appendChild(el('span',null,'Ver código de la caja'));
    b.addEventListener('click',function(){
      b.textContent='';
      b.classList.add('shown');
      b.appendChild(el('span',null,kb));
      b.disabled=true;
    });
    card.appendChild(b);
  }

  /* ── Botones de estado ── */
  const acts=el('div','c-actions');
  const code=String(g(r,'confirmCode')||'').trim();
  if(!code){
    /* 12: sin código no hay página de tarea a la que ir; se dice, no se enlaza */
    acts.appendChild(el('div','no-code','Sin código de reserva'));
  }else if(isSalida){
    acts.appendChild(statusBtn('Cierre','hecho',g(r,'cierre'),taskUrl('cierre',code)));
  }else{
    acts.appendChild(statusBtn('Limpieza','hecha',g(r,'limpieza'),taskUrl('limpieza',code)));
    acts.appendChild(statusBtn('WelcomePack','entregado',g(r,'wellcomePack'),taskUrl('wp',code)));
  }
  card.appendChild(acts);
  return card;
}

// ════════════════ UI ════════════════
function setRange(v){
  _range=v;
  $('pHoy').classList.toggle('on',v==='hoy');
  $('pManana').classList.toggle('on',v==='manana');
  $('p7d').classList.toggle('on',v==='7d');

function manualRefresh(btn){
  if(btn){btn.classList.remove('spinning');void btn.offsetWidth;btn.classList.add('spinning');}
  if(_team)loadJobs();else loadIdentity();
}

/* 4: la nav es sticky y su alto cambia con el ancho de pantalla; el top de la
   barra de filtros se mide, no se supone. */
function syncStickyTop(){
  const nav=document.querySelector('.top-nav'),fb=$('filterBar');
  if(nav&&fb)fb.style.top=nav.offsetHeight+'px';
}

function init(){
  try{const n=(Auth.name&&Auth.name())||'';if(n)$('hUserName').textContent=n;}catch(e){}
  syncStickyTop();
  window.addEventListener('resize',syncStickyTop);
  /* la nav crece cuando entra Montserrat: se vuelve a medir al cargar la fuente */
  try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(syncStickyTop).catch(()=>{});}catch(e){}
  $('pHoy').addEventListener('click',()=>setRange('hoy'));
  $('pManana').addEventListener('click',()=>setRange('manana'));
  $('p7d').addEventListener('click',()=>setRange('7d'));
  $('btnRefresh').addEventListener('click',function(){manualRefresh(this);});
  $('btnRetry').addEventListener('click',()=>{if(_team)loadJobs();else loadIdentity();});
  $('btnTmRetry').addEventListener('click',()=>{closePicker();loadIdentity();});
  $('btnChangeTeam').addEventListener('click',()=>{if(_cleaners.length)openPicker();else loadIdentity();});
  $('btnBackToMine').addEventListener('click',()=>{if(_ownTeam){setTeam(_ownTeam,true);loadJobs();}});
  $('btnMenu').addEventListener('click',()=>{try{NavComponent.open();}catch(e){}});
  $('teamModal').addEventListener('click',e=>{if(e.target===$('teamModal')&&_team)closePicker();});
  loadIdentity();
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script>
